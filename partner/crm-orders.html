<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мои заказы — Partner CRM</title><script src="./config.js"></script><link rel="stylesheet" href="./crm.css"></head><body><div class="crm-shell"><aside class="crm-side"><div class="crm-brand"><b>Partner CRM</b><small id="partnerName">Загрузка…</small></div><nav class="crm-nav"><a href="./crm.html"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10H3Z"/><path d="M9 21v-6h6v6"/></svg><span>Главная</span></a><a href="./crm-customers.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M17 11a4 4 0 0 1 4 4v2"/></svg><span>Мои клиенты</span></a><a class="active" href="./crm-orders.html"><svg viewBox="0 0 24 24"><path d="M4 5h2l2 10h9l2-7H7"/><circle cx="10" cy="19" r="1"/><circle cx="17" cy="19" r="1"/></svg><span>Мои заказы</span></a><a href="./index.html"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4Z"/><path d="m8 12 3 3 5-6"/></svg><span>Заказать у A4PRINT</span></a></nav></aside><main class="crm-main"><header class="crm-top"><div><h1>Мои заказы</h1><p>Заказы ваших клиентов, выручка, себестоимость и прибыль</p></div><button class="btn" id="add">+ Новый заказ</button></header><section class="stats"><div class="stat"><span>Всего</span><strong id="all">0</strong></div><div class="stat"><span>В работе</span><strong id="active">0</strong></div><div class="stat"><span>Продажи</span><strong id="sales">0 ₽</strong></div><div class="stat"><span>Прибыль</span><strong id="profit">0 ₽</strong></div></section><section class="card"><div class="toolbar"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" placeholder="Поиск по номеру, названию или клиенту…"></div><select id="filter" style="padding:11px;border:1px solid #dbe3ee;border-radius:11px"><option value="">Все статусы</option><option value="NEW">Новый</option><option value="ESTIMATE">Расчёт</option><option value="APPROVAL">Согласование</option><option value="IN_PROGRESS">В работе</option><option value="READY">Готов</option><option value="COMPLETED">Завершён</option><option value="CANCELLED">Отменён</option></select></div><div class="list" id="list"><div class="empty">Загрузка…</div></div></section></main></div><div class="modalback" id="modal"><form class="modal" id="form"><h2>Новый заказ клиента</h2><div class="formgrid"><div class="field"><label>Клиент</label><select id="customer"><option value="">Без клиента</option></select></div><div class="field"><label>Статус</label><select id="status"><option value="NEW">Новый</option><option value="ESTIMATE">Расчёт</option><option value="APPROVAL">Согласование</option><option value="IN_PROGRESS">В работе</option><option value="READY">Готов</option><option value="COMPLETED">Завершён</option></select></div><div class="field full"><label>Название заказа *</label><input id="title" required placeholder="Например: 100 визиток"></div><div class="field"><label>Сумма продажи, ₽</label><input id="sale" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Себестоимость / подряд, ₽</label><input id="cost" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Предоплата, ₽</label><input id="prepaid" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Срок</label><input id="due" type="date"></div><div class="field full"><label>Описание</label><textarea id="description" rows="4"></textarea></div></div><div id="err" class="error"></div><div class="modal-actions"><button type="button" class="btn secondary" id="cancel">Отмена</button><button class="btn">Создать заказ</button></div></form></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.A4PRINT_PARTNER_CONFIG,s=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));const labels={NEW:'Новый',ESTIMATE:'Расчёт',APPROVAL:'Согласование',IN_PROGRESS:'В работе',READY:'Готов',COMPLETED:'Завершён',CANCELLED:'Отменён'};let rows=[],customers=[],pu;const{data:{session}}=await s.auth.getSession();if(!session)location.href='./login.html';{const{data,error}=await s.from('partner_users').select('id,partner_id,partners(name,is_active)').maybeSingle();if(error||!data||!data.partners?.is_active){await s.auth.signOut();location.href='./login.html'}pu=data;$('partnerName').textContent=data.partners.name}async function load(){const[{data:o,error},{data:c}]=await Promise.all([s.from('partner_crm_orders').select('*,partner_crm_customers(id,full_name,company_name)').order('updated_at',{ascending:false}),s.from('partner_crm_customers').select('id,full_name,company_name').order('full_name')]);if(error){$('list').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=o||[];customers=c||[];$('customer').innerHTML='<option value="">Без клиента</option>'+customers.map(x=>`<option value="${x.id}">${esc(x.full_name)}${x.company_name?' — '+esc(x.company_name):''}</option>`).join('');const preset=new URLSearchParams(location.search).get('customer');if(preset&&customers.some(x=>x.id===preset))$('customer').value=preset;render()}function render(){const q=$('search').value.trim().toLowerCase(),st=$('filter').value;const a=rows.filter(o=>(!st||o.status===st)&&`${o.order_number} ${o.title||''} ${o.partner_crm_customers?.full_name||''} ${o.partner_crm_customers?.company_name||''}`.toLowerCase().includes(q));$('all').textContent=rows.length;$('active').textContent=rows.filter(x=>!['COMPLETED','CANCELLED'].includes(x.status)).length;$('sales').textContent=money(rows.reduce((a,x)=>a+Number(x.sale_total||0),0));$('profit').textContent=money(rows.reduce((a,x)=>a+Number(x.sale_total||0)-Number(x.production_cost||0),0));$('list').innerHTML=a.map(o=>{const profit=Number(o.sale_total||0)-Number(o.production_cost||0);return`<div class="row"><div class="row-head"><div><b>№${o.order_number} · ${esc(o.title)}</b><div class="muted">${esc(o.partner_crm_customers?.full_name||'Без клиента')}${o.due_date?' · срок '+new Date(o.due_date).toLocaleDateString('ru-RU'):''}</div></div><span class="badge">${esc(labels[o.status]||o.status)}</span></div><div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:10px"><span>Продажа <b>${money(o.sale_total)}</b></span><span>Себестоимость <b>${money(o.production_cost)}</b></span><span>Прибыль <b>${money(profit)}</b></span></div><div class="actions"><select data-status="${o.id}" style="padding:7px;border:1px solid #dbe3ee;border-radius:9px">${Object.entries(labels).map(([v,n])=>`<option value="${v}" ${v===o.status?'selected':''}>${n}</option>`).join('')}</select>${o.a4print_order_id?'<span class="badge">Передан в A4PRINT</span>':`<a class="linkbtn" href="./index.html">Передать в A4PRINT</a>`}</div></div>`}).join('')||'<div class="empty">Заказов не найдено</div>';document.querySelectorAll('[data-status]').forEach(el=>el.onchange=async()=>{const{error}=await s.from('partner_crm_orders').update({status:el.value,updated_at:new Date().toISOString()}).eq('id',el.dataset.status);if(error)alert(error.message);else await load()})}$('search').oninput=render;$('filter').onchange=render;$('add').onclick=()=>{$('form').reset();$('err').textContent='';const preset=new URLSearchParams(location.search).get('customer');if(preset)$('customer').value=preset;$('modal').classList.add('open')};$('cancel').onclick=()=> $('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('form').onsubmit=async e=>{e.preventDefault();const val=id=>$(id).value.trim();const{error}=await s.from('partner_crm_orders').insert({partner_id:pu.partner_id,created_by:pu.id,customer_id:val('customer')||null,title:val('title'),status:val('status'),sale_total:Number(val('sale'))||0,production_cost:Number(val('cost'))||0,prepaid:Number(val('prepaid'))||0,due_date:val('due')||null,description:val('description')||null});if(error){$('err').textContent=error.message;return}$('modal').classList.remove('open');history.replaceState({},'', './crm-orders.html');await load()};await load();</script></body></html>
