<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner CRM — A4PRINT</title><script src="./config.js"></script><link rel="stylesheet" href="./crm.css"></head><body><div class="crm-shell"><aside class="crm-side"><div class="crm-brand"><b>Partner CRM</b><small id="partnerName">Загрузка…</small></div><nav class="crm-nav"><a class="active" href="./crm.html"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10H3Z"/><path d="M9 21v-6h6v6"/></svg><span>Главная</span></a><a href="./crm-customers.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M17 11a4 4 0 0 1 4 4v2"/></svg><span>Мои клиенты</span></a><a href="./crm-orders.html"><svg viewBox="0 0 24 24"><path d="M4 5h2l2 10h9l2-7H7"/><circle cx="10" cy="19" r="1"/><circle cx="17" cy="19" r="1"/></svg><span>Мои заказы</span></a><a href="./index.html"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4Z"/><path d="m8 12 3 3 5-6"/></svg><span>Заказать у A4PRINT</span></a></nav></aside><main class="crm-main"><header class="crm-top"><div><h1>CRM партнёра</h1><p>Клиенты, продажи и внутренние заказы вашей компании</p></div><button class="btn secondary" id="logout">Выйти</button></header><section class="stats"><div class="stat"><span>Клиентов</span><strong id="customersCount">0</strong></div><div class="stat"><span>Активных заказов</span><strong id="activeCount">0</strong></div><div class="stat"><span>Продажи</span><strong id="sales">0 ₽</strong></div><div class="stat"><span>Валовая прибыль</span><strong id="profit">0 ₽</strong></div></section><section class="grid2"><article class="card"><h2>Последние клиенты</h2><div id="customers"><div class="empty">Загрузка…</div></div></article><article class="card"><h2>Последние заказы</h2><div id="orders"><div class="empty">Загрузка…</div></div></article></section></main></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.A4PRINT_PARTNER_CONFIG,s=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));const{data:{session}}=await s.auth.getSession();if(!session)location.href='./login.html';const{data:pu,error}=await s.from('partner_users').select('id,full_name,partner_id,partners(name,is_active)').maybeSingle();if(error||!pu||!pu.partners?.is_active){await s.auth.signOut();location.href='./login.html'}$('partnerName').textContent=pu.partners.name;const[{data:cs},{data:os}]=await Promise.all([s.from('partner_crm_customers').select('id,full_name,company_name,phone,created_at').order('updated_at',{ascending:false}),s.from('partner_crm_orders').select('id,order_number,title,status,sale_total,production_cost,created_at').order('updated_at',{ascending:false})]);const customers=cs||[],orders=os||[];$('customersCount').textContent=customers.length;$('activeCount').textContent=orders.filter(x=>!['COMPLETED','CANCELLED'].includes(x.status)).length;$('sales').textContent=money(orders.reduce((a,x)=>a+Number(x.sale_total||0),0));$('profit').textContent=money(orders.reduce((a,x)=>a+Number(x.sale_total||0)-Number(x.production_cost||0),0));$('customers').innerHTML=customers.slice(0,6).map(c=>`<div class="row"><b>${esc(c.full_name)}</b><div class="muted">${esc(c.company_name||c.phone||'Клиент')}</div></div>`).join('')||'<div class="empty">Добавьте первого клиента</div>';$('orders').innerHTML=orders.slice(0,6).map(o=>`<div class="row"><div class="row-head"><b>№${o.order_number} · ${esc(o.title)}</b><span class="badge">${esc(o.status)}</span></div><div class="muted">${new Date(o.created_at).toLocaleDateString('ru-RU')}</div><div class="amount">${money(o.sale_total)}</div></div>`).join('')||'<div class="empty">Заказов пока нет</div>';$('logout').onclick=async()=>{await s.auth.signOut();location.href='./login.html'};</script></body></html>
