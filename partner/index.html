<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A4PRINT Partner Portal</title><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#0f172a;font-family:Arial,sans-serif}.top{background:#0f172a;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;gap:18px;align-items:center}.top h1{font-size:20px;margin:0}.top small{color:#cbd5e1}.top button{background:#fff;color:#0f172a}.wrap{width:min(1180px,calc(100% - 32px));margin:24px auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat,.card{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:18px}.stat span{color:#64748b;font-size:12px}.stat strong{display:block;font-size:26px;margin-top:5px}.grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:18px}.card h2{margin:0 0 14px}.field{display:grid;gap:6px;margin-bottom:10px;font-size:13px;color:#475569}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #dbe1ea;border-radius:10px;font:inherit}.field textarea{min-height:100px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:10px 13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.order{padding:14px 0;border-bottom:1px solid #eef2f7}.order:last-child{border-bottom:0}.order-head{display:flex;justify-content:space-between;gap:12px}.muted{color:#64748b;font-size:12px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:800}.price{font-size:22px;font-weight:900}.service-note{font-size:12px;color:#64748b;margin-top:5px}.empty{padding:24px;text-align:center;color:#94a3b8}.msg{margin-top:8px;font-size:13px}.success{color:#166534}.error{color:#b91c1c}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.two{grid-template-columns:1fr}}</style></head><body><header class="top"><div><h1>A4PRINT Partner Portal</h1><small id="partnerName">Загрузка…</small></div><button id="logout">Выйти</button></header><main class="wrap"><section class="stats"><div class="stat"><span>Всего заказов</span><strong id="allCount">0</strong></div><div class="stat"><span>В работе</span><strong id="workCount">0</strong></div><div class="stat"><span>Готовы</span><strong id="readyCount">0</strong></div></section><section class="grid"><article class="card"><h2>Новый заказ</h2><form id="orderForm"><label class="field">Услуга<select id="service" required><option value="">Выберите услугу</option></select></label><div id="serviceInfo" class="service-note"></div><div class="two"><label class="field">Количество<input id="qty" type="number" min="0.001" step="0.001" value="1" required></label><label class="field">Ориентир по сумме, ₽<input id="requestedTotal" type="number" min="0" step="0.01" value="0"></label></div><label class="field">Параметры заказа<textarea id="parameters" placeholder="Размер, материал, цвет, тираж, требования к макету, срок и другие детали"></textarea></label><label class="field">Комментарий<textarea id="comment" placeholder="Дополнительная информация для менеджера"></textarea></label><button type="submit" id="sendOrder">Отправить заказ</button><div id="formMsg" class="msg"></div></form></article><article class="card"><h2>Мои заказы</h2><div id="orders"><div class="empty">Загрузка…</div></div></article></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.A4PRINT_PARTNER_CONFIG,supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB'}).format(Number(v||0));const labels={NEW:'Новый',CONFIRMED:'Подтверждён',IN_PROGRESS:'В работе',READY:'Готов',COMPLETED:'Завершён',ON_HOLD:'На паузе',CANCELLED:'Отменён'};let services=[],partner=null,partnerUser=null;const{data:{session}}=await supabase.auth.getSession();if(!session)location.href='./login.html';async function init(){const{data:pu,error}=await supabase.from('partner_users').select('id,full_name,email,partner_id,is_active,partners(id,name,discount_percent,is_active)').maybeSingle();if(error||!pu||!pu.is_active||!pu.partners?.is_active){await supabase.auth.signOut();location.href='./login.html';return}partnerUser=pu;partner=pu.partners;$('partnerName').textContent=`${partner.name} · ${pu.full_name}`;await Promise.all([loadServices(),loadOrders()])}async function loadServices(){const[{data:ss,error},{data:ov,error:oe}]=await Promise.all([supabase.from('partner_services').select('*').eq('is_active',true).order('sort_order'),supabase.from('partner_price_overrides').select('partner_service_id,price').eq('partner_id',partner.id)]);if(error)throw error;if(oe)throw oe;const map=Object.fromEntries((ov||[]).map(x=>[x.partner_service_id,Number(x.price)]));services=(ss||[]).map(x=>({...x,effective_price:map[x.id]??Number(x.partner_price||0)??Number(x.base_price||0)}));$('service').innerHTML='<option value="">Выберите услугу</option>'+services.map(x=>`<option value="${x.id}">${esc(x.category)} — ${esc(x.name)}</option>`).join('');renderServiceInfo()}function renderServiceInfo(){const x=services.find(v=>v.id===$('service').value);if(!x){$('serviceInfo').textContent='';return}const p=Number(x.effective_price||0);$('serviceInfo').innerHTML=`${esc(x.description||'')}<br>${p>0?`Партнёрская цена: <b>${money(p)}</b> / ${esc(x.unit)}`:`${esc(x.price_note||'Индивидуальный расчёт после проверки заказа')}`}`;if(p>0)$('requestedTotal').value=(p*(Number($('qty').value)||1)).toFixed(2)}async function loadOrders(){const{data,error}=await supabase.from('orders').select('id,order_number,status,total,customer_comment,model_name,created_at,order_items(name,quantity,unit_price,total_price,parameters)').eq('partner_id',partner.id).order('created_at',{ascending:false});if(error)throw error;const rows=data||[];$('allCount').textContent=rows.length;$('workCount').textContent=rows.filter(x=>['NEW','CONFIRMED','IN_PROGRESS','ON_HOLD'].includes(x.status)).length;$('readyCount').textContent=rows.filter(x=>x.status==='READY').length;$('orders').innerHTML=rows.map(o=>`<div class="order"><div class="order-head"><div><b>Заказ №${esc(o.order_number)}</b><div class="muted">${new Date(o.created_at).toLocaleString('ru-RU')} · ${esc(o.model_name||o.order_items?.[0]?.name||'Заказ')}</div></div><span class="badge">${esc(labels[o.status]||o.status)}</span></div><div style="margin-top:8px"><span class="price">${money(o.total)}</span></div>${o.customer_comment?`<div class="muted" style="margin-top:7px">${esc(o.customer_comment)}</div>`:''}</div>`).join('')||'<div class="empty">Заказов пока нет</div>'}$('service').onchange=renderServiceInfo;$('qty').oninput=renderServiceInfo;$('orderForm').onsubmit=async e=>{e.preventDefault();$('sendOrder').disabled=true;$('formMsg').className='msg';$('formMsg').textContent='Отправка…';const params={details:$('parameters').value.trim()};const{data,error}=await supabase.rpc('create_partner_order',{p_service_id:$('service').value,p_quantity:Number($('qty').value)||1,p_customer_comment:$('comment').value.trim()||null,p_parameters:params,p_requested_total:Number($('requestedTotal').value)||0});if(error){$('formMsg').className='msg error';$('formMsg').textContent='Ошибка: '+error.message}else{$('formMsg').className='msg success';$('formMsg').textContent='Заказ отправлен в A4PRINT HUB.';$('orderForm').reset();$('qty').value=1;$('requestedTotal').value=0;renderServiceInfo();await loadOrders()}$('sendOrder').disabled=false};$('logout').onclick=async()=>{await supabase.auth.signOut();location.href='./login.html'};try{await init()}catch(e){console.error(e);$('orders').innerHTML=`<div class="empty">Ошибка: ${esc(e.message)}</div>`}</script></body></html>
