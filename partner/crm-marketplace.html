<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Биржа заказов — Partner CRM</title><script src="./config.js"></script><link rel="stylesheet" href="./crm.css"><style>.filters{display:grid;grid-template-columns:1fr 240px auto;gap:10px;margin-bottom:16px}.filters input,.filters select{width:100%;padding:11px 12px;border:1px solid #dbe1ea;border-radius:10px;font:inherit}.jobs{display:grid;gap:12px}.job{border:1px solid #e5eaf1;border-radius:16px;padding:16px;background:#fff}.job-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.job h3{margin:0 0 5px}.job-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800}.budget{font-size:22px;font-weight:900}.contacts{margin-top:10px;padding:10px 12px;background:#f8fafc;border-radius:10px;font-size:13px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:1px solid #dbe1ea;background:#fff;color:#334155}.tab.active{background:#0f172a;color:#fff}.empty{padding:30px;text-align:center;color:#94a3b8;border:1px dashed #dbe1ea;border-radius:14px}@media(max-width:800px){.filters{grid-template-columns:1fr}.job-head{flex-direction:column}}</style></head><body><div class="crm-shell"><aside class="crm-side"><div class="crm-brand"><b>Partner CRM</b><small id="partnerName">Загрузка…</small></div><nav class="crm-nav"><a href="./crm.html"><span>Главная</span></a><a href="./crm-customers.html"><span>Мои клиенты</span></a><a href="./crm-orders.html"><span>Мои заказы</span></a><a class="active" href="./crm-marketplace.html"><span>Биржа заказов</span></a><a href="./crm-prices.html"><span>Прайс-листы</span></a><a href="./index.html"><span>Заказать у A4PRINT</span></a></nav></aside><main class="crm-main"><header class="crm-top"><div><h1>Биржа заказов</h1><p>Выберите подходящую заявку клиента и возьмите её в работу</p></div><a class="btn secondary" href="./crm.html">В CRM</a></header><section class="card"><div class="tabs"><button class="btn tab active" data-tab="open">Свободные заявки</button><button class="btn tab" data-tab="mine">Мои заявки</button></div><div class="filters" id="filters"><input id="q" placeholder="Поиск по услуге или описанию"><select id="category"><option value="">Все категории</option></select><button class="btn" id="search">Найти</button></div><div id="jobs" class="jobs"><div class="empty">Загрузка…</div></div></section></main></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.A4PRINT_PARTNER_CONFIG,s=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])),money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));let tab='open';const{data:{session}}=await s.auth.getSession();if(!session)location.href='./login.html';const{data:pu,error}=await s.from('partner_users').select('partner_id,partners(name,is_active)').maybeSingle();if(error||!pu?.partners?.is_active)location.href='./login.html';$('partnerName').textContent=pu.partners.name;async function loadCats(){const{data}=await s.rpc('marketplace_categories');$('category').innerHTML='<option value="">Все категории</option>'+((data||[]).map(x=>`<option>${esc(x.category)}</option>`).join(''))}function cardOpen(x){return`<article class="job"><div class="job-head"><div><h3>${esc(x.title)}</h3><div class="muted">${esc(x.description||'Без описания')}</div></div>${x.budget?`<div class="budget">${money(x.budget)}</div>`:''}</div><div class="job-meta">${x.category?`<span class="chip">${esc(x.category)}</span>`:''}${x.quantity?`<span class="chip">${Number(x.quantity)} ${esc(x.unit||'')}</span>`:''}${x.desired_date?`<span class="chip">Срок: ${new Date(x.desired_date+'T00:00:00').toLocaleDateString('ru-RU')}</span>`:''}<span class="chip">${new Date(x.created_at).toLocaleString('ru-RU')}</span></div><button class="btn" data-claim="${x.id}">Взять в работу</button></article>`}function cardMine(x){return`<article class="job"><div class="job-head"><div><h3>${esc(x.title)}</h3><div class="muted">${esc(x.description||'Без описания')}</div></div><span class="chip">${esc(x.status)}</span></div><div class="job-meta">${x.category?`<span class="chip">${esc(x.category)}</span>`:''}${x.budget?`<span class="chip">${money(x.budget)}</span>`:''}</div><div class="contacts"><b>Контакт клиента</b><br>${esc(x.customer_name)}${x.customer_phone?` · <a href="tel:${esc(x.customer_phone)}">${esc(x.customer_phone)}</a>`:''}${x.customer_email?` · <a href="mailto:${esc(x.customer_email)}">${esc(x.customer_email)}</a>`:''}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" data-status="${x.id}|IN_PROGRESS">В работу</button><button class="btn" data-status="${x.id}|DONE">Готово</button></div></article>`}async function load(){ $('jobs').innerHTML='<div class="empty">Загрузка…</div>';if(tab==='open'){const{data,error}=await s.rpc('marketplace_open_requests',{p_query:$('q').value.trim()||null,p_category:$('category').value||null});if(error){$('jobs').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}const rows=data||[];$('jobs').innerHTML=rows.map(cardOpen).join('')||'<div class="empty">Свободных заявок пока нет</div>';document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Берём…';const{data,error}=await s.rpc('claim_marketplace_request',{p_request_id:b.dataset.claim});if(error)alert(error.message);else if(!data)alert('Эту заявку уже забрал другой партнёр.');await load();b.disabled=false})}else{const{data,error}=await s.from('marketplace_service_requests').select('*').order('updated_at',{ascending:false});if(error){$('jobs').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}const rows=data||[];$('jobs').innerHTML=rows.map(cardMine).join('')||'<div class="empty">Вы ещё не брали заявки</div>';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{const[id,status]=b.dataset.status.split('|');b.disabled=true;const{error}=await s.from('marketplace_service_requests').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await load();b.disabled=false})}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('filters').style.display=tab==='open'?'grid':'none';load()});$('search').onclick=load;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')load()});await loadCats();await load();</script></body></html>
