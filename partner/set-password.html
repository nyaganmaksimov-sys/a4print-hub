<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Активация Partner CRM — A4PRINT HUB</title><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#dbeafe,transparent 35%),#f4f7fb;color:#0f172a}.card{width:min(480px,100%);background:#fff;border:1px solid #dbe3ee;border-radius:24px;padding:28px;box-shadow:0 24px 70px #0f172a12}h1{margin:0 0 8px;font-size:30px}p{color:#64748b}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:800}.field input{padding:12px;border:1px solid #dbe3ee;border-radius:11px;font:inherit;width:100%}.btn{width:100%;border:0;border-radius:11px;padding:13px;background:#0f172a;color:#fff;font-weight:800;cursor:pointer}.msg{font-size:13px;margin-top:12px}.bad{color:#b91c1c}.ok{color:#166534}</style></head><body><main class="card"><h1>Добро пожаловать в Partner CRM</h1><p>Ваша компания подтверждена. Придумайте пароль для входа в кабинет исполнителя.</p><form id="form"><div class="field"><label>Новый пароль</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Повторите пароль</label><input id="password2" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn" id="save">Активировать кабинет</button><div id="msg" class="msg"></div></form></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.A4PRINT_PARTNER_CONFIG,s=createClient(c.supabaseUrl,c.supabasePublishableKey),$=x=>document.getElementById(x);await s.auth.getSession();$('form').onsubmit=async e=>{e.preventDefault();const p=$('password').value;if(p!==$('password2').value){$('msg').className='msg bad';$('msg').textContent='Пароли не совпадают';return}const b=$('save');b.disabled=true;const{error}=await s.auth.updateUser({password:p});if(error){$('msg').className='msg bad';$('msg').textContent=error.message;b.disabled=false;return}$('msg').className='msg ok';$('msg').textContent='Кабинет активирован. Переходим в Partner CRM…';setTimeout(()=>location.href='./crm.html',1200)};</script></body></html>
