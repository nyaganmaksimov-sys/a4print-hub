<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner Portal — вход</title><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;font-family:Arial,sans-serif;color:#0f172a}.box{width:min(420px,calc(100% - 32px));background:#fff;border-radius:22px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}h1{margin:0 0 7px}.sub{color:#64748b;margin-bottom:22px}.field{display:grid;gap:6px;margin:12px 0;font-size:13px}.field input{padding:12px 13px;border:1px solid #dbe1ea;border-radius:10px;font:inherit}button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:#0f172a;color:#fff;font-weight:800;cursor:pointer}.err{margin-top:12px;color:#b91c1c;font-size:13px;min-height:18px}.brand{font-weight:900;font-size:13px;letter-spacing:1px;color:#2563eb;margin-bottom:18px}</style></head><body><main class="box"><div class="brand">A4PRINT PARTNER PORTAL</div><h1>Вход для партнёров</h1><div class="sub">Заказы на производство и B2B-услуги</div><form id="form"><label class="field">Email<input id="email" type="email" required autocomplete="username"></label><label class="field">Пароль<input id="password" type="password" required autocomplete="current-password"></label><button id="submit">Войти</button><div id="err" class="err"></div></form></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.A4PRINT_PARTNER_CONFIG,s=createClient(c.supabaseUrl,c.supabasePublishableKey),$=id=>document.getElementById(id);const{data:{session}}=await s.auth.getSession();if(session){const{data}=await s.from('partner_users').select('id').maybeSingle();if(data)location.href='./index.html'}$('form').onsubmit=async e=>{e.preventDefault();$('err').textContent='';$('submit').disabled=true;const{error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('err').textContent='Ошибка входа: '+error.message;$('submit').disabled=false;return}const{data:pu,error:pe}=await s.from('partner_users').select('id,is_active,partners(is_active)').maybeSingle();if(pe||!pu||!pu.is_active||!pu.partners?.is_active){await s.auth.signOut();$('err').textContent='У этой учётной записи нет активного партнёрского доступа.';$('submit').disabled=false;return}location.href='./index.html'};</script></body></html>
