<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Товары — Partner CRM</title><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#0f172a}.top{background:#0f172a;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff}.wrap{width:min(1180px,calc(100% - 32px));margin:24px auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:280px;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.muted{color:#64748b;font-size:13px;line-height:1.5}.msg{margin-top:10px;font-size:13px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product{border:1px solid #e2e8f0;border-radius:15px;overflow:hidden;background:#fff;display:flex;flex-direction:column}.product img{width:100%;height:180px;object-fit:cover;background:#f8fafc}.body{padding:14px;display:flex;flex-direction:column;flex:1}.body h3{margin:0 0 7px;font-size:16px}.price{font-size:20px;font-weight:900;margin:7px 0}.switch{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:12px;font-size:13px;font-weight:700}.empty{text-align:center;color:#94a3b8;padding:35px}@media(max-width:850px){.products{grid-template-columns:1fr 1fr}}@media(max-width:560px){.products{grid-template-columns:1fr}}</style></head><body><header class="top"><b>Partner CRM · Товары</b><a href="./">← В кабинет</a></header><main class="wrap"><section class="card"><h1>Каталог товаров</h1><p class="muted">Подключите постоянную HTTPS-ссылку на YML-каталог Tilda. Товары сохраняются в A4PRINT HUB и привязываются только к вашему аккаунту. После синхронизации выберите, какие позиции показывать в Marketplace.</p><div class="row"><input id="feed" type="url" placeholder="https://.../tilda-products.yml"><button class="btn" id="sync">Подключить / синхронизировать Tilda</button></div><div id="msg" class="msg"></div></section><section class="card"><div class="row" style="justify-content:space-between;align-items:center"><div><h2 style="margin:0">Мои товары</h2><span class="muted" id="count"></span></div><button class="btn" id="reload">Обновить список</button></div><div class="products" id="products"><div class="empty">Загрузка…</div></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.A4PRINT_PARTNER_CONFIG,s=createClient(c.supabaseUrl,c.supabasePublishableKey),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=x=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB'}).format(Number(x||0));const{data:{session}}=await s.auth.getSession();if(!session)location.href='./login.html';const{data:pu}=await s.from('partner_users').select('partner_id').eq('auth_user_id',session.user.id).eq('is_active',true).maybeSingle();if(!pu)location.href='./login.html';async function load(){const{data,error}=await s.from('partner_products').select('*').eq('partner_id',pu.partner_id).order('updated_at',{ascending:false});if(error){$('products').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const a=data||[];$('count').textContent='Позиций: '+a.length;$('products').innerHTML=a.map(p=>`<article class="product">${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:'<div style="height:180px;background:#f8fafc"></div>'}<div class="body"><h3>${esc(p.title)}</h3><div class="muted">${esc(p.sku||p.external_id||'')}</div><div class="price">${p.price!=null?money(p.price):'Цена по запросу'}</div>${p.product_url?`<a href="${esc(p.product_url)}" target="_blank" rel="noopener">Открыть на Tilda</a>`:''}<label class="switch"><input type="checkbox" data-visible="${p.id}" ${p.marketplace_visible?'checked':''}> Показывать в Marketplace</label></div></article>`).join('')||'<div class="empty">Товаров пока нет. Подключите YML-каталог Tilda выше.</div>';document.querySelectorAll('[data-visible]').forEach(x=>x.onchange=async()=>{x.disabled=true;const{error}=await s.from('partner_products').update({marketplace_visible:x.checked,updated_at:new Date().toISOString()}).eq('id',x.dataset.visible);if(error){alert(error.message);x.checked=!x.checked}x.disabled=false})}async function sync(){const url=$('feed').value.trim();if(!url)return;$('sync').disabled=true;$('msg').textContent='Загружаем каталог Tilda…';const{data,error}=await s.functions.invoke('sync-tilda-catalog',{body:{feed_url:url}});if(error||!data?.ok)$('msg').textContent='Ошибка: '+(data?.error||error?.message||'Не удалось синхронизировать');else{$('msg').textContent='Готово. Импортировано товаров: '+data.count;await load()}$('sync').disabled=false}$('sync').onclick=sync;$('reload').onclick=load;load();</script></body></html>
