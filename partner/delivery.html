<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Доставка — Partner CRM</title><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f3f6fb;color:#0f172a}.top{background:#0f172a;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{color:#fff;text-decoration:none}.wrap{width:min(1000px,calc(100% - 28px));margin:24px auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:16px}.muted{color:#64748b;line-height:1.5;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.full{grid-column:1/-1}.btn{border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:#fff;font-weight:850;cursor:pointer}.btn.light{background:#fff;color:#334155;border:1px solid #cbd5e1}.method{display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px 0;border-top:1px solid #eef2f7}.method:first-child{border-top:0}.price{font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap}.badge{font-size:11px;font-weight:850;background:#eff6ff;color:#1d4ed8;padding:5px 8px;border-radius:999px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.method{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><b>Partner CRM · Доставка</b><div><a href="./products.html">Товары</a> · <a href="./">В кабинет</a></div></header><main class="wrap"><section class="card"><h1>Способы доставки</h1><p class="muted">Настройте варианты получения заказов ЦУИМ. Покупатель выбирает доставку отдельно для каждого исполнителя в своей корзине.</p><div class="actions"><button class="btn light" data-template="PICKUP">+ Самовывоз</button><button class="btn light" data-template="COURIER">+ Доставка по городу</button><button class="btn light" data-template="CARRIER">+ Транспортная компания</button><button class="btn light" data-template="DIGITAL">+ Электронная доставка</button></div></section><section class="card"><div id="list">Загрузка…</div></section><section class="card" id="editor" style="display:none"><h2 id="formTitle">Способ доставки</h2><div class="grid"><div class="field"><label>Тип</label><select id="code"><option value="PICKUP">Самовывоз</option><option value="COURIER">Доставка исполнителем</option><option value="CARRIER">Транспортная компания / ПВЗ</option><option value="DIGITAL">Электронная доставка</option><option value="OTHER">Другое</option></select></div><div class="field"><label>Название *</label><input id="title"></div><div class="field"><label>Стоимость, ₽</label><input id="price" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Бесплатно от суммы, ₽</label><input id="freeFrom" type="number" min="0" step="0.01"></div><div class="field"><label>Минимальная сумма заказа, ₽</label><input id="minOrder" type="number" min="0" step="0.01"></div><div class="field"><label>Город / зона</label><input id="city"></div><div class="field"><label>Срок</label><input id="eta" placeholder="Например: 1–2 дня"></div><div class="field"><label>Порядок</label><input id="sort" type="number" value="100"></div><div class="field full"><label>Описание</label><textarea id="description" rows="3"></textarea></div><div class="field"><label><input id="active" type="checkbox" checked> Активен</label></div></div><div class="actions" style="margin-top:14px"><button class="btn" id="save">Сохранить</button><button class="btn light" id="cancel">Отмена</button></div><div id="msg" class="muted" style="margin-top:8px"></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.A4PRINT_PARTNER_CONFIG,s=createClient(c.supabaseUrl,c.supabasePublishableKey),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let pu,rows=[],editing=null;const{data:{session}}=await s.auth.getSession();if(!session)location.href='./login.html';{const{data}=await s.from('partner_users').select('partner_id').eq('auth_user_id',session.user.id).eq('is_active',true).maybeSingle();if(!data)location.href='./login.html';pu=data}const labels={PICKUP:'Самовывоз',COURIER:'Доставка исполнителем',CARRIER:'Транспортная компания / ПВЗ',DIGITAL:'Электронная доставка',OTHER:'Другое'};async function load(){const{data,error}=await s.from('partner_delivery_methods').select('*').eq('partner_id',pu.partner_id).order('sort_order').order('created_at');if(error){$('list').textContent=error.message;return}rows=data||[];$('list').innerHTML=rows.length?rows.map(x=>`<div class="method"><div><div><b>${esc(x.title)}</b> <span class="badge">${esc(labels[x.code]||x.code)}</span></div><div class="muted">${esc(x.description||'')}${x.city?' · '+esc(x.city):''}${x.eta_text?' · '+esc(x.eta_text):''}</div><div class="price">${Number(x.price||0).toLocaleString('ru-RU')} ₽${x.free_from!=null?' · бесплатно от '+Number(x.free_from).toLocaleString('ru-RU')+' ₽':''}${!x.is_active?' · выключено':''}</div></div><div class="actions"><button class="btn light" data-edit="${x.id}">Изменить</button><button class="btn light" data-toggle="${x.id}">${x.is_active?'Выключить':'Включить'}</button></div></div>`).join(''):'<div class="muted">Способы доставки ещё не настроены.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(rows.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const x=rows.find(v=>v.id===b.dataset.toggle);await s.from('partner_delivery_methods').update({is_active:!x.is_active,updated_at:new Date().toISOString()}).eq('id',x.id);load()})}function edit(x={}){editing=x.id||null;$('editor').style.display='block';$('code').value=x.code||'PICKUP';$('title').value=x.title||labels[$('code').value];$('price').value=x.price??0;$('freeFrom').value=x.free_from??'';$('minOrder').value=x.min_order??'';$('city').value=x.city||'';$('eta').value=x.eta_text||'';$('sort').value=x.sort_order??100;$('description').value=x.description||'';$('active').checked=x.is_active!==false;$('formTitle').textContent=editing?'Изменить способ':'Новый способ';$('editor').scrollIntoView({behavior:'smooth'})}document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{const code=b.dataset.template;edit({code,title:labels[code],price:0,is_active:true,sort_order:100})});$('code').onchange=()=>{if(!editing)$('title').value=labels[$('code').value]||''};$('cancel').onclick=()=>{$('editor').style.display='none';editing=null};$('save').onclick=async()=>{const row={partner_id:pu.partner_id,code:$('code').value,title:$('title').value.trim(),description:$('description').value.trim()||null,price:Number($('price').value)||0,free_from:$('freeFrom').value?Number($('freeFrom').value):null,min_order:$('minOrder').value?Number($('minOrder').value):null,city:$('city').value.trim()||null,eta_text:$('eta').value.trim()||null,is_active:$('active').checked,sort_order:Number($('sort').value)||100,updated_at:new Date().toISOString()};if(!row.title)return;$('save').disabled=true;const q=editing?s.from('partner_delivery_methods').update(row).eq('id',editing):s.from('partner_delivery_methods').insert(row);const{error}=await q;$('msg').textContent=error?'Ошибка: '+error.message:'Сохранено';$('save').disabled=false;if(!error){$('editor').style.display='none';editing=null;load()}};load();</script></body></html>
