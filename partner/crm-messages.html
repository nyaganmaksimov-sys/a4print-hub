<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сообщения ЦУИМ — Partner CRM</title><script src="./config.js"></script><link rel="stylesheet" href="./crm.css"><style>.chatgrid{display:grid;grid-template-columns:340px 1fr;gap:16px}.dialogs,.chat{background:#fff;border:1px solid #dbe3ee;border-radius:18px;overflow:hidden}.dialogs{max-height:72vh;overflow:auto}.dialog{padding:14px;border-bottom:1px solid #eef2f7;cursor:pointer}.dialog:hover,.dialog.active{background:#eff6ff}.chathead{padding:16px;border-bottom:1px solid #eef2f7}.productref{display:flex;gap:10px;align-items:center;margin-top:8px}.productref img{width:48px;height:48px;object-fit:cover;border-radius:9px;background:#eef2f7}.messages{height:47vh;overflow:auto;padding:18px;background:#f8fafc}.msg{max-width:76%;padding:10px 13px;border-radius:14px;margin:7px 0;background:#fff;border:1px solid #e2e8f0}.msg.mine{margin-left:auto;background:#dbeafe;border-color:#bfdbfe}.msg small{display:block;color:#64748b;margin-top:5px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px}.composer textarea{min-height:78px;padding:11px;border:1px solid #cbd5e1;border-radius:11px;resize:vertical}.ai{padding:12px 16px;background:#f5f3ff;border-bottom:1px solid #ddd6fe;color:#5b21b6;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:12px}.aibtn{border:1px solid #c4b5fd;background:#fff;color:#6d28d9;border-radius:10px;padding:9px 12px;font-weight:850;cursor:pointer;white-space:nowrap}.aibtn:disabled{opacity:.55}.empty{padding:30px;color:#94a3b8;text-align:center}@media(max-width:800px){.chatgrid{grid-template-columns:1fr}.dialogs{max-height:260px}.ai{align-items:flex-start;flex-direction:column}}</style></head><body><div class="crm-shell"><aside class="crm-side"><div class="crm-brand"><b>Partner CRM</b><small id="partnerName">Загрузка…</small></div><nav class="crm-nav"><a href="./crm.html">Главная</a><a href="./crm-customers.html">Мои клиенты</a><a href="./crm-orders.html">Мои заказы</a><a class="active" href="./crm-messages.html">Сообщения ЦУИМ</a><a href="./products.html">Товары</a></nav></aside><main class="crm-main"><header class="crm-top"><div><h1>Сообщения клиентов</h1><p>Вопросы до заказа и переписка по заказам ЦУИМ</p></div></header><div class="chatgrid"><section class="dialogs" id="dialogs"><div class="empty">Загрузка…</div></section><section class="chat"><div class="chathead"><b id="chatTitle">Выберите диалог</b><div class="muted" id="chatSub"></div><div id="productRef"></div></div><div class="ai"><span><b>AI-менеджер · Черновик</b><br>Учитывает контекст диалога. Цена, скидки и сроки без подтверждения не обещаются.</span><button class="aibtn" id="aiDraft">Подготовить ответ с AI</button></div><div class="messages" id="messages"><div class="empty">Переписка появится здесь</div></div><div class="composer"><textarea id="text" placeholder="Напишите клиенту или подготовьте черновик с AI…"></textarea><button class="btn" id="send">Отправить</button></div></section></div></main></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.A4PRINT_PARTNER_CONFIG,s=createClient(c.supabaseUrl,c.supabasePublishableKey),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));let current=null,convs=[];const{data:{session}}=await s.auth.getSession();if(!session)location.href='./login.html';const{data:pu}=await s.from('partner_users').select('partner_id,partners(name)').eq('auth_user_id',session.user.id).eq('is_active',true).maybeSingle();if(!pu)location.href='./login.html';$('partnerName').textContent=pu.partners?.name||'Партнёр';async function loadDialogs(){const{data,error}=await s.from('marketplace_conversations').select('id,order_id,product_id,subject,status,ai_mode,last_message_at,partner_products(title,image_url),marketplace_orders(customer_name,customer_email,total)').eq('partner_id',pu.partner_id).order('last_message_at',{ascending:false});if(error){$('dialogs').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}convs=data||[];$('dialogs').innerHTML=convs.map(x=>`<div class="dialog ${current===x.id?'active':''}" data-id="${x.id}"><b>${esc(x.marketplace_orders?.customer_name||'Покупатель')}</b><div>${esc(x.product_id?(x.partner_products?.title||x.subject||'Вопрос о товаре'):'Заказ '+String(x.order_id||'').slice(0,8))}</div><div class="muted">${new Date(x.last_message_at).toLocaleString('ru-RU')}</div></div>`).join('')||'<div class="empty">Диалогов пока нет.</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openChat(x.dataset.id))}async function openChat(id){current=id;const c=convs.find(x=>x.id===id);if(!c)return;$('chatTitle').textContent=c.marketplace_orders?.customer_name||'Покупатель';$('chatSub').textContent=c.product_id?'Вопрос до заказа':'Заказ '+String(c.order_id||'').slice(0,8);$('productRef').innerHTML=c.product_id?`<div class="productref">${c.partner_products?.image_url?`<img src="${esc(c.partner_products.image_url)}">`:''}<div><b>${esc(c.partner_products?.title||c.subject||'Товар или услуга')}</b><div class="muted">Клиент интересуется предложением до оформления заказа</div></div></div>`:'';await loadDialogs();const{data,error}=await s.from('marketplace_messages').select('*').eq('conversation_id',id).eq('is_ai_draft',false).order('created_at');if(error){$('messages').textContent=error.message;return}$('messages').innerHTML=(data||[]).map(m=>`<div class="msg ${m.sender_type==='PARTNER'?'mine':''}"><b>${m.sender_type==='CUSTOMER'?'Клиент':m.sender_type==='AI'?'AI-менеджер':'Менеджер'}</b><div>${esc(m.body)}</div><small>${new Date(m.created_at).toLocaleString('ru-RU')}</small></div>`).join('')||'<div class="empty">Сообщений пока нет</div>';$('messages').scrollTop=$('messages').scrollHeight}$('aiDraft').onclick=async()=>{if(!current){alert('Сначала выберите диалог');return}const b=$('aiDraft');b.disabled=true;b.textContent='AI готовит ответ…';const{data,error}=await s.functions.invoke('cuim-ai-draft',{body:{conversation_id:current}});b.disabled=false;b.textContent='Подготовить ответ с AI';if(error||!data?.ok){alert(data?.error||error?.message||'Не удалось подготовить ответ');return}$('text').value=data.draft;$('text').focus()};$('send').onclick=async()=>{const body=$('text').value.trim();if(!current||!body)return;$('send').disabled=true;const{error}=await s.rpc('marketplace_send_message',{p_conversation_id:current,p_body:body});$('send').disabled=false;if(error){alert(error.message);return}$('text').value='';await openChat(current)};$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}};await loadDialogs();if(convs.length)await openChat(convs[0].id);</script></body></html>
