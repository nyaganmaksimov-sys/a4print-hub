<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мои клиенты — Partner CRM</title><script src="./config.js"></script><link rel="stylesheet" href="./crm.css"></head><body><div class="crm-shell"><aside class="crm-side"><div class="crm-brand"><b>Partner CRM</b><small id="partnerName">Загрузка…</small></div><nav class="crm-nav"><a href="./crm.html"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10H3Z"/><path d="M9 21v-6h6v6"/></svg><span>Главная</span></a><a class="active" href="./crm-customers.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M17 11a4 4 0 0 1 4 4v2"/></svg><span>Мои клиенты</span></a><a href="./crm-orders.html"><svg viewBox="0 0 24 24"><path d="M4 5h2l2 10h9l2-7H7"/><circle cx="10" cy="19" r="1"/><circle cx="17" cy="19" r="1"/></svg><span>Мои заказы</span></a><a href="./index.html"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4Z"/><path d="m8 12 3 3 5-6"/></svg><span>Заказать у A4PRINT</span></a></nav></aside><main class="crm-main"><header class="crm-top"><div><h1>Мои клиенты</h1><p>Внутренняя клиентская база доступна только вашей компании</p></div><button class="btn" id="add">+ Добавить клиента</button></header><section class="card"><div class="toolbar"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" placeholder="Имя, компания, телефон, email, ИНН, Telegram…"></div><span class="badge" id="count">0</span></div><div class="list" id="list"><div class="empty">Загрузка…</div></div></section></main></div><div class="modalback" id="modal"><form class="modal" id="form"><h2>Новый клиент</h2><div class="formgrid"><div class="field"><label>Тип клиента</label><select id="type"><option value="PERSON">Физлицо</option><option value="IP">ИП</option><option value="LEGAL">Организация</option></select></div><div class="field"><label>Имя / контактное лицо *</label><input id="name" required></div><div class="field"><label>Компания</label><input id="company"></div><div class="field"><label>ИНН</label><input id="inn"></div><div class="field"><label>Телефон</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Telegram</label><input id="telegram" placeholder="@username"></div><div class="field"><label>WhatsApp</label><input id="whatsapp"></div><div class="field"><label>VK</label><input id="vk"></div><div class="field"><label>Instagram</label><input id="instagram"></div><div class="field full"><label>Заметка</label><textarea id="notes" rows="3"></textarea></div></div><div id="err" class="error"></div><div class="modal-actions"><button type="button" class="btn secondary" id="cancel">Отмена</button><button class="btn">Сохранить</button></div></form></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.A4PRINT_PARTNER_CONFIG,s=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[],pu;const{data:{session}}=await s.auth.getSession();if(!session)location.href='./login.html';{const{data,error}=await s.from('partner_users').select('id,partner_id,partners(name,is_active)').maybeSingle();if(error||!data||!data.partners?.is_active){await s.auth.signOut();location.href='./login.html'}pu=data;$('partnerName').textContent=data.partners.name}function href(type,v){v=String(v||'').trim();if(!v)return'';if(/^https?:\/\//i.test(v))return v;if(type==='telegram')return'https://t.me/'+v.replace(/^@/,'');if(type==='whatsapp')return'https://wa.me/'+v.replace(/\D/g,'');if(type==='vk')return'https://vk.com/'+v.replace(/^@/,'');return v}async function load(){const{data,error}=await s.from('partner_crm_customers').select('*').order('updated_at',{ascending:false});if(error){$('list').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=data||[];render()}function render(){const q=$('search').value.trim().toLowerCase();const a=rows.filter(c=>`${c.full_name||''} ${c.company_name||''} ${c.phone||''} ${c.email||''} ${c.inn||''} ${c.telegram||''} ${c.whatsapp||''}`.toLowerCase().includes(q));$('count').textContent=a.length;$('list').innerHTML=a.map(c=>`<div class="row"><div class="row-head"><div><b>${esc(c.full_name)}</b><div class="muted">${esc(c.company_name||'Частный клиент')}</div></div><span class="badge">${c.customer_type}</span></div><div class="muted" style="margin-top:8px">${esc(c.phone||'')}${c.phone&&c.email?' · ':''}${esc(c.email||'')}</div><div class="actions">${c.phone?`<a class="linkbtn" href="tel:${esc(c.phone)}">Телефон</a>`:''}${c.email?`<a class="linkbtn" href="mailto:${esc(c.email)}">Email</a>`:''}${c.telegram?`<a class="linkbtn" target="_blank" href="${esc(href('telegram',c.telegram))}">Telegram</a>`:''}${c.whatsapp?`<a class="linkbtn" target="_blank" href="${esc(href('whatsapp',c.whatsapp))}">WhatsApp</a>`:''}${c.vk?`<a class="linkbtn" target="_blank" href="${esc(href('vk',c.vk))}">VK</a>`:''}<a class="linkbtn" href="./crm-orders.html?customer=${c.id}">Новый заказ</a></div></div>`).join('')||'<div class="empty">Клиентов не найдено</div>'}$('search').oninput=render;$('add').onclick=()=>{$('form').reset();$('err').textContent='';$('modal').classList.add('open')};$('cancel').onclick=()=> $('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('form').onsubmit=async e=>{e.preventDefault();const val=id=>$(id).value.trim();const{error}=await s.from('partner_crm_customers').insert({partner_id:pu.partner_id,created_by:pu.id,customer_type:val('type'),full_name:val('name'),company_name:val('company')||null,inn:val('inn')||null,phone:val('phone')||null,email:val('email')||null,telegram:val('telegram')||null,whatsapp:val('whatsapp')||null,vk:val('vk')||null,instagram:val('instagram')||null,notes:val('notes')||null});if(error){$('err').textContent=error.message;return}$('modal').classList.remove('open');await load()};await load();</script></body></html>
