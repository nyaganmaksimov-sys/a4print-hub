<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Возврат в A4PRINT HUB</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#0f172a}.card{width:min(440px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:30px;box-shadow:0 18px 50px rgba(15,23,42,.10);text-align:center}.mark{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;margin:0 auto 18px;background:#0f172a;color:#fff;font-weight:900}.spin{width:26px;height:26px;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;margin:20px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:24px;margin:0 0 8px}p{margin:0;color:#64748b;line-height:1.45}.btn{display:block;margin-top:20px;text-decoration:none;border:0;border-radius:14px;padding:14px 16px;background:#2563eb;color:#fff;font:inherit;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">A4</div>
    <h1>Возвращаемся в A4PRINT HUB</h1>
    <p>Авторизация завершена. Сейчас откроется мобильная версия.</p>
    <div class="spin"></div>
    <a class="btn" id="openWeb" href="/mobile/">Открыть A4PRINT HUB</a>
  </main>
  <script>
    (()=>{
      const target='/mobile/'+location.search+location.hash;
      document.getElementById('openWeb').href=target;
      location.replace(target);
    })();
  </script>
</body>
</html>
