<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отчёты — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">A4</span><div>A4PRINT<br><small>HUB</small></div></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>📊 Отчёты</h1><p>Сводные показатели общей базы</p></div><button id="refresh">Обновить</button></header><section class="stats"><article><span>Заказов</span><strong id="orders">0</strong></article><article><span>Выручка по заказам</span><strong id="revenue">0 ₽</strong></article><article><span>Клиентов</span><strong id="customers">0</strong></article><article><span>Позиций каталога</span><strong id="items">0</strong></article></section><section class="panel"><h2>Статусы заказов</h2><div id="statuses"><div class="empty">Загрузка...</div></div></section></main><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id),rub=v=>Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';async function load(){const[o,c,i]=await Promise.all([supabase.from('orders').select('status,total'),supabase.from('customers').select('id',{count:'exact',head:true}),supabase.from('catalog_items').select('id',{count:'exact',head:true})]);if(o.error){$('statuses').innerHTML=`<div class="empty">Ошибка: ${o.error.message}</div>`;return}const rows=o.data||[];$('orders').textContent=rows.length;$('revenue').textContent=rub(rows.filter(x=>!['CANCELLED'].includes(x.status)).reduce((s,x)=>s+Number(x.total||0),0));$('customers').textContent=c.count||0;$('items').textContent=i.count||0;const map={};rows.forEach(x=>map[x.status]=(map[x.status]||0)+1);$('statuses').innerHTML=Object.entries(map).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e5e7eb"><span>${k}</span><b>${v}</b></div>`).join('')||'<div class="empty">Нет данных</div>'}$('refresh').onclick=load;load();</script></body></html>
