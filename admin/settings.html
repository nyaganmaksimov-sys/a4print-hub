<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Настройки — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script><style>.settings-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.card{background:#fff;border-radius:16px;padding:20px;border:1px solid #e5e7eb}.field{display:grid;gap:7px;margin:12px 0}.field input,.field textarea{padding:12px;border:1px solid #dbe2ea;border-radius:10px;font:inherit;width:100%;box-sizing:border-box}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}.btn.secondary{background:#fff;color:#334155;border:1px solid #dbe2ea}.preview{min-height:260px;border-radius:16px;background:#0f172a;display:grid;place-items:center;padding:18px}.preview img{max-width:100%;max-height:230px;object-fit:contain}.muted{color:#64748b;font-size:13px}.msg{margin-top:10px;font-size:13px}.ok{color:#15803d}.err{color:#b91c1c}.section{margin-top:20px}@media(max-width:850px){.settings-grid,.two{grid-template-columns:1fr}}</style></head><body><aside class="sidebar"><div class="brand"></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>Настройки</h1><p>Оформление и реквизиты A4PRINT HUB</p></div><button id="logout" class="btn secondary">Выйти</button></header><section class="settings-grid"><div><div class="card"><h2>Реквизиты A4PRINT для документов</h2><p class="muted">Эти данные автоматически подставляются в счета и другие печатные документы.</p><div class="two"><label class="field">Краткое название<input id="seller_name" placeholder="А4-Принт"></label><label class="field">Полное наименование<input id="seller_legal_name"></label><label class="field">ИНН<input id="seller_inn"></label><label class="field">КПП<input id="seller_kpp"></label><label class="field">ОГРН / ОГРНИП<input id="seller_ogrn"></label><label class="field">Телефон<input id="seller_phone"></label><label class="field">E-mail<input id="seller_email" type="email"></label><label class="field">Банк<input id="seller_bank_name"></label><label class="field">БИК<input id="seller_bik"></label><label class="field">Расчётный счёт<input id="seller_settlement_account"></label><label class="field">Корреспондентский счёт<input id="seller_correspondent_account"></label><label class="field">Руководитель / ИП<input id="seller_signatory"></label></div><label class="field">Юридический адрес<textarea id="seller_address"></textarea></label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button id="saveBilling" class="btn">Сохранить реквизиты</button><span id="billingMsg" class="msg"></span></div></div><div class="card section"><h2>Логотип HUB</h2><p class="muted">Логотип используется в интерфейсе. Можно выбрать файл или указать URL.</p><label class="field">Выбрать файл<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label><label class="field">Или указать URL<input id="logoUrl" type="url" placeholder="https://..."></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="save" class="btn">Сохранить логотип</button><button id="reset" class="btn secondary">Вернуть стандартный</button></div><div id="msg" class="msg"></div></div></div><div class="card"><h3>Предпросмотр логотипа</h3><div class="preview"><img id="preview" src="./assets/logo_bd_transparent.svg" alt="A4PRINT HUB"></div></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.A4PRINT_CONFIG||{},supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id);let session,current='';const DEFAULT='./assets/logo_bd_transparent.svg';const billingFields=['name','legal_name','inn','kpp','ogrn','phone','email','bank_name','bik','settlement_account','correspondent_account','signatory','address'];function msg(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}async function init(){const s=await supabase.auth.getSession();session=s.data.session;if(!session)return location.replace('./login.html');const{data:isAdmin,error}=await supabase.rpc('has_role',{required_role:'ADMIN'});if(error||!isAdmin){alert('Настройки доступны только администратору.');return location.replace('./index.html')}const[{data:branding},{data:billing}]=await Promise.all([supabase.from('settings').select('value').eq('key','hub_branding').maybeSingle(),supabase.from('settings').select('value').eq('key','company_billing').maybeSingle()]);current=branding?.value?.logo||'';$('logoUrl').value=current&&/^https?:/.test(current)?current:'';$('preview').src=current||DEFAULT;const b=billing?.value||{};billingFields.forEach(f=>{const el=$('seller_'+f);if(el)el.value=b[f]||''})}function fileToDataUrl(file){return new Promise((resolve,reject)=>{if(file.type==='image/svg+xml'){const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);return}const img=new Image(),r=new FileReader();r.onload=()=>{img.onload=()=>{const max=700,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/webp',.9))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}$('saveBilling').onclick=async()=>{const value={};billingFields.forEach(f=>value[f]=$('seller_'+f)?.value.trim()||'');const{error}=await supabase.from('settings').upsert({key:'company_billing',value,updated_at:new Date().toISOString()});$('billingMsg').className='msg '+(error?'err':'ok');$('billingMsg').textContent=error?'Ошибка: '+error.message:'Реквизиты сохранены ✓'};$('logoFile').onchange=async()=>{const f=$('logoFile').files[0];if(!f)return;try{const data=await fileToDataUrl(f);$('preview').src=data;current=data;$('logoUrl').value='';msg('Файл готов к сохранению.',true)}catch{msg('Не удалось прочитать изображение.')}};$('logoUrl').oninput=()=>{const u=$('logoUrl').value.trim();if(u){$('preview').src=u;current=u}};$('save').onclick=async()=>{try{const logo=$('logoUrl').value.trim()||current;if(!logo)return msg('Выберите файл или укажите URL.');if(logo.length>900000)return msg('Файл слишком большой.');const{error}=await supabase.from('settings').upsert({key:'hub_branding',value:{logo},updated_at:new Date().toISOString()});if(error)throw error;localStorage.setItem('a4print_hub_logo',logo);msg('Логотип сохранён.',true)}catch(e){msg(e.message||'Не удалось сохранить логотип.')}};$('reset').onclick=async()=>{try{const{error}=await supabase.from('settings').upsert({key:'hub_branding',value:{logo:''},updated_at:new Date().toISOString()});if(error)throw error;current='';$('logoUrl').value='';$('logoFile').value='';$('preview').src=DEFAULT;localStorage.removeItem('a4print_hub_logo');msg('Стандартный логотип восстановлен.',true)}catch(e){msg(e.message||'Не удалось сбросить логотип.')}};$('logout').onclick=async()=>{await supabase.auth.signOut();location.replace('./login.html')};init().catch(e=>msg(e.message));</script></body></html>
