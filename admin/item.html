<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Позиция — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script></head><body><main class="main" style="margin-left:0"><header class="topbar"><div><h1 id="name">Позиция</h1><p id="meta">Загрузка...</p></div><div><span id="userEmail"></span> <a href="./warehouse.html" style="margin-left:15px">← Склад</a></div></header><section class="stats"><article><span>Всего на складе</span><strong id="total">0</strong></article><article><span>Минимальный остаток</span><strong id="min">0</strong></article><article><span>Цена продажи</span><strong id="price">€ 0.00</strong></article></section><section class="grid"><article class="panel"><h2>Движение склада</h2><div class="actions"><button id="receipt">＋ Приход</button><button id="writeoff">− Списание</button><button id="transfer">⇄ Перемещение</button></div><div id="history"><div class="empty">Загрузка...</div></div></article><article class="panel"><h2>Карточка</h2><div id="card"></div></article></section></main><dialog id="dlg"><form method="dialog" id="form"><h2 id="dlgTitle">Движение</h2><label>Количество<input id="qty" type="number" min="0.001" step="0.001" required></label><label>Комментарий<input id="note"></label><div class="actions"><button value="cancel">Отмена</button><button id="save" value="default">Сохранить</button></div></form></dialog><script type="module">import {supabase } from './guard.js';const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');let item,mode;if(!id){location.replace('./warehouse.html')}const {data:{session}}=await supabase.auth.getSession();if(session)$('userEmail').textContent=session.user.email||'';async function load(){const a=await supabase.from('catalog_items').select('*').eq('id',id).single();if(a.error){$('name').textContent='Ошибка';return}item=a.data;$('name').textContent=item.name;$('meta').textContent=`${item.sku} · ${item.item_type} · ${item.unit}`;$('min').textContent=item.min_stock||0;$('price').textContent=`€ ${Number(item.sale_price||0).toFixed(2)}`;$('card').innerHTML=`<p><b>SKU:</b> ${item.sku}</p><p><b>Тип:</b> ${item.item_type}</p><p><b>Единица:</b> ${item.unit}</p><p><b>Закупка:</b> € ${Number(item.cost_price||0).toFixed(2)}</p><p><b>Описание:</b> ${item.description||'—'}</p>`;const h=await supabase.from('inventory_transactions').select('*').eq('catalog_item_id',id).order('created_at',{ascending:false}).limit(100);let total=0;const rows=h.data||[];for(const x of rows){if(['RECEIPT','TRANSFER_IN','PRODUCTION_IN','ADJUSTMENT'].includes(x.transaction_type))total+=Number(x.quantity);else total-=Number(x.quantity)}$('total').textContent=`${total.toFixed(3)} ${item.unit}`;$('history').innerHTML=rows.map(x=>`<div class="row"><span><b>${x.transaction_type}</b><small>${new Date(x.created_at).toLocaleString('ru-RU')} · ${x.note||''}</small></span><strong>${['RECEIPT','TRANSFER_IN','PRODUCTION_IN','ADJUSTMENT'].includes(x.transaction_type)?'+':'−'}${x.quantity} ${item.unit}</strong></div>`).join('')||'<div class="empty">Движений пока нет</div>'}function open(type,title){mode=type;$('dlgTitle').textContent=title;$('form').reset();$('dlg').showModal()}$('receipt').onclick=()=>open('RECEIPT','Приход на склад');$('writeoff').onclick=()=>open('WRITE_OFF','Списание со склада');$('transfer').onclick=()=>open('TRANSFER_OUT','Перемещение со склада');$('form').onsubmit=async e=>{e.preventDefault();const q=Number($('qty').value);const {error}=await supabase.from('inventory_transactions').insert({catalog_item_id:id,transaction_type:mode,quantity:q,unit_cost:Number(item.cost_price||0),note:$('note').value.trim()||null,created_by:session?.user?.id||null});if(error){alert(error.message);return}$('dlg').close();load()};load();</script><style>dialog{border:0;border-radius:16px;padding:26px;width:min(420px,calc(100% - 32px));box-shadow:0 20px 60px #0002}dialog::backdrop{background:#0006}dialog label{display:grid;gap:7px;margin:12px 0}dialog input{padding:11px;border:1px solid #dbe1ea;border-radius:9px;font:inherit}.row{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid #e5e7eb}.row small{display:block;color:#64748b;margin-top:4px}</style></body></html>
