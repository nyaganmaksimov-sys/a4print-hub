<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заказ — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script></head><body><main class="main" style="margin-left:0;max-width:1100px;margin-right:auto"><header class="topbar"><div><h1 id="title">Заказ</h1><p id="subtitle">Карточка заказа</p></div><div><span id="userEmail" style="margin-right:12px"></span><a href="./orders.html" style="text-decoration:none;color:inherit">← Все заказы</a></div></header><section class="grid"><article class="panel wide"><div class="panel-head"><h2>Информация о заказе</h2><span id="status" class="badge">—</span></div><div id="details" class="details"><div class="empty">Загрузка...</div></div><div class="actions"><button data-status="CONFIRMED">Подтвердить</button><button data-status="IN_PROGRESS">В работу</button><button data-status="READY">Готов</button><button data-status="COMPLETED">Завершить</button><button data-status="ON_HOLD">Пауза</button><button data-status="CANCELLED">Отменить</button></div></article><article class="panel"><h2>История статусов</h2><div id="history"><div class="empty">Нет данных</div></div></article></section></main><script type="module">import {supabase} from './guard.js';const {data:{session}}=await supabase.auth.getSession();if(session)document.getElementById('userEmail').textContent=session.user.email||'';</script><script type="module" src="./order.js"></script></body></html>
