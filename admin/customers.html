<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Клиенты — A4PRINT HUB</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js"></script>
  <style>
    .customer-toolbar{display:flex;gap:10px;align-items:center;margin:16px 0}.customer-toolbar input{flex:1;max-width:560px;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;font:inherit}.customer-list{display:grid;gap:12px}.customer-card{background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:16px}.customer-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.customer-name{font-weight:850;font-size:17px}.customer-company{color:#64748b;font-size:13px;margin-top:2px}.customer-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#475569}.customer-notes{margin-top:13px;padding:12px;border-radius:12px;background:#f8fafc;border:1px solid #eef2f7;white-space:pre-wrap;font-size:13px;line-height:1.45}.customer-notes.empty{color:#94a3b8}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}.billing-badge{background:#ecfdf5;color:#166534}.open-btn{display:inline-block;margin-top:12px;padding:8px 11px;border-radius:9px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800;font-size:12px}.empty-state{padding:36px;text-align:center;color:#94a3b8;background:#fff;border:1px solid #e6ebf2;border-radius:16px}@media(max-width:720px){.customer-top{flex-direction:column}.customer-toolbar{align-items:stretch;flex-direction:column}.customer-toolbar input{max-width:none}}
  </style>
</head>
<body>
<aside class="sidebar"><div class="brand"></div><nav></nav></aside>
<main class="main">
  <header class="topbar"><div><h1>Клиенты</h1><p>Контакты, реквизиты, документы и история работы</p></div></header>
  <section class="panel wide">
    <div class="panel-head"><h2>База клиентов</h2><button id="refresh">Обновить</button></div>
    <div class="customer-toolbar"><input id="search" placeholder="Поиск по имени, телефону, email, компании или ИНН…" autocomplete="off"><span id="count"></span></div>
    <div id="list" class="customer-list"><div class="empty-state">Загрузка…</div></div>
  </section>
</main>
<script type="module">
import {supabase} from './guard.js';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let rows=[];
async function access(){const [{data:a,error:ae},{data:m,error:me}]=await Promise.all([supabase.rpc('has_role',{required_role:'ADMIN'}),supabase.rpc('has_role',{required_role:'MANAGER'})]);if(ae)throw ae;if(me)throw me;if(!a&&!m){document.querySelector('.main').innerHTML='<div class="empty-state">Доступ только для администратора или менеджера.</div>';throw new Error('NO_ACCESS')}}
async function load(){const {data,error}=await supabase.from('customers').select('id,full_name,company_name,email,phone,notes,customer_type,legal_name,inn,kpp,ogrn,created_at,updated_at').order('updated_at',{ascending:false});if(error)throw error;rows=data||[];render()}
function render(){const q=$('search').value.trim().toLowerCase();const filtered=rows.filter(c=>`${c.full_name||''} ${c.company_name||''} ${c.legal_name||''} ${c.email||''} ${c.phone||''} ${c.inn||''} ${c.notes||''}`.toLowerCase().includes(q));$('count').textContent=`${filtered.length} клиентов`;$('list').innerHTML=filtered.map(c=>`<article class="customer-card"><div class="customer-top"><div><div class="customer-name">${esc(c.full_name)}</div><div class="customer-company">${esc(c.company_name||c.legal_name||'Частный клиент')}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><span class="badge">Обновлено ${new Date(c.updated_at||c.created_at).toLocaleDateString('ru-RU')}</span>${c.inn?'<span class="badge billing-badge">Реквизиты</span>':''}</div></div><div class="customer-meta">${c.phone?`<span>☎ ${esc(c.phone)}</span>`:''}${c.email?`<span>✉ ${esc(c.email)}</span>`:''}${c.inn?`<span>ИНН ${esc(c.inn)}</span>`:''}</div><div class="customer-notes ${c.notes?'':'empty'}">${c.notes?esc(c.notes):'Комментариев пока нет'}</div><a class="open-btn" href="./customer.html?id=${c.id}">Открыть карточку →</a></article>`).join('')||'<div class="empty-state">Клиенты не найдены</div>'}
$('search').oninput=render;$('refresh').onclick=load;
try{await access();await load()}catch(e){if(e.message!=='NO_ACCESS')$('list').innerHTML=`<div class="empty-state">Ошибка: ${esc(e.message)}</div>`}
</script>
</body>
</html>
