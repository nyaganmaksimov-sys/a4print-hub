<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Клиенты — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script>
<style>
.customer-toolbar{display:flex;gap:10px;align-items:center;margin:16px 0}.customer-toolbar input{flex:1;max-width:560px}.primary{border:0;border-radius:11px;padding:11px 15px;background:#0f172a;color:#fff;font-weight:800;cursor:pointer}.customer-list{display:grid;gap:12px}.customer-card{background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:16px}.customer-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.customer-name{font-weight:850;font-size:17px}.customer-company{color:#64748b;font-size:13px;margin-top:2px}.customer-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#475569}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}.billing-badge{background:#ecfdf5;color:#166534}.customer-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}.contact-actions{display:flex;gap:7px;flex-wrap:wrap}.contact-btn{width:34px;height:34px;border:1px solid #dbe3ee;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#334155;text-decoration:none;transition:.15s}.contact-btn:hover{transform:translateY(-1px);border-color:#94a3b8}.contact-btn svg{width:18px;height:18px}.open-btn{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800;font-size:12px}.details-btn{height:34px;border:1px solid #dbe3ee;border-radius:10px;background:#fff;padding:0 11px;font-weight:750;color:#334155;cursor:pointer}.contact-details{display:none;margin-top:12px;padding:12px;border:1px solid #e7edf5;border-radius:12px;background:#f8fafc;font-size:13px;line-height:1.7}.contact-details.open{display:block}.empty-state{padding:36px;text-align:center;color:#94a3b8;background:#fff;border:1px solid #e6ebf2;border-radius:16px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:20000;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(15,23,42,.3)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.modal-head h2{margin:0}.close{border:0;background:#f1f5f9;width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#475569}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #dbe3ee;border-radius:10px;font:inherit}.section-title{grid-column:1/-1;margin-top:7px;padding-top:13px;border-top:1px solid #edf2f7;font-size:13px;font-weight:900}.form-error{color:#dc2626;font-size:12px;margin-top:10px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.secondary{border:1px solid #dbe3ee;background:#fff;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}@media(max-width:720px){.customer-top,.customer-toolbar{align-items:stretch;flex-direction:column}.customer-toolbar input{max-width:none}.form-grid{grid-template-columns:1fr}.field.full,.section-title{grid-column:auto}}
</style>
</head>
<body><aside class="sidebar"><div class="brand"></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>Клиенты</h1><p>Контакты, реквизиты, документы и история работы</p></div></header><section class="panel wide"><div class="panel-head"><h2>База клиентов</h2><div style="display:flex;gap:8px"><button id="addCustomer" class="primary">+ Добавить клиента</button><button id="refresh">Обновить</button></div></div><div class="customer-toolbar"><input id="search" placeholder="Поиск по имени, телефону, email, компании, ИНН или соцсетям…" autocomplete="off"><span id="count"></span></div><div id="list" class="customer-list"><div class="empty-state">Загрузка…</div></div></section></main>
<div id="customerModal" class="modal-backdrop"><form id="customerForm" class="modal"><div class="modal-head"><div><h2>Новый клиент</h2><div style="color:#64748b;font-size:13px">Основные данные и каналы быстрой связи</div></div><button type="button" class="close" id="closeModal">×</button></div><div class="form-grid"><div class="field"><label>Тип клиента</label><select id="customer_type"><option value="PERSON">Физическое лицо</option><option value="IP">ИП</option><option value="LEGAL">Организация</option></select></div><div class="field"><label>Имя / контактное лицо *</label><input id="full_name" required></div><div class="field"><label>Компания</label><input id="company_name"></div><div class="field"><label>ИНН</label><input id="inn" inputmode="numeric"></div><div class="field"><label>Телефон</label><input id="phone" type="tel"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="section-title">Мессенджеры и социальные сети</div><div class="field"><label>Telegram</label><input id="telegram" placeholder="@username или ссылка"></div><div class="field"><label>WhatsApp</label><input id="whatsapp" placeholder="Телефон или ссылка"></div><div class="field"><label>VK</label><input id="vk" placeholder="Профиль или ссылка"></div><div class="field"><label>Instagram</label><input id="instagram" placeholder="@username или ссылка"></div><div class="field"><label>Viber</label><input id="viber" placeholder="Телефон или ссылка"></div><div class="field full"><label>Комментарий</label><textarea id="notes" rows="3"></textarea></div></div><div id="formError" class="form-error"></div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Отмена</button><button class="primary" id="saveCustomer">Сохранить клиента</button></div></form></div>
<script type="module">
import {supabase} from './guard.js';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[];
const icons={phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>',mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',telegram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21 3-7.5 18-4.2-7.1L3 10.5 21 3Z"/><path d="m9.3 13.9 4.5-4.2"/></svg>',whatsapp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-4.6A8.5 8.5 0 1 1 20.5 11.5Z"/><path d="M8.5 8.2c.7 3 2.3 4.7 5.3 5.5"/></svg>',vk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7c1.2 6.2 4.4 10 9 10h.7v-3.4c2.5.3 4.4 2 5.2 3.4H21c-1-2-2.5-3.7-4.2-4.7 1.7-1.3 3-3.1 3.7-5.3h-3.1c-.7 1.8-2.3 3.7-4.7 4.3V7H9.9v7.4C7.7 13.8 6.2 10.8 5.8 7Z"/></svg>'};
function cleanPhone(v){return String(v||'').replace(/[^\d+]/g,'')};function link(type,v){v=String(v||'').trim();if(!v)return'';if(/^https?:\/\//i.test(v))return v;if(type==='telegram')return'https://t.me/'+v.replace(/^@/,'');if(type==='whatsapp')return'https://wa.me/'+cleanPhone(v).replace(/^\+/,'');if(type==='vk')return'https://vk.com/'+v.replace(/^@/,'').replace(/^vk\.com\//,'');if(type==='instagram')return'https://instagram.com/'+v.replace(/^@/,'').replace(/^instagram\.com\//,'');if(type==='viber')return'viber://chat?number='+encodeURIComponent(cleanPhone(v));return v}
async function access(){const [{data:a,error:ae},{data:m,error:me}]=await Promise.all([supabase.rpc('has_role',{required_role:'ADMIN'}),supabase.rpc('has_role',{required_role:'MANAGER'})]);if(ae)throw ae;if(me)throw me;if(!a&&!m){document.querySelector('.main').innerHTML='<div class="empty-state">Доступ только для администратора или менеджера.</div>';throw new Error('NO_ACCESS')}}
async function load(){const {data,error}=await supabase.from('customers').select('id,full_name,company_name,email,phone,notes,customer_type,legal_name,inn,kpp,ogrn,telegram,whatsapp,vk,instagram,viber,created_at,updated_at').order('updated_at',{ascending:false});if(error)throw error;rows=data||[];render()}
function quick(c){const a=[];if(c.phone)a.push(`<a class="contact-btn" href="tel:${esc(cleanPhone(c.phone))}" title="Позвонить">${icons.phone}</a>`);if(c.email)a.push(`<a class="contact-btn" href="mailto:${esc(c.email)}" title="Написать email">${icons.mail}</a>`);for(const t of ['telegram','whatsapp','vk'])if(c[t])a.push(`<a class="contact-btn" href="${esc(link(t,c[t]))}" target="_blank" rel="noopener" title="${t}">${icons[t]}</a>`);return a.join('')}
function details(c){const vals=[['Телефон',c.phone],['Email',c.email],['Telegram',c.telegram],['WhatsApp',c.whatsapp],['VK',c.vk],['Instagram',c.instagram],['Viber',c.viber]].filter(x=>x[1]);return vals.map(([n,v])=>`<div><b>${n}:</b> ${esc(v)}</div>`).join('')||'Контакты не указаны'}
function render(){const q=$('search').value.trim().toLowerCase();const filtered=rows.filter(c=>`${c.full_name||''} ${c.company_name||''} ${c.legal_name||''} ${c.email||''} ${c.phone||''} ${c.inn||''} ${c.telegram||''} ${c.whatsapp||''} ${c.vk||''} ${c.instagram||''} ${c.viber||''}`.toLowerCase().includes(q));$('count').textContent=`${filtered.length} клиентов`;$('list').innerHTML=filtered.map(c=>`<article class="customer-card"><div class="customer-top"><div><div class="customer-name">${esc(c.full_name)}</div><div class="customer-company">${esc(c.company_name||c.legal_name||'Частный клиент')}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge">${new Date(c.updated_at||c.created_at).toLocaleDateString('ru-RU')}</span>${c.inn?'<span class="badge billing-badge">Реквизиты</span>':''}</div></div><div class="customer-meta">${c.phone?`<span>${esc(c.phone)}</span>`:''}${c.email?`<span>${esc(c.email)}</span>`:''}${c.inn?`<span>ИНН ${esc(c.inn)}</span>`:''}</div><div class="customer-actions"><div class="contact-actions">${quick(c)}</div><button class="details-btn" data-details="${c.id}">Контакты</button><a class="open-btn" href="./customer.html?id=${c.id}">Открыть карточку</a></div><div class="contact-details" id="details-${c.id}">${details(c)}</div></article>`).join('')||'<div class="empty-state">Клиенты не найдены</div>';document.querySelectorAll('[data-details]').forEach(b=>b.onclick=()=>document.getElementById('details-'+b.dataset.details).classList.toggle('open'))}
const modal=$('customerModal');function openModal(){ $('customerForm').reset();$('formError').textContent='';modal.classList.add('open');setTimeout(()=>$('full_name').focus(),50)}function closeModal(){modal.classList.remove('open')}$('addCustomer').onclick=openModal;$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};
$('customerForm').onsubmit=async e=>{e.preventDefault();const btn=$('saveCustomer');btn.disabled=true;btn.textContent='Сохраняем…';$('formError').textContent='';const val=id=>$(id).value.trim();const payload={customer_type:val('customer_type'),full_name:val('full_name'),company_name:val('company_name')||null,inn:val('inn')||null,phone:val('phone')||null,email:val('email').toLowerCase()||null,telegram:val('telegram')||null,whatsapp:val('whatsapp')||null,vk:val('vk')||null,instagram:val('instagram')||null,viber:val('viber')||null,notes:val('notes')||null,updated_at:new Date().toISOString()};try{const {data,error}=await supabase.from('customers').insert(payload).select().single();if(error)throw error;rows.unshift(data);closeModal();await load()}catch(err){$('formError').textContent='Не удалось добавить клиента: '+err.message}finally{btn.disabled=false;btn.textContent='Сохранить клиента'}};
$('search').oninput=render;$('refresh').onclick=load;try{await access();await load()}catch(e){if(e.message!=='NO_ACCESS')$('list').innerHTML=`<div class="empty-state">Ошибка: ${esc(e.message)}</div>`}
</script></body></html>
