<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Структура команды — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script><style>.head-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}.btn.secondary{background:#fff;color:#334155;border:1px solid #dbe2ea}.btn.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca}.layout{display:grid;grid-template-columns:minmax(320px,.85fr) minmax(420px,1.15fr);gap:18px}.panel{min-width:0}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#64748b;font-size:13px}.org-block{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-top:12px}.org-name{font-weight:900;margin-bottom:8px}.dept{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid #eef2f7;padding:10px 0}.dept:first-of-type{border-top:0}.dept b{display:block}.status{font-size:11px;font-weight:900;padding:4px 7px;border-radius:999px;display:inline-block}.status.on{background:#dcfce7;color:#166534}.status.off{background:#fee2e2;color:#991b1b}.positions{display:grid;gap:10px}.position{border:1px solid #e5e7eb;border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}.toolbar select{min-width:240px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{padding:11px 12px;border:1px solid #dbe2ea;border-radius:10px;font:inherit;background:#fff}.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;place-items:center;padding:20px;z-index:90}.modal.open{display:grid}.box{width:min(620px,100%);background:#fff;border-radius:18px;padding:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.empty{padding:24px;text-align:center;color:#94a3b8}.error{color:#b91c1c;font-size:13px;margin-top:8px}@media(max-width:900px){.layout{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.sidebar{display:none}.main{margin-left:0!important}}</style></head><body><aside class="sidebar"><div class="brand"></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>Структура команды</h1><p>Отделы и должности сотрудников A4PRINT HUB</p></div><div class="head-actions"><a class="btn secondary" href="./employees.html" style="text-decoration:none">← Сотрудники</a></div></header><section class="layout"><article class="panel"><div class="panel-head"><div><h2>Отделы</h2><div class="muted">Привязаны к А4-Принт и 3D-ARTPRINT</div></div><button id="addDepartment" class="btn">+ Отдел</button></div><div id="departments" class="empty">Загрузка…</div></article><article class="panel"><div class="panel-head"><div><h2>Должности</h2><div class="muted">Выбираются при одобрении сотрудника</div></div><button id="addPosition" class="btn">+ Должность</button></div><div class="toolbar"><select id="departmentFilter" class="field"></select></div><div id="positions" class="empty">Загрузка…</div></article></section></main><div id="departmentModal" class="modal"><form id="departmentForm" class="box"><h2 id="departmentTitle">Новый отдел</h2><input id="departmentId" type="hidden"><label class="field">Организация<select id="departmentOrganization" required></select></label><div class="grid2"><label class="field">Название<input id="departmentName" required placeholder="Например, Маркетинг"></label><label class="field">Код<input id="departmentCode" placeholder="MARKETING"></label></div><label id="departmentActiveWrap" class="field" style="display:none"><span><input id="departmentActive" type="checkbox" checked> Отдел активен</span></label><div id="departmentError" class="error"></div><div class="actions"><button type="button" id="departmentCancel" class="btn secondary">Отмена</button><button class="btn">Сохранить</button></div></form></div><div id="positionModal" class="modal"><form id="positionForm" class="box"><h2 id="positionTitle">Новая должность</h2><input id="positionId" type="hidden"><label class="field">Отдел<select id="positionDepartment" required></select></label><div class="grid2"><label class="field">Название<input id="positionName" required placeholder="Например, Старший дизайнер"></label><label class="field">Код<input id="positionCode" placeholder="SENIOR_DESIGNER"></label></div><label id="positionActiveWrap" class="field" style="display:none"><span><input id="positionActive" type="checkbox" checked> Должность активна</span></label><div id="positionError" class="error"></div><div class="actions"><button type="button" id="positionCancel" class="btn secondary">Отмена</button><button class="btn">Сохранить</button></div></form></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.A4PRINT_CONFIG||{},supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id);let organizations=[],departments=[],positions=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function ensureAdmin(){const{data:{session}}=await supabase.auth.getSession();if(!session)return location.replace('./login.html');const{data,error}=await supabase.rpc('has_role',{required_role:'ADMIN'});if(error||!data){alert('Раздел доступен только администратору.');location.replace('./employees.html');throw error||new Error('ADMIN_REQUIRED')}}async function load(){const[o,d,p]=await Promise.all([supabase.from('organizations').select('id,name,code,is_active').order('name'),supabase.from('organization_units').select('id,organization_id,name,code,is_active').order('name'),supabase.from('staff_positions').select('id,organization_unit_id,name,code,is_active,sort_order').order('sort_order').order('name')]);if(o.error)throw o.error;if(d.error)throw d.error;if(p.error)throw p.error;organizations=o.data||[];departments=d.data||[];positions=p.data||[];render()}function orgName(id){return organizations.find(x=>x.id===id)?.name||'Организация'}function deptName(id){const d=departments.find(x=>x.id===id);return d?`${orgName(d.organization_id)} · ${d.name}`:'Отдел'}function render(){renderDepartments();renderFilters();renderPositions()}function renderDepartments(){if(!organizations.length){$('departments').className='empty';$('departments').textContent='Организации не найдены';return}$('departments').className='';$('departments').innerHTML=organizations.map(o=>{const list=departments.filter(d=>d.organization_id===o.id);return `<section class="org-block"><div class="org-name">${esc(o.name)}</div>${list.length?list.map(d=>`<div class="dept"><div><b>${esc(d.name)}</b><div class="muted">${esc(d.code||'Без кода')} · <span class="status ${d.is_active?'on':'off'}">${d.is_active?'Активен':'Отключён'}</span></div></div><button class="btn secondary" data-dept-edit="${d.id}">Изменить</button></div>`).join(''):'<div class="muted">Отделов пока нет</div>'}</section>`}).join('');document.querySelectorAll('[data-dept-edit]').forEach(b=>b.onclick=()=>openDepartment(b.dataset.deptEdit))}function renderFilters(){const all='<option value="">Все отделы</option>';$('departmentFilter').innerHTML=all+organizations.map(o=>`<optgroup label="${esc(o.name)}">${departments.map(d=>d.organization_id===o.id?`<option value="${d.id}">${esc(d.name)}</option>`:'').join('')}</optgroup>`).join('');$('positionDepartment').innerHTML=organizations.map(o=>`<optgroup label="${esc(o.name)}">${departments.filter(d=>d.is_active&&d.organization_id===o.id).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</optgroup>`).join('')}function renderPositions(){const filter=$('departmentFilter').value;const list=positions.filter(p=>!filter||p.organization_unit_id===filter);if(!list.length){$('positions').className='empty';$('positions').textContent='Должностей не найдено';return}$('positions').className='positions';$('positions').innerHTML=list.map(p=>`<article class="position"><div><b>${esc(p.name)}</b><div class="muted">${esc(deptName(p.organization_unit_id))} · ${esc(p.code||'Без кода')} · <span class="status ${p.is_active?'on':'off'}">${p.is_active?'Активна':'Отключена'}</span></div></div><button class="btn secondary" data-pos-edit="${p.id}">Изменить</button></article>`).join('');document.querySelectorAll('[data-pos-edit]').forEach(b=>b.onclick=()=>openPosition(b.dataset.posEdit))}function orgOptions(selected=''){return organizations.filter(o=>o.is_active).map(o=>`<option value="${o.id}" ${o.id===selected?'selected':''}>${esc(o.name)}</option>`).join('')}function openDepartment(id=''){const d=departments.find(x=>x.id===id);$('departmentForm').reset();$('departmentError').textContent='';$('departmentId').value=id;$('departmentTitle').textContent=d?'Изменить отдел':'Новый отдел';$('departmentOrganization').innerHTML=orgOptions(d?.organization_id||'');$('departmentOrganization').disabled=Boolean(d);$('departmentName').value=d?.name||'';$('departmentCode').value=d?.code||'';$('departmentActive').checked=d?.is_active!==false;$('departmentActiveWrap').style.display=d?'block':'none';$('departmentModal').classList.add('open')}function openPosition(id=''){const p=positions.find(x=>x.id===id);$('positionForm').reset();$('positionError').textContent='';$('positionId').value=id;$('positionTitle').textContent=p?'Изменить должность':'Новая должность';renderFilters();$('positionDepartment').value=p?.organization_unit_id||$('departmentFilter').value||departments.find(d=>d.is_active)?.id||'';$('positionDepartment').disabled=Boolean(p);$('positionName').value=p?.name||'';$('positionCode').value=p?.code||'';$('positionActive').checked=p?.is_active!==false;$('positionActiveWrap').style.display=p?'block':'none';$('positionModal').classList.add('open')}$('addDepartment').onclick=()=>openDepartment();$('addPosition').onclick=()=>openPosition();$('departmentCancel').onclick=()=>$('departmentModal').classList.remove('open');$('positionCancel').onclick=()=>$('positionModal').classList.remove('open');$('departmentFilter').onchange=renderPositions;$('departmentForm').onsubmit=async e=>{e.preventDefault();$('departmentError').textContent='';try{const id=$('departmentId').value;if(id){const{error}=await supabase.rpc('admin_update_department',{p_department_id:id,p_name:$('departmentName').value.trim(),p_code:$('departmentCode').value.trim()||null,p_is_active:$('departmentActive').checked});if(error)throw error}else{const{error}=await supabase.rpc('admin_create_department',{p_organization_id:$('departmentOrganization').value,p_name:$('departmentName').value.trim(),p_code:$('departmentCode').value.trim()||null});if(error)throw error}$('departmentModal').classList.remove('open');await load()}catch(x){$('departmentError').textContent=x?.message||'Не удалось сохранить отдел.'}};$('positionForm').onsubmit=async e=>{e.preventDefault();$('positionError').textContent='';try{const id=$('positionId').value;if(id){const{error}=await supabase.rpc('admin_update_position',{p_position_id:id,p_name:$('positionName').value.trim(),p_code:$('positionCode').value.trim()||null,p_is_active:$('positionActive').checked});if(error)throw error}else{const{error}=await supabase.rpc('admin_create_position',{p_department_id:$('positionDepartment').value,p_name:$('positionName').value.trim(),p_code:$('positionCode').value.trim()||null});if(error)throw error}$('positionModal').classList.remove('open');await load()}catch(x){$('positionError').textContent=x?.message||'Не удалось сохранить должность.'}};for(const id of['departmentModal','positionModal'])$(id).onclick=e=>{if(e.target===$(id))$(id).classList.remove('open')};ensureAdmin().then(load).catch(x=>{console.error(x);$('departments').textContent=x?.message||'Ошибка загрузки'})</script></body></html>
