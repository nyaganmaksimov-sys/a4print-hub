<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <title>Чат — A4PRINT HUB</title>
  <link rel="stylesheet" href="./styles.css">
  <script>
    window.A4PRINT_CONFIG={
      supabaseUrl:'https://qgakliolffnwkymoqvzn.supabase.co',
      supabasePublishableKey:'sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu',
      apiBaseUrl:'https://a4print-hub-api.onrender.com'
    };
    window.__A4_CHAT_STABLE_RUNTIME__=true;
  </script>
  <style>
    *{box-sizing:border-box}
    body{overflow:hidden}
    .chat-shell{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 150px);min-height:560px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}
    .rooms{border-right:1px solid #e5e7eb;background:#f8fafc;padding:14px;display:flex;flex-direction:column;min-height:0}
    .room-title{font-weight:900;margin-bottom:10px}.room-btn{width:100%;border:1px solid #e5e7eb;background:#fff;padding:12px;border-radius:12px;text-align:left;cursor:pointer;font:inherit;font-weight:800;color:#334155}.room-btn.active{background:#eaf2ff;border-color:#93c5fd;color:#1d4ed8}
    .people-head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;font-weight:900}.people-head small{display:grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#e2e8f0;color:#475569}
    .staff-search{width:100%;border:1px solid #dbe2ea;border-radius:10px;padding:9px 10px;font:inherit;background:#fff;margin-bottom:8px}.staff-list{display:grid;gap:7px;overflow:auto;padding-right:2px}
    .person-btn{width:100%;display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;padding:9px;border-radius:12px;text-align:left;cursor:pointer;font:inherit;color:#0f172a}.person-btn:hover{background:#fff;border-color:#e5e7eb}.person-btn.active{background:#eaf2ff;border-color:#93c5fd}.person-avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;background:#fff;border:1px solid #dbeafe;color:#2563eb;font-weight:900}.person-copy{min-width:0;display:block}.person-copy b,.person-copy small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person-copy small{font-size:11px;color:#64748b;margin-top:2px}.staff-empty{padding:18px 8px;text-align:center;color:#94a3b8;font-size:13px}
    .chat{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0}.chat-head{padding:14px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:14px;align-items:center}.chat-title h2{margin:0;font-size:18px}.chat-title>span{color:#64748b;font-size:12px;display:block;margin-top:3px}.head-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.recipient-picker{display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b}.recipient-picker select{max-width:220px;border:1px solid #cbd5e1;border-radius:9px;padding:7px 9px;background:#fff;font:inherit;color:#0f172a}.drive-state{font-size:12px;padding:6px 9px;border-radius:999px;background:#f1f5f9;color:#64748b;text-decoration:none;white-space:nowrap}.drive-state.ok{background:#dcfce7;color:#166534}
    .messages{padding:18px;overflow:auto;background:linear-gradient(#fff,#fbfdff);display:flex;flex-direction:column;gap:10px;min-height:0}.msg{max-width:min(74%,680px);padding:10px 12px;border-radius:14px;background:#f1f5f9;align-self:flex-start}.msg.mine{background:#dbeafe;align-self:flex-end}.msg .meta{font-size:11px;color:#64748b;margin-bottom:4px}.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}.attachments{display:grid;gap:7px;margin-top:8px}.attachment{display:flex;align-items:center;gap:10px;width:100%;border:1px solid rgba(100,116,139,.22);background:rgba(255,255,255,.78);border-radius:11px;padding:9px 10px;text-align:left;cursor:pointer;color:#0f172a}.attachment-info{min-width:0;flex:1}.attachment-name{display:block;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachment-size{display:block;color:#64748b;font-size:11px;margin-top:2px}
    .composer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:14px;border-top:1px solid #e5e7eb;align-items:end}.composer textarea{resize:none;min-height:46px;max-height:130px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}.send,.attach-btn{border:0;border-radius:12px;font-weight:800;cursor:pointer}.send{min-height:46px;padding:0 18px;background:#2563eb;color:#fff}.attach-btn{width:46px;height:46px;background:#f1f5f9;color:#334155;font-size:20px}.send:disabled,.attach-btn:disabled{opacity:.55;cursor:not-allowed}.pending{grid-column:1/-1;display:none;gap:8px;flex-wrap:wrap}.pending.show{display:flex}.pending-item{display:flex;align-items:center;gap:7px;max-width:100%;padding:7px 9px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;font-size:12px}.pending-item.uploading{background:#f8fafc;border-color:#e2e8f0;color:#64748b}.pending-item.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}.pending-name{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pending-remove{border:0;background:transparent;color:#64748b;cursor:pointer;font-size:16px;padding:0 2px}.upload-note{grid-column:1/-1;color:#64748b;font-size:11px;margin-top:-4px}.empty-chat{margin:auto;color:#94a3b8;text-align:center}.presence{font-size:12px;color:#64748b}#refresh,#notifBtn{border:1px solid #dbe2ea;background:#fff;border-radius:9px;padding:7px 10px;font:inherit;font-weight:800;cursor:pointer}#notifBtn.on{background:#dcfce7;border-color:#86efac;color:#166534}#notifBtn.off{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
    @media(max-width:980px){.chat-shell{grid-template-columns:250px minmax(0,1fr)}.recipient-picker span{display:none}.recipient-picker select{max-width:160px}}
  </style>
</head>
<body>
  <aside class="sidebar"><div class="brand"><span class="brand-mark">A4</span><div>A4PRINT<br><small>HUB</small></div></div><nav></nav></aside>
  <main class="main">
    <header class="topbar"><div><h1>💬 Внутренний чат</h1><p>Общение сотрудников A4PRINT HUB</p></div><div class="presence" id="me">Загрузка...</div></header>
    <section class="chat-shell">
      <aside class="rooms">
        <div class="room-title">Чаты</div>
        <button class="room-btn active" id="generalRoom"># Общий чат</button>
        <div class="people-head"><span>Сотрудники</span><small id="staffCount">0</small></div>
        <input id="staffSearch" class="staff-search" placeholder="Найти сотрудника">
        <div id="staffList" class="staff-list"><div class="staff-empty">Загрузка...</div></div>
      </aside>
      <div class="chat">
        <div class="chat-head">
          <div class="chat-title"><h2 id="roomName">Общий чат</h2><span id="roomSubtitle">Все сотрудники</span></div>
          <div class="head-actions">
            <label class="recipient-picker"><span>Кому:</span><select id="recipientSelect"><option value="general">Общий чат</option></select></label>
            <button id="notifBtn" type="button">🔔 Уведомления</button>
            <a class="drive-state" id="driveStatus" href="./drive-connect.html">Файлы: HUB</a>
            <button id="refresh" type="button">Обновить</button>
          </div>
        </div>
        <div class="messages" id="messages"><div class="empty-chat">Подключение к чату...</div></div>
        <form class="composer" id="composer">
          <div class="pending" id="pending"></div>
          <input id="fileInput" type="file" multiple hidden>
          <button type="button" class="attach-btn" id="attachBtn" title="Прикрепить файл">📎</button>
          <textarea id="text" maxlength="4000" placeholder="Напишите сообщение..."></textarea>
          <button class="send" id="send">Отправить</button>
          <div class="upload-note">Файлы сохраняются в защищённом хранилище HUB · до 25 МБ каждый · максимум 6 файлов</div>
        </form>
      </div>
    </section>
  </main>

  <script src="./chat-modern.js?v=20260904-1"></script>
  <script src="./chat-watchdog.js?v=20260904-2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./messages.js?v=20260904-20"></script>
  <script>
    window.addEventListener('load',()=>{
      const p=new URLSearchParams(location.search);
      const app=p.get('app')==='1'||p.get('embed')==='1'||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
      if(!app && innerWidth>900){setTimeout(()=>{const s=document.createElement('script');s.src='./navigation.js?v=20260904-10';document.body.appendChild(s)},800)}
      if(p.get('room')){setTimeout(()=>{const s=document.createElement('script');s.src='./chat-room-router.js?v=20260904-4';document.body.appendChild(s)},700)}
    },{once:true});
  </script>
</body>
</html>
