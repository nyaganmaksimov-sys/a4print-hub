<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сообщения — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">A4</span><div>A4PRINT<br><small>HUB</small></div></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>💬 Сообщения</h1><p>Внутренние комнаты и последние сообщения</p></div><button id="refresh">Обновить</button></header><section class="panel"><div id="list"><div class="empty">Загрузка...</div></div></section></main><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id);async function load(){const{data,error}=await supabase.from('chat_rooms').select('id,name,is_group,order_id,created_at,messages(id,body,created_at,sender_id)').order('created_at',{ascending:false});if(error){$('list').innerHTML=`<div class="empty">Ошибка: ${error.message}</div>`;return}const rows=data||[];$('list').innerHTML=rows.map(r=>{const m=(r.messages||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];return`<div style="padding:14px 0;border-bottom:1px solid #e5e7eb"><b>${r.name||'Комната'}</b><div style="color:#64748b;font-size:13px;margin-top:5px">${m?m.body:'Сообщений пока нет'}</div></div>`}).join('')||'<div class="empty">Комнат сообщений пока нет</div>'}$('refresh').onclick=load;load();</script></body></html>
