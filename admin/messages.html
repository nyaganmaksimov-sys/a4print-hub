<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Чат — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script><style>.chat-shell{display:grid;grid-template-columns:260px minmax(0,1fr);height:calc(100vh - 150px);min-height:540px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}.rooms{border-right:1px solid #e5e7eb;background:#f8fafc;padding:14px}.room-title{font-weight:800;margin-bottom:10px}.room-btn{width:100%;border:0;background:#fff;padding:12px;border-radius:12px;text-align:left;cursor:pointer;border:1px solid #e5e7eb}.room-btn.active{background:#eaf2ff;border-color:#93c5fd}.chat{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.chat-head{padding:16px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:12px;align-items:center}.chat-head h2{margin:0;font-size:18px}.chat-head span{color:#64748b;font-size:13px}.messages{padding:18px;overflow:auto;background:linear-gradient(#fff,#fbfdff);display:flex;flex-direction:column;gap:10px}.msg{max-width:min(74%,680px);padding:10px 12px;border-radius:14px;background:#f1f5f9;align-self:flex-start}.msg.mine{background:#dbeafe;align-self:flex-end}.msg .meta{font-size:11px;color:#64748b;margin-bottom:4px}.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}.composer{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px;border-top:1px solid #e5e7eb}.composer textarea{resize:none;min-height:46px;max-height:130px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}.send{border:0;border-radius:12px;padding:0 18px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.send:disabled{opacity:.55;cursor:not-allowed}.empty-chat{margin:auto;color:#94a3b8;text-align:center}.presence{font-size:12px;color:#64748b}@media(max-width:850px){.chat-shell{grid-template-columns:1fr;height:calc(100vh - 130px)}.rooms{display:none}.msg{max-width:88%}.sidebar{display:none}.main{margin-left:0!important}}</style></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">A4</span><div>A4PRINT<br><small>HUB</small></div></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>💬 Внутренний чат</h1><p>Общение сотрудников A4PRINT HUB</p></div><div class="presence" id="me">Загрузка...</div></header><section class="chat-shell"><aside class="rooms"><div class="room-title">Комнаты</div><button class="room-btn active" id="generalRoom"># Общий чат</button></aside><div class="chat"><div class="chat-head"><div><h2 id="roomName">Общий чат</h2><span>Все сотрудники</span></div><button id="refresh">Обновить</button></div><div class="messages" id="messages"><div class="empty-chat">Загрузка сообщений...</div></div><form class="composer" id="composer"><textarea id="text" maxlength="4000" placeholder="Напишите сообщение..." required></textarea><button class="send" id="send">Отправить</button></form></div></section></main><script src="./navigation.js"></script><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id);let profile=null,room=null,channel=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fmt(v){return new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}async function init(){const{data:{session}}=await supabase.auth.getSession();if(!session)return location.replace('./login.html');const{data:p,error:pErr}=await supabase.from('users').select('id,full_name,email,is_active').eq('auth_user_id',session.user.id).maybeSingle();if(pErr)throw pErr;if(!p||p.is_active===false)throw new Error('Профиль сотрудника не найден или отключён.');profile=p;$('me').textContent=p.full_name||p.email;const{data:r,error:rErr}=await supabase.from('chat_rooms').select('id,name').eq('name','Общий чат').limit(1).maybeSingle();if(rErr)throw rErr;if(!r){$('messages').innerHTML='<div class="empty-chat">Общий чат ещё не создан. Нужно применить миграцию 007_internal_chat.sql.</div>';return}room=r;$('roomName').textContent=r.name;await loadMessages();subscribe()}async function loadMessages(){if(!room)return;const{data,error}=await supabase.from('messages').select('id,body,created_at,sender_id,users:sender_id(full_name,email)').eq('room_id',room.id).is('deleted_at',null).order('created_at',{ascending:true}).limit(300);if(error)throw error;render(data||[])}function render(rows){$('messages').innerHTML=rows.length?rows.map(m=>`<div class="msg ${m.sender_id===profile.id?'mine':''}"><div class="meta">${esc(m.users?.full_name||m.users?.email||'Сотрудник')} · ${fmt(m.created_at)}</div><div class="body">${esc(m.body)}</div></div>`).join(''):'<div class="empty-chat">Сообщений пока нет. Напишите первым.</div>';$('messages').scrollTop=$('messages').scrollHeight}function subscribe(){if(channel)supabase.removeChannel(channel);channel=supabase.channel('a4print-internal-chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`room_id=eq.${room.id}`},()=>loadMessages().catch(showError)).subscribe()}function showError(e){console.error(e);$('messages').insertAdjacentHTML('beforeend',`<div class="empty-chat" style="color:#b91c1c">${esc(e.message||'Ошибка чата')}</div>`)}$('composer').onsubmit=async e=>{e.preventDefault();if(!room||!profile)return;const body=$('text').value.trim();if(!body)return;try{$('send').disabled=true;const{error}=await supabase.from('messages').insert({room_id:room.id,sender_id:profile.id,body});if(error)throw error;$('text').value='';await loadMessages()}catch(err){alert(err.message||'Не удалось отправить сообщение.')}finally{$('send').disabled=false;$('text').focus()}};$('text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}});$('refresh').onclick=()=>loadMessages().catch(e=>alert(e.message));init().catch(e=>{$('messages').innerHTML=`<div class="empty-chat" style="color:#b91c1c">${esc(e.message)}</div>`});</script></body></html>
