<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Чат — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script><style>
.chat-shell{display:grid;grid-template-columns:260px minmax(0,1fr);height:calc(100vh - 150px);min-height:540px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}.rooms{border-right:1px solid #e5e7eb;background:#f8fafc;padding:14px}.room-title{font-weight:800;margin-bottom:10px}.room-btn{width:100%;border:0;background:#fff;padding:12px;border-radius:12px;text-align:left;cursor:pointer;border:1px solid #e5e7eb}.room-btn.active{background:#eaf2ff;border-color:#93c5fd}.chat{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.chat-head{padding:16px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:12px;align-items:center}.chat-head h2{margin:0;font-size:18px}.chat-head span{color:#64748b;font-size:13px}.head-actions{display:flex;gap:10px;align-items:center}.drive-state{font-size:12px;padding:6px 9px;border-radius:999px;background:#f1f5f9;color:#64748b;text-decoration:none;white-space:nowrap}.drive-state.ok{background:#dcfce7;color:#166534}.drive-state.warn{background:#fff7ed;color:#9a3412}.messages{padding:18px;overflow:auto;background:linear-gradient(#fff,#fbfdff);display:flex;flex-direction:column;gap:10px}.msg{max-width:min(74%,680px);padding:10px 12px;border-radius:14px;background:#f1f5f9;align-self:flex-start}.msg.mine{background:#dbeafe;align-self:flex-end}.msg .meta{font-size:11px;color:#64748b;margin-bottom:4px}.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}.attachments{display:grid;gap:7px;margin-top:8px}.attachment{display:flex;align-items:center;gap:10px;width:100%;border:1px solid rgba(100,116,139,.22);background:rgba(255,255,255,.78);border-radius:11px;padding:9px 10px;text-align:left;cursor:pointer;color:#0f172a}.attachment:hover{border-color:#60a5fa;background:#fff}.attachment-icon{font-size:22px;line-height:1}.attachment-info{min-width:0;flex:1}.attachment-name{display:block;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachment-size{display:block;color:#64748b;font-size:11px;margin-top:2px}.composer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:14px;border-top:1px solid #e5e7eb;align-items:end}.composer textarea{resize:none;min-height:46px;max-height:130px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}.send,.attach-btn{border:0;border-radius:12px;font-weight:800;cursor:pointer}.send{min-height:46px;padding:0 18px;background:#2563eb;color:#fff}.attach-btn{width:46px;height:46px;background:#f1f5f9;color:#334155;font-size:20px}.attach-btn:hover{background:#e2e8f0}.send:disabled,.attach-btn:disabled{opacity:.55;cursor:not-allowed}.pending{grid-column:1/-1;display:none;gap:8px;flex-wrap:wrap}.pending.show{display:flex}.pending-item{display:flex;align-items:center;gap:7px;max-width:100%;padding:7px 9px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;font-size:12px}.pending-item.uploading{background:#f8fafc;border-color:#e2e8f0;color:#64748b}.pending-item.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}.pending-name{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pending-remove{border:0;background:transparent;color:#64748b;cursor:pointer;font-size:16px;padding:0 2px}.upload-note{grid-column:1/-1;color:#64748b;font-size:11px;margin-top:-4px}.empty-chat{margin:auto;color:#94a3b8;text-align:center}.presence{font-size:12px;color:#64748b}@media(max-width:850px){.chat-shell{grid-template-columns:1fr;height:calc(100vh - 130px)}.rooms{display:none}.msg{max-width:88%}.sidebar{display:none}.main{margin-left:0!important}.chat-head{padding:12px}.drive-state{max-width:130px;overflow:hidden;text-overflow:ellipsis}.composer{padding:10px;gap:8px}.send{padding:0 12px}.pending-name{max-width:180px}}
</style></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">A4</span><div>A4PRINT<br><small>HUB</small></div></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>💬 Внутренний чат</h1><p>Общение сотрудников A4PRINT HUB</p></div><div class="presence" id="me">Загрузка...</div></header><section class="chat-shell"><aside class="rooms"><div class="room-title">Комнаты</div><button class="room-btn active" id="generalRoom"># Общий чат</button></aside><div class="chat"><div class="chat-head"><div><h2 id="roomName">Общий чат</h2><span>Все сотрудники</span></div><div class="head-actions"><a class="drive-state" id="driveStatus" href="./drive-connect.html">Google Drive</a><button id="refresh">Обновить</button></div></div><div class="messages" id="messages"><div class="empty-chat">Загрузка сообщений...</div></div><form class="composer" id="composer"><div class="pending" id="pending"></div><input id="fileInput" type="file" multiple hidden><button type="button" class="attach-btn" id="attachBtn" title="Прикрепить файл">📎</button><textarea id="text" maxlength="4000" placeholder="Напишите сообщение или прикрепите файл..."></textarea><button class="send" id="send">Отправить</button><div class="upload-note">Файлы хранятся на Google Drive · до 25 МБ каждый · максимум 6 файлов в одном сообщении</div></form></div></section></main><script src="./navigation.js"></script><script type="module">
import{supabase}from'./guard.js';
const $=id=>document.getElementById(id),cfg=window.A4PRINT_CONFIG||{};let profile=null,room=null,channel=null,pending=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fmt(v){return new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}function sizeFmt(n){n=Number(n||0);if(n<1024)return n+' Б';if(n<1048576)return(n/1024).toFixed(n<10240?1:0)+' КБ';return(n/1048576).toFixed(n<10485760?1:0)+' МБ'}function fileIcon(a){const t=(a.mime_type||'').toLowerCase(),n=(a.file_name||'').toLowerCase();if(t.startsWith('image/'))return'🖼️';if(t.includes('pdf')||n.endsWith('.pdf'))return'📕';if(t.includes('zip')||t.includes('rar')||n.match(/\.(zip|rar|7z)$/))return'🗜️';if(t.includes('word')||n.match(/\.(doc|docx)$/))return'📘';if(t.includes('sheet')||t.includes('excel')||n.match(/\.(xls|xlsx|csv)$/))return'📗';if(t.includes('photoshop')||n.endsWith('.psd'))return'🎨';if(n.match(/\.(cdr|ai|eps|svg)$/))return'✒️';return'📄'}async function sessionHeaders(){const{data:{session}}=await supabase.auth.getSession();if(!session)throw new Error('Сессия истекла. Войдите снова.');return{Authorization:`Bearer ${session.access_token}`,apikey:cfg.supabasePublishableKey||''}}function edgeUrl(q=''){return`${cfg.supabaseUrl}/functions/v1/chat-drive${q}`}async function edgeJson(url,opt={}){const headers=await sessionHeaders();const r=await fetch(url,{...opt,headers:{...headers,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||'Ошибка Google Drive');return d}async function loadDriveStatus(){try{const d=await edgeJson(edgeUrl('?action=status'));const el=$('driveStatus');if(d.connected){el.textContent='● Drive подключён';el.className='drive-state ok';el.title=d.google_email||'Google Drive подключён'}else if(d.configured){el.textContent='Drive: подключить';el.className='drive-state warn'}else{el.textContent='Drive: настройка';el.className='drive-state warn'}}catch(e){$('driveStatus').textContent='Drive недоступен';$('driveStatus').className='drive-state warn'}}async function init(){const{data:{session}}=await supabase.auth.getSession();if(!session)return location.replace('./login.html');const{data:p,error:pErr}=await supabase.from('users').select('id,full_name,email,is_active').eq('auth_user_id',session.user.id).maybeSingle();if(pErr)throw pErr;if(!p||p.is_active===false)throw new Error('Профиль сотрудника не найден или отключён.');profile=p;$('me').textContent=p.full_name||p.email;const{data:r,error:rErr}=await supabase.from('chat_rooms').select('id,name').eq('name','Общий чат').limit(1).maybeSingle();if(rErr)throw rErr;if(!r){$('messages').innerHTML='<div class="empty-chat">Общий чат ещё не создан.</div>';return}room=r;$('roomName').textContent=r.name;await Promise.all([loadMessages(),loadDriveStatus()]);subscribe()}async function loadMessages(){if(!room)return;const{data,error}=await supabase.from('messages').select('id,body,created_at,sender_id,users:sender_id(full_name,email),message_attachments(id,file_name,mime_type,file_size,created_at)').eq('room_id',room.id).is('deleted_at',null).order('created_at',{ascending:true}).limit(300);if(error)throw error;render(data||[])}function attachmentHtml(a){return`<button type="button" class="attachment" data-download="${esc(a.id)}" data-name="${esc(a.file_name)}"><span class="attachment-icon">${fileIcon(a)}</span><span class="attachment-info"><span class="attachment-name">${esc(a.file_name)}</span><span class="attachment-size">${sizeFmt(a.file_size)} · скачать</span></span><span>⬇️</span></button>`}function render(rows){$('messages').innerHTML=rows.length?rows.map(m=>{const at=(m.message_attachments||[]).map(attachmentHtml).join('');return`<div class="msg ${m.sender_id===profile.id?'mine':''}"><div class="meta">${esc(m.users?.full_name||m.users?.email||'Сотрудник')} · ${fmt(m.created_at)}</div>${m.body?`<div class="body">${esc(m.body)}</div>`:''}${at?`<div class="attachments">${at}</div>`:''}</div>`}).join(''):'<div class="empty-chat">Сообщений пока нет. Напишите первым.</div>';document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadAttachment(b.dataset.download,b.dataset.name));$('messages').scrollTop=$('messages').scrollHeight}function subscribe(){if(channel)supabase.removeChannel(channel);channel=supabase.channel('a4print-internal-chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`room_id=eq.${room.id}`},()=>setTimeout(()=>loadMessages().catch(showError),250)).on('postgres_changes',{event:'UPDATE',schema:'public',table:'message_attachments',filter:`room_id=eq.${room.id}`},()=>loadMessages().catch(showError)).subscribe()}function showError(e){console.error(e);$('messages').insertAdjacentHTML('beforeend',`<div class="empty-chat" style="color:#b91c1c">${esc(e.message||'Ошибка чата')}</div>`)}function drawPending(){const el=$('pending');if(!pending.length){el.classList.remove('show');el.innerHTML='';return}el.classList.add('show');el.innerHTML=pending.map(x=>`<div class="pending-item ${x.status||''}"><span>${x.status==='uploading'?'⏳':x.status==='error'?'⚠️':fileIcon(x)}</span><span class="pending-name">${esc(x.file_name||x.name)}</span>${x.status==='uploading'?'':`<button type="button" class="pending-remove" data-remove="${esc(x.localId)}">×</button>`}</div>`).join('');el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removePending(b.dataset.remove))}async function uploadOne(file,localId){const fd=new FormData();fd.append('room_id',room.id);fd.append('file',file,file.name);const headers=await sessionHeaders();const r=await fetch(edgeUrl(),{method:'POST',headers,body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||'Не удалось загрузить файл.');return d.attachment}async function addFiles(files){const list=[...files];if(!room||!list.length)return;if(pending.filter(x=>x.status!=='error').length+list.length>6)return alert('Можно прикрепить не более 6 файлов к одному сообщению.');for(const file of list){if(file.size>25*1024*1024){alert(`Файл «${file.name}» больше 25 МБ.`);continue}const localId=crypto.randomUUID();const item={localId,name:file.name,file_name:file.name,file_size:file.size,mime_type:file.type,status:'uploading'};pending.push(item);drawPending();try{const a=await uploadOne(file,localId);Object.assign(item,a,{status:''});drawPending()}catch(e){item.status='error';item.error=e.message;drawPending();alert(`Не удалось загрузить «${file.name}»: ${e.message}`)}}$('fileInput').value=''}async function removePending(localId){const item=pending.find(x=>x.localId===localId);if(!item)return;if(item.id){try{await edgeJson(edgeUrl(`?attachment_id=${encodeURIComponent(item.id)}`),{method:'DELETE'})}catch(e){console.warn(e)}}pending=pending.filter(x=>x.localId!==localId);drawPending()}async function downloadAttachment(id,name){try{const headers=await sessionHeaders();const r=await fetch(edgeUrl(`?attachment_id=${encodeURIComponent(id)}`),{headers});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Не удалось скачать файл.')}const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name||'file';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}catch(e){alert(e.message||'Не удалось скачать файл.')}}$('attachBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>addFiles(e.target.files);$('composer').onsubmit=async e=>{e.preventDefault();if(!room||!profile)return;const body=$('text').value.trim(),ready=pending.filter(x=>x.id&&x.status!=='error');if(!body&&!ready.length)return;if(pending.some(x=>x.status==='uploading'))return alert('Дождитесь окончания загрузки файлов.');try{$('send').disabled=true;$('attachBtn').disabled=true;const{data:message,error}=await supabase.from('messages').insert({room_id:room.id,sender_id:profile.id,body}).select('id').single();if(error)throw error;if(ready.length){const{error:aErr}=await supabase.from('message_attachments').update({message_id:message.id}).in('id',ready.map(x=>x.id));if(aErr){await supabase.from('messages').delete().eq('id',message.id);throw aErr}}$('text').value='';pending=[];drawPending();await loadMessages()}catch(err){alert(err.message||'Не удалось отправить сообщение.')}finally{$('send').disabled=false;$('attachBtn').disabled=false;$('text').focus()}};$('text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}});$('refresh').onclick=()=>Promise.all([loadMessages(),loadDriveStatus()]).catch(e=>alert(e.message));init().catch(e=>{$('messages').innerHTML=`<div class="empty-chat" style="color:#b91c1c">${esc(e.message)}</div>`});
</script></body></html>
