<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход для сотрудников · 3D-ARTPRINT</title><style>*{box-sizing:border-box}html,body{width:100%;min-height:100%;}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at top right,#173e60 0,#0b1525 45%,#050b15 100%);font:15px system-ui,sans-serif;color:#e8f5ff}.login{width:min(440px,calc(100% - 28px));margin:24px auto;border:1px solid #315772;border-radius:20px;padding:30px;background:#0b1a2df2;box-shadow:0 20px 70px #0008}.logo{width:min(330px,100%);height:auto;display:block;margin:0 0 12px}h1{font-size:23px;margin:20px 0 8px}p{color:#9eb9ce;line-height:1.55}label{display:grid;gap:8px;margin:17px 0;font-weight:600}input{padding:13px 14px;background:#091424;border:1px solid #46627e;border-radius:10px;color:#fff;font:inherit;width:100%}input:focus{outline:2px solid #1ac7e7}button{padding:13px;border:0;border-radius:10px;background:linear-gradient(100deg,#086e9a,#a32379);color:white;font:inherit;font-weight:700;width:100%;cursor:pointer}button:disabled{opacity:.55}.status{min-height:22px;color:#ffc7b9;font-size:13px}.link{margin-top:18px;display:block;text-align:center;color:#9fc7e6;text-decoration:none;font-size:13px} .auth-section{font-size:15px;color:#a6d9eb;margin:12px 0 5px}.alternative{border-top:1px solid #29465e;padding-top:18px;margin-top:14px}.separation{font-size:12px;color:#a7bed4;text-align:center;margin-bottom:12px}.auth-option{display:block;text-align:center;border:1px solid #40718f;padding:12px 15px;border-radius:10px;text-decoration:none;color:#e6faff;font-weight:700;background:#173550}.auth-option:hover{background:#255276}.auth-caption{font-size:12px;margin-bottom:0;text-align:center}</style></head><body><main class="login"><img class="logo" src="./assets/3d-artprint/logo.png?v=hq20261023" alt="3D-ARTPRINT"><h1>Вход в 3D-ARTPRINT</h1><p>Войдите по внутреннему логину или используйте существующую учётную запись.</p><h2 class="auth-section">Внутренний вход</h2><form id="employeeLogin"><label>Логин<input name="login" required minlength="3" maxlength="32" autocomplete="username" pattern="[a-zA-Z][a-zA-Z0-9._-]{2,31}" autocapitalize="none" spellcheck="false"></label><label>Пароль<input name="password" required type="password" autocomplete="current-password"></label><button id="submit">Войти</button><p id="message" class="status" role="alert"></p></form><div class="alternative"><div class="separation">Другие способы входа</div><a id="existingLogin" class="auth-option" href="./login.html">Войти через Email или Google</a><p class="auth-caption">На следующем экране доступны также остальные способы авторизации, включённые в системе.</p></div></main><script src="./vendor/supabase.js?v=20260905-1"></script><script type="module" src="./3d-artprint-login.js?v=2"></script></body></html>
