<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Склад — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script></head><body><main class="main" style="margin-left:0"><header class="topbar"><div><h1>📦 Склад</h1><p>Номенклатура, остатки и движения</p></div><div><span id="userEmail" style="margin-right:12px"></span><a href="./index.html">← Главная</a></div></header><section class="stats"><article><span>Позиций</span><strong id="itemsCount">0</strong></article><article><span>Материалы</span><strong id="materialsCount">0</strong></article><article><span>Низкий остаток</span><strong id="lowCount">0</strong></article></section><section class="panel"><div class="panel-head"><h2>Номенклатура</h2><button id="add">＋ Добавить</button></div><div class="toolbar"><input id="search" placeholder="Поиск по названию или SKU"><select id="type"><option value="">Все типы</option><option value="PRODUCT">Товары</option><option value="MATERIAL">Материалы</option><option value="SERVICE">Услуги</option><option value="FINISHED_PRODUCT">Готовая продукция</option><option value="MODEL_3D">3D-модели</option></select><button id="refresh">Обновить</button></div><div id="list"><div class="empty">Загрузка...</div></div></section><dialog id="dlg"><form method="dialog" id="form"><h2>Новая позиция</h2><label>Название<input id="name" required></label><label>SKU<input id="sku" required></label><label>Тип<select id="itemType"><option value="PRODUCT">Товар</option><option value="MATERIAL">Материал</option><option value="SERVICE">Услуга</option><option value="FINISHED_PRODUCT">Готовая продукция</option><option value="MODEL_3D">3D-модель</option></select></label><label>Единица<input id="unit" value="шт"></label><label>Продажная цена, ₽<input id="sale" type="number" min="0" step="0.01" value="0"></label><label>Минимальный остаток<input id="min" type="number" min="0" step="0.001" value="0"></label><div class="actions"><button value="cancel">Отмена</button><button id="save" value="default">Сохранить</button></div></form></dialog></main><script type="module">import {supabase} from './guard.js';const {data:{session}}=await supabase.auth.getSession();if(session)document.getElementById('userEmail').textContent=session.user.email||'';const $=id=>document.getElementById(id);let items=[];const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0));async function load(){const {data,error}=await supabase.from('catalog_items').select('*').order('name');if(error){$('list').innerHTML=`<div class="empty">Ошибка: ${error.message}</div>`;return}items=data||[];render()}function render(){const q=$('search').value.toLowerCase(),t=$('type').value;const a=items.filter(x=>(!q||x.name.toLowerCase().includes(q)||x.sku.toLowerCase().includes(q))&&(!t||x.item_type===t));$('itemsCount').textContent=items.length;$('materialsCount').textContent=items.filter(x=>x.item_type==='MATERIAL').length;$('lowCount').textContent=0;$('list').innerHTML=a.map(x=>`<div class="row"><div><b>${x.name}</b><small>${x.sku} · ${x.item_type} · ${x.unit}</small></div><strong>${money(x.sale_price)}</strong><span>мин. ${x.min_stock||0}</span></div>`).join('')||'<div class="empty">Ничего не найдено</div>'}$('refresh').onclick=load;$('search').oninput=render;$('type').onchange=render;$('add').onclick=()=>{if(!$('dlg').open)$('dlg').showModal()};$('form').onsubmit=async e=>{e.preventDefault();const {error}=await supabase.from('catalog_items').insert({name:$('name').value.trim(),sku:$('sku').value.trim(),item_type:$('itemType').value,unit:$('unit').value.trim()||'шт',sale_price:Number($('sale').value)||0,min_stock:Number($('min').value)||0});if(error){alert(error.message);return}$('dlg').close();e.target.reset();$('unit').value='шт';await load()};load();</script><style>.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.toolbar input,.toolbar select,dialog input,dialog select{padding:11px;border:1px solid #dbe1ea;border-radius:9px;font:inherit}.toolbar input{flex:1;min-width:220px}.row{display:grid;grid-template-columns:1fr 150px 150px;gap:16px;padding:15px 0;border-bottom:1px solid #e5e7eb;align-items:center}.row small{display:block;color:#64748b;margin-top:5px}.row strong{font-size:16px}dialog{border:0;border-radius:16px;padding:26px;width:min(440px,calc(100% - 32px));box-shadow:0 20px 60px #0002}dialog::backdrop{background:#0006}dialog label{display:grid;gap:7px;margin:12px 0}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}</style></body></html>
