<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Операторы кассы — A4PRINT HUB</title><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7fb;color:#132033}.shell{max-width:1180px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:900}.top h1{margin:0;font-size:28px}.muted{color:#718096}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font:inherit;font-weight:750;cursor:pointer}.btn.primary{background:#111827;color:#fff}.btn.light{background:#fff;border:1px solid #dfe5ee;color:#243248}.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px}.panel{background:#fff;border:1px solid #e4e9f1;border-radius:20px;box-shadow:0 10px 35px rgba(15,23,42,.05)}.form{padding:22px}.form h2,.list h2{margin:0 0 6px}.field{display:grid;gap:7px;margin-top:16px}.field input{width:100%;border:1px solid #dbe2ea;border-radius:11px;padding:12px 13px;font:inherit;outline:0}.field input:focus{border-color:#8aa5ff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}.hint{font-size:12px;color:#8793a6;margin-top:8px}.notice{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;font-size:14px}.notice.ok{display:block;background:#ecfdf3;color:#15703b}.notice.error{display:block;background:#fff1f2;color:#a11b32}.list{padding:22px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.search{border:1px solid #dbe2ea;border-radius:11px;padding:11px 13px;font:inherit;width:min(280px,100%)}.cards{display:grid;gap:12px}.operator{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid #e7ebf1;border-radius:15px;padding:15px 16px}.person{display:flex;align-items:center;gap:12px;min-width:0}.avatar{width:42px;height:42px;border-radius:13px;background:#eef2ff;display:grid;place-items:center;font-weight:850;color:#3949ab}.name{font-weight:800}.email{font-size:13px;color:#758198;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}.badge{font-size:12px;padding:6px 9px;border-radius:999px;font-weight:750}.badge.on{background:#ecfdf3;color:#166534}.badge.off{background:#f1f5f9;color:#64748b}.op-actions{display:flex;gap:8px;align-items:center}.small{padding:8px 10px;border-radius:9px;border:1px solid #dbe2ea;background:#fff;cursor:pointer}.empty{padding:40px;text-align:center;color:#8b97aa}.modal{position:fixed;inset:0;background:rgba(15,23,42,.38);display:none;place-items:center;padding:20px}.modal.show{display:grid}.modal-card{width:min(420px,100%);background:#fff;border-radius:18px;padding:22px;box-shadow:0 24px 80px rgba(15,23,42,.22)}.modal-card h3{margin:0 0 8px}@media(max-width:900px){.grid{grid-template-columns:1fr}.shell{padding:18px}.top{align-items:flex-start;flex-direction:column}.operator{align-items:flex-start;flex-direction:column}.op-actions{width:100%;justify-content:flex-end}}</style></head><body><main class="shell"><div class="top"><div class="brand"><div class="logo">A4</div><div><h1>Операторы кассы</h1><div class="muted">Личные логины и пароли сотрудников</div></div></div><div class="actions"><a class="btn light" href="./pos.html" style="text-decoration:none">Открыть кассу</a><a class="btn light" href="./index.html" style="text-decoration:none">HUB</a></div></div><div class="grid"><section class="panel form"><h2>Новый оператор</h2><div class="muted">Создайте отдельный доступ для кассира.</div><form id="createForm"><label class="field">Имя<input id="fullName" required placeholder="Например, Анна Иванова"></label><label class="field">Email / логин<input id="email" type="email" required placeholder="operator@a4print.ru"></label><label class="field">Пароль<input id="password" type="password" minlength="6" required placeholder="Минимум 6 символов"></label><button id="createBtn" class="btn primary" style="width:100%;margin-top:18px">Создать оператора</button><div class="hint">Пароль хранится в Supabase Auth и не сохраняется в открытом виде.</div><div id="notice" class="notice"></div></form></section><section class="panel list"><div class="toolbar"><div><h2>Сотрудники</h2><div id="count" class="muted">Загрузка…</div></div><input id="search" class="search" placeholder="Поиск по имени или email"></div><div id="cards" class="cards"></div></section></div></main><div id="modal" class="modal"><div class="modal-card"><h3>Новый пароль</h3><div class="muted" id="modalName"></div><label class="field">Пароль<input id="newPassword" type="password" minlength="6" placeholder="Минимум 6 символов"></label><div class="actions" style="justify-content:flex-end;margin-top:18px"><button id="cancelModal" class="btn light">Отмена</button><button id="savePassword" class="btn primary">Сохранить</button></div></div></div><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id);let operators=[],selected=null;function note(t,k='ok'){$('notice').textContent=t;$('notice').className='notice '+k}async function session(){const {data:{session}}=await supabase.auth.getSession();if(!session)throw new Error('Сессия истекла');return session}async function api(path,opt={}){const s=await session(),base=window.A4PRINT_CONFIG?.apiBaseUrl;if(!base)throw new Error('API не подключён');const r=await fetch(base+path,{...opt,headers:{Authorization:`Bearer ${s.access_token}`,'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.message||d.error||'Ошибка API');return d}async function init(){const {data:admin,error}=await supabase.rpc('has_role',{required_role:'ADMIN'});if(error)throw error;if(!admin){location.replace('./pos.html');return}await load()}async function load(){const d=await api('/api/v1/operators');operators=d.operators||[];render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}function render(){const q=$('search').value.trim().toLowerCase(),rows=operators.filter(x=>`${x.full_name} ${x.email}`.toLowerCase().includes(q));$('count').textContent=`${operators.length} операторов`;$('cards').innerHTML=rows.map(x=>`<div class="operator"><div class="person"><div class="avatar">${esc(initials(x.full_name))}</div><div><div class="name">${esc(x.full_name)}</div><div class="email">${esc(x.email)}</div></div></div><div class="op-actions"><span class="badge ${x.is_active?'on':'off'}">${x.is_active?'Активен':'Отключён'}</span><button class="small" data-pass="${x.id}">Пароль</button><button class="small" data-toggle="${x.id}">${x.is_active?'Отключить':'Включить'}</button></div></div>`).join('')||'<div class="empty">Операторов пока нет</div>';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));document.querySelectorAll('[data-pass]').forEach(b=>b.onclick=()=>openPassword(b.dataset.pass))}async function toggle(id){const x=operators.find(o=>o.id===id);if(!x)return;try{await api('/api/v1/operators/'+id,{method:'PATCH',body:JSON.stringify({is_active:!x.is_active})});await load()}catch(e){note(e.message,'error')}}function openPassword(id){selected=operators.find(o=>o.id===id);if(!selected)return;$('modalName').textContent=selected.full_name;$('newPassword').value='';$('modal').classList.add('show');$('newPassword').focus()}$('cancelModal').onclick=()=>$('modal').classList.remove('show');$('savePassword').onclick=async()=>{const p=$('newPassword').value;if(p.length<6)return alert('Минимум 6 символов');try{await api('/api/v1/operators/'+selected.id,{method:'PATCH',body:JSON.stringify({password:p})});$('modal').classList.remove('show');note('Пароль обновлён','ok')}catch(e){alert(e.message)}};$('createForm').onsubmit=async e=>{e.preventDefault();$('createBtn').disabled=true;try{await api('/api/v1/operators',{method:'POST',body:JSON.stringify({full_name:$('fullName').value.trim(),email:$('email').value.trim(),password:$('password').value})});$('createForm').reset();note('Оператор создан. Теперь он может войти в кассу своим логином и паролем.','ok');await load()}catch(err){note(err.message,'error')}finally{$('createBtn').disabled=false}};$('search').oninput=render;init().catch(e=>note(e.message,'error'));</script></body></html>
