<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статус регистрации — A4PRINT HUB</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:30px;box-shadow:0 18px 50px rgba(15,23,42,.08)}.brand{display:flex;gap:12px;align-items:center;font-weight:900;margin-bottom:22px}.mark{width:46px;height:46px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center}.muted{color:#64748b}.state{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;margin:18px 0}.state.pending{background:#fff7ed;color:#9a3412}.state.rejected{background:#fff1f2;color:#9f1239}.state .icon{font-size:26px}.info{display:grid;gap:8px;background:#f8fafc;padding:14px;border-radius:14px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}.btn.secondary{background:#fff;color:#334155;border:1px solid #dbe2ea}.error{display:none;margin-top:12px;color:#b91c1c}</style></head><body><div class="card"><div class="brand"><div class="mark">A4</div><div>A4PRINT HUB<br><small class="muted">Статус сотрудника</small></div></div><div id="content"><p class="muted">Проверяем статус…</p></div><div class="btns"><button class="btn secondary" id="refresh">Обновить статус</button><button class="btn" id="resubmit" style="display:none">Подать повторно</button><button class="btn secondary" id="logout">Выйти</button></div><div id="error" class="error"></div></div><script src="./config.js"></script><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.A4PRINT_CONFIG||{},supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let profile=null;async function load(){const{data:{session}}=await supabase.auth.getSession();if(!session)return location.replace('./login.html');const{data,error}=await supabase.rpc('get_my_staff_profile');if(error)throw error;profile=data;if(data.status==='ACTIVE')return location.replace('./profile.html');if(data.status==='UNREGISTERED')return location.replace('./register.html');const r=data.request||{};const rejected=data.status==='REJECTED';$('content').innerHTML=`<h1>${rejected?'Заявка отклонена':'Заявка отправлена'}</h1><div class="state ${rejected?'rejected':'pending'}"><div class="icon">${rejected?'✕':'⏳'}</div><div><b>${rejected?'Администратор отклонил заявку':'Ожидается подтверждение администратора'}</b><div style="margin-top:5px">${rejected?esc(r.rejection_reason||'Причина не указана'):'После одобрения вам назначат роли и откроется личный кабинет.'}</div></div></div><div class="info"><div class="row"><span>ФИО</span><b>${esc(r.full_name||'—')}</b></div><div class="row"><span>Email</span><b>${esc(r.email||'—')}</b></div><div class="row"><span>Телефон</span><b>${esc(r.phone||'—')}</b></div><div class="row"><span>Способ входа</span><b>${esc(data.provider||r.provider||'email')}</b></div></div>`;$('resubmit').style.display=rejected?'inline-block':'none'}$('refresh').onclick=()=>load().catch(showErr);$('resubmit').onclick=async()=>{try{const r=profile?.request||{};const{error}=await supabase.rpc('submit_staff_registration',{p_full_name:r.full_name||null,p_phone:r.phone||null,p_provider:profile?.provider||r.provider||null});if(error)throw error;await load()}catch(e){showErr(e)}};$('logout').onclick=async()=>{await supabase.auth.signOut();location.replace('./login.html')};function showErr(e){$('error').textContent=e?.message||'Ошибка';$('error').style.display='block'}load().catch(showErr);</script></body></html>
