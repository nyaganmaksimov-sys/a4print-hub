<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сотрудники — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script><style>
:root{--line:#e5e7eb;--muted:#64748b;--blue:#2563eb;--bg:#f8fafc}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.page-head h1{margin:0}.page-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#fff;color:#334155;border:1px solid #dbe2ea}.btn.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca}.btn:disabled{opacity:.55;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:28px;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-weight:800;cursor:pointer;color:#475569}.tab.active{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:#fee2e2;color:#991b1b;font-size:11px;padding:0 6px;margin-left:5px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.search{width:min(420px,100%);padding:10px 12px;border:1px solid #dbe2ea;border-radius:10px;font:inherit}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 10px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top}.table th{font-size:12px;color:var(--muted);font-weight:800}.person{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:12px;background:#eff6ff;color:#1d4ed8;display:grid;place-items:center;font-weight:900;flex:0 0 auto}.muted{color:var(--muted);font-size:13px}.roles{display:flex;gap:6px;flex-wrap:wrap}.role{font-size:11px;padding:4px 7px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:800}.status{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;display:inline-block}.status.on{background:#dcfce7;color:#166534}.status.off{background:#fee2e2;color:#991b1b}.requests{display:grid;gap:10px}.request{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.request-title{font-weight:900}.request-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:12px}.request-actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:28px;text-align:center;color:#94a3b8}.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;place-items:center;padding:20px;z-index:80}.modal.open{display:grid}.box{width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:18px;padding:22px}.box h2{margin-top:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea{padding:11px 12px;border:1px solid #dbe2ea;border-radius:10px;font:inherit}.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.rolecheck{border:1px solid var(--line);border-radius:11px;padding:10px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}.rolecheck:hover{background:#f8fbff;border-color:#93c5fd}.rolecheck input{width:18px;height:18px;margin-top:2px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.error{color:#b91c1c;font-size:13px;margin-top:8px}.section{display:none}.section.active{display:block}@media(max-width:800px){.stats{grid-template-columns:1fr}.page-head,.toolbar{flex-direction:column;align-items:stretch}.request{grid-template-columns:1fr}.grid2,.rolegrid{grid-template-columns:1fr}.page-actions .btn{flex:1}}
</style></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">A4</span><div>A4PRINT<br><small>HUB</small></div></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>Сотрудники</h1><p>Команда, роли доступа и заявки на регистрацию</p></div><div class="user"><span id="adminEmail"></span></div></header><div class="page-head"><div></div><div class="page-actions"><button id="refresh" class="btn secondary">Обновить</button><button id="newEmployee" class="btn">+ Добавить сотрудника</button></div></div><section class="stats"><article class="stat"><span>Активные сотрудники</span><strong id="activeCount">0</strong></article><article class="stat"><span>Отключённые</span><strong id="disabledCount">0</strong></article><article class="stat"><span>Новые заявки</span><strong id="pendingCount">0</strong></article></section><section class="panel"><div class="tabs"><button class="tab active" data-tab="employees">Сотрудники</button><button class="tab" data-tab="requests">Заявки <span id="requestBadge" class="badge" style="display:none">0</span></button></div><div id="employeesSection" class="section active"><div class="toolbar"><input id="search" class="search" placeholder="Поиск по имени, email, телефону или роли"><span class="muted">Права меняются только администратором</span></div><div id="employeeList" class="empty">Загрузка…</div></div><div id="requestsSection" class="section"><div id="requestList" class="empty">Загрузка…</div></div></section></main>
<div id="employeeModal" class="modal"><form id="employeeForm" class="box"><h2 id="employeeModalTitle">Новый сотрудник</h2><input id="employeeId" type="hidden"><div class="grid2"><label class="field">ФИО<input id="fullName" required></label><label class="field">Телефон<input id="phone"></label></div><label class="field">Email<input id="email" type="email" required></label><label class="field">Пароль<input id="password" type="password" minlength="6" placeholder="Минимум 6 символов"></label><div class="field"><b>Роли и права</b><div id="employeeRoles" class="rolegrid"></div></div><label id="activeWrap" class="field" style="display:none"><span><input id="active" type="checkbox" checked> Сотрудник активен</span></label><div id="employeeError" class="error"></div><div class="modal-actions"><button type="button" id="employeeCancel" class="btn secondary">Отмена</button><button id="employeeSave" class="btn">Сохранить</button></div></form></div>
<div id="approveModal" class="modal"><form id="approveForm" class="box"><h2>Одобрить сотрудника</h2><input id="requestId" type="hidden"><div id="approvePerson" class="muted"></div><div class="field"><b>Назначьте роли</b><div id="approveRoles" class="rolegrid"></div></div><div id="approveError" class="error"></div><div class="modal-actions"><button type="button" id="approveCancel" class="btn secondary">Отмена</button><button id="approveSave" class="btn">Одобрить и открыть доступ</button></div></form></div>
<script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.A4PRINT_CONFIG||{},supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id);let session=null,roles=[],employees=[],requests=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const initials=n=>(String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?');const providerLabel=p=>{p=String(p||'email').toLowerCase();if(p.includes('google'))return'Google';if(p.includes('yandex'))return'Яндекс';if(p.includes('mail'))return'Mail.ru';return'Email'};function fmt(v){return v?new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}async function api(path,opt={}){const r=await fetch(cfg.apiBaseUrl+path,{...opt,headers:{Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||'Ошибка API');return d}function drawRoles(el,selected=[]){const set=new Set(selected);el.innerHTML=roles.map(r=>`<label class="rolecheck"><input type="checkbox" value="${esc(r.id)}" ${set.has(r.id)?'checked':''}><span><b>${esc(r.name)}</b><div class="muted">${esc(r.description||'')}</div></span></label>`).join('')||'<div class="muted">Роли не найдены</div>'}function selectedRoles(el){return[...el.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value)}async function load(){const[r,u,q]=await Promise.all([api('/api/v1/users/roles'),api('/api/v1/users'),supabase.from('staff_registration_requests').select('id,full_name,email,phone,provider,status,rejection_reason,requested_at,reviewed_at').order('requested_at',{ascending:false})]);if(q.error)throw q.error;roles=Array.isArray(r.roles)?r.roles:[];employees=Array.isArray(u.users)?u.users:[];requests=q.data||[];renderAll()}function renderAll(){const pending=requests.filter(x=>x.status==='PENDING');$('activeCount').textContent=employees.filter(x=>x.is_active).length;$('disabledCount').textContent=employees.filter(x=>!x.is_active).length;$('pendingCount').textContent=pending.length;$('requestBadge').textContent=pending.length;$('requestBadge').style.display=pending.length?'inline-grid':'none';renderEmployees();renderRequests()}function renderEmployees(){const q=$('search').value.trim().toLowerCase();const list=employees.filter(u=>`${u.full_name||''} ${u.email||''} ${u.phone||''} ${(u.roles||[]).map(r=>r.name).join(' ')}`.toLowerCase().includes(q));if(!list.length){$('employeeList').className='empty';$('employeeList').innerHTML='Сотрудники не найдены';return}$('employeeList').className='table-wrap';$('employeeList').innerHTML=`<table class="table"><thead><tr><th>Сотрудник</th><th>Роли</th><th>Статус</th><th>Создан</th><th></th></tr></thead><tbody>${list.map(u=>`<tr><td><div class="person"><div class="avatar">${esc(initials(u.full_name))}</div><div><b>${esc(u.full_name)}</b><div class="muted">${esc(u.email||'')}</div><div class="muted">${esc(u.phone||'')}</div></div></div></td><td><div class="roles">${(u.roles||[]).map(r=>`<span class="role">${esc(r.name)}</span>`).join('')||'<span class="muted">Нет ролей</span>'}</div></td><td><span class="status ${u.is_active?'on':'off'}">${u.is_active?'Активен':'Отключён'}</span></td><td class="muted">${fmt(u.created_at)}</td><td><button class="btn secondary" data-edit="${u.id}">Настроить</button></td></tr>`).join('')}</tbody></table>`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit))}function renderRequests(){const pending=requests.filter(x=>x.status==='PENDING');if(!pending.length){$('requestList').className='empty';$('requestList').innerHTML='Новых заявок пока нет';return}$('requestList').className='requests';$('requestList').innerHTML=pending.map(r=>`<article class="request"><div><div class="request-title">${esc(r.full_name)}</div><div class="request-meta"><span>${esc(r.email||'Email не указан')}</span>${r.phone?`<span>· ${esc(r.phone)}</span>`:''}<span>· ${providerLabel(r.provider)}</span><span>· ${fmt(r.requested_at)}</span></div></div><div class="request-actions"><button class="btn" data-approve="${r.id}">Одобрить</button><button class="btn danger" data-reject="${r.id}">Отклонить</button></div></article>`).join('');document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>openApprove(b.dataset.approve));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>rejectRequest(b.dataset.reject))}function openNew(){if(!roles.length)return alert('Роли доступа ещё не загрузились.');$('employeeForm').reset();$('employeeError').textContent='';$('employeeId').value='';$('employeeModalTitle').textContent='Новый сотрудник';$('email').disabled=false;$('password').required=true;$('password').placeholder='Минимум 6 символов';$('activeWrap').style.display='none';drawRoles($('employeeRoles'));$('employeeModal').classList.add('open')}function openEdit(id){const u=employees.find(x=>x.id===id);if(!u)return;$('employeeForm').reset();$('employeeError').textContent='';$('employeeId').value=u.id;$('employeeModalTitle').textContent='Настройки сотрудника';$('fullName').value=u.full_name||'';$('phone').value=u.phone||'';$('email').value=u.email||'';$('email').disabled=true;$('password').required=false;$('password').placeholder='Оставьте пустым, чтобы не менять';$('active').checked=u.is_active!==false;$('activeWrap').style.display='block';drawRoles($('employeeRoles'),(u.roles||[]).map(r=>r.id));$('employeeModal').classList.add('open')}function openApprove(id){const r=requests.find(x=>x.id===id);if(!r)return;$('requestId').value=id;$('approveError').textContent='';$('approvePerson').innerHTML=`<b>${esc(r.full_name)}</b><br>${esc(r.email||'')} · ${providerLabel(r.provider)}`;drawRoles($('approveRoles'));$('approveModal').classList.add('open')}async function rejectRequest(id){const r=requests.find(x=>x.id===id);if(!r)return;const reason=prompt(`Причина отклонения заявки «${r.full_name}» (необязательно):`);if(reason===null)return;try{const{error}=await supabase.rpc('reject_staff_registration',{p_request_id:id,p_reason:reason||null});if(error)throw error;await load()}catch(e){alert(e.message||'Не удалось отклонить заявку.')}}$('employeeForm').onsubmit=async e=>{e.preventDefault();const id=$('employeeId').value,role_ids=selectedRoles($('employeeRoles'));$('employeeError').textContent='';if(!role_ids.length)return $('employeeError').textContent='Выберите хотя бы одну роль.';const body={full_name:$('fullName').value.trim(),phone:$('phone').value.trim(),role_ids};if(!id){body.email=$('email').value.trim();body.password=$('password').value}else{body.is_active=$('active').checked;if($('password').value)body.password=$('password').value}try{$('employeeSave').disabled=true;await api(id?'/api/v1/users/'+id:'/api/v1/users',{method:id?'PATCH':'POST',body:JSON.stringify(body)});$('employeeModal').classList.remove('open');await load()}catch(err){$('employeeError').textContent=err.message}finally{$('employeeSave').disabled=false}};$('approveForm').onsubmit=async e=>{e.preventDefault();const role_ids=selectedRoles($('approveRoles'));$('approveError').textContent='';if(!role_ids.length)return $('approveError').textContent='Назначьте хотя бы одну роль.';try{$('approveSave').disabled=true;const{error}=await supabase.rpc('approve_staff_registration',{p_request_id:$('requestId').value,p_role_ids:role_ids});if(error)throw error;$('approveModal').classList.remove('open');await load();document.querySelector('[data-tab="employees"]').click()}catch(err){$('approveError').textContent=err.message||'Не удалось одобрить заявку.'}finally{$('approveSave').disabled=false}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('employeesSection').classList.toggle('active',b.dataset.tab==='employees');$('requestsSection').classList.toggle('active',b.dataset.tab==='requests')});$('search').oninput=renderEmployees;$('newEmployee').onclick=openNew;$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('employeeCancel').onclick=()=>$('employeeModal').classList.remove('open');$('approveCancel').onclick=()=>$('approveModal').classList.remove('open');[$('employeeModal'),$('approveModal')].forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});async function init(){const s=await supabase.auth.getSession();session=s.data.session;if(!session)return location.replace('./login.html');$('adminEmail').textContent=session.user.email||'';const{data:isAdmin,error}=await supabase.rpc('has_role',{required_role:'ADMIN'});if(error||!isAdmin){alert('Раздел доступен только администратору.');return location.replace('./index.html')}await load()}init().catch(e=>{$('employeeList').className='empty';$('employeeList').innerHTML=`<span style="color:#b91c1c">${esc(e.message)}</span>`});</script></body></html>
