<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Сотрудники — A4PRINT HUB</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js?v=20260904-6"></script>
  <style>
    :root{--line:#e5e7eb;--muted:#64748b;--blue:#2563eb}.head-actions,.page-actions,.request-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#fff;color:#334155;border:1px solid #dbe2ea}.btn.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca}.btn:disabled{opacity:.55;cursor:not-allowed}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.page-actions{justify-content:flex-end;margin-bottom:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer;color:#475569}.tab.active{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:#fee2e2;color:#991b1b;font-size:11px;padding:0 6px;margin-left:5px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.search{width:min(470px,100%);padding:11px 13px;border:1px solid #dbe2ea;border-radius:11px;font:inherit}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:12px 10px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top}.table th{font-size:12px;color:var(--muted)}.person{display:flex;gap:10px;align-items:center}.avatar{width:40px;height:40px;border-radius:12px;background:#eff6ff;color:#1d4ed8;display:grid;place-items:center;font-weight:900;flex:0 0 auto}.person small,.table td small,.request small,#approvePerson small,.rolecheck small,.errorbox small{display:block;color:var(--muted);margin-top:3px}.roles{display:flex;gap:6px;flex-wrap:wrap}.role{font-size:11px;padding:4px 7px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:800}.status{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;display:inline-block}.status.on{background:#dcfce7;color:#166534}.status.off{background:#fee2e2;color:#991b1b}.section{display:none}.section.active{display:block}.requests{display:grid;gap:10px}.request{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;place-items:center;padding:20px;z-index:100}.modal.open{display:grid}.box{width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 24px 70px rgba(15,23,42,.25)}.box h2{margin-top:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{padding:11px 12px;border:1px solid #dbe2ea;border-radius:10px;font:inherit;background:#fff}.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.rolecheck{border:1px solid var(--line);border-radius:11px;padding:10px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}.rolecheck input{width:18px;height:18px;margin-top:2px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.error{color:#b91c1c;font-size:13px;margin-top:8px}.errorbox{color:#b91c1c;display:grid;gap:8px;justify-items:center}.empty{padding:28px;text-align:center;color:#94a3b8}.panel{min-height:250px}@media(max-width:800px){.stats{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.request{grid-template-columns:1fr}.grid2,.rolegrid{grid-template-columns:1fr}.page-actions .btn{flex:1}}
  </style>
</head>
<body>
  <aside class="sidebar"><div class="brand"></div><nav></nav></aside>
  <main class="main">
    <header class="topbar">
      <div><h1>Сотрудники</h1><p>Команда, права доступа и заявки на регистрацию</p></div>
      <div class="user"><span id="adminEmail"></span></div>
    </header>
    <div class="page-actions">
      <a class="btn secondary" href="./staff-structure.html">Отделы и должности</a>
      <button id="refresh" class="btn secondary">Обновить</button>
      <button id="newEmployee" class="btn">+ Добавить сотрудника</button>
    </div>
    <section class="stats">
      <article><span>Активные сотрудники</span><strong id="activeCount">0</strong></article>
      <article><span>Отключённые</span><strong id="disabledCount">0</strong></article>
      <article><span>Новые заявки</span><strong id="pendingCount">0</strong></article>
    </section>
    <section class="panel">
      <div class="tabs">
        <button class="tab active" data-tab="employees">Сотрудники</button>
        <button class="tab" data-tab="requests">Заявки <span id="requestBadge" class="badge" style="display:none">0</span></button>
      </div>
      <div id="employeesSection" class="section active">
        <div class="toolbar"><input id="search" class="search" placeholder="Поиск по имени, email, телефону, отделу или роли"><span class="muted">Изменения доступны только администратору</span></div>
        <div id="employeeList" class="empty">Загрузка…</div>
      </div>
      <div id="requestsSection" class="section"><div id="requestList" class="empty">Загрузка…</div></div>
    </section>
  </main>

  <div id="employeeModal" class="modal"><form id="employeeForm" class="box">
    <h2 id="employeeModalTitle">Новый сотрудник</h2><input id="employeeId" type="hidden">
    <div class="grid2"><label class="field">ФИО<input id="fullName" required></label><label class="field">Телефон<input id="phone"></label></div>
    <div class="grid2"><label class="field">Email<input id="email" type="email" required></label><label class="field">Пароль<input id="password" type="password" minlength="6" placeholder="Для нового — минимум 6 символов"></label></div>
    <div class="grid2"><label class="field">Отдел<select id="employeeDepartment" required></select></label><label class="field">Должность<select id="employeePosition" required></select></label></div>
    <div class="field"><b>Роли и права</b><div id="employeeRoles" class="rolegrid"></div></div>
    <label id="activeWrap" class="field" style="display:none"><span><input id="active" type="checkbox" checked> Сотрудник активен</span></label>
    <div id="employeeError" class="error"></div><div class="modal-actions"><button type="button" id="employeeCancel" class="btn secondary">Отмена</button><button id="employeeSave" class="btn">Сохранить</button></div>
  </form></div>

  <div id="approveModal" class="modal"><form id="approveForm" class="box">
    <h2>Одобрить сотрудника</h2><input id="requestId" type="hidden"><div id="approvePerson"></div>
    <div class="grid2"><label class="field">Отдел<select id="approveDepartment" required></select></label><label class="field">Должность<select id="approvePosition" required></select></label></div>
    <div class="field"><b>Роли и права</b><div id="approveRoles" class="rolegrid"></div></div>
    <div id="approveError" class="error"></div><div class="modal-actions"><button type="button" id="approveCancel" class="btn secondary">Отмена</button><button id="approveSave" class="btn">Одобрить и открыть доступ</button></div>
  </form></div>

  <script type="module" src="./employees.js?v=20260904-1"></script>
</body>
</html>
