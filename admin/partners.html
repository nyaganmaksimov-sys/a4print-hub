<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Партнёры — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css?v=20260922-partners1"><link rel="stylesheet" href="./human-light-ui.css?v=20260922-3"><script src="./config.js?v=20260922-partners1"></script><style>.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:#fff;border:1px solid #e6ebf2;border-radius:18px;padding:18px}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{flex:1;padding:11px 12px;border:1px solid #dbe1ea;border-radius:10px}.partner{padding:14px 0;border-bottom:1px solid #eef2f7}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.meta,.small{color:#64748b;font-size:12px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:11px;font-weight:800}.badge.off{background:#fef2f2;color:#991b1b}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:grid;gap:5px;font-size:12px;color:#475569}.form .full{grid-column:1/-1}.form input,.form textarea,.form select{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid #dbe1ea;border-radius:9px;font:inherit}.form textarea{min-height:80px}.service{display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eef2f7}.service input{width:100%;padding:8px;border:1px solid #dbe1ea;border-radius:8px}.status-ok{color:#166534;font-weight:700}.status-error{color:#b91c1c;font-weight:700}.empty{padding:24px;text-align:center;color:#94a3b8}.block-column{min-height:120px}.block-column>.card{margin-top:18px}.block-column>.card:first-child{margin-top:0}.card.dragging{opacity:.45;outline:2px dashed #2563eb}.card.drag-over{outline:2px solid #93c5fd}.drag-handle{float:right;margin:-4px 0 10px 12px;padding:6px 9px;border:1px solid #dbe1ea;border-radius:8px;background:#f8fafc;color:#64748b;font-size:12px;font-weight:700;cursor:grab;user-select:none}.drag-handle:active{cursor:grabbing}.layout-tools{display:flex;gap:8px;align-items:center}.layout-tools button{white-space:nowrap}@media(max-width:960px){.grid{grid-template-columns:1fr}}@media(max-width:650px){.form,.service{grid-template-columns:1fr}.form .full{grid-column:auto}.sidebar{display:none}.main{margin-left:0!important}.layout-tools{flex-wrap:wrap}}</style></head><body><aside class="sidebar"><div class="brand"></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>🤝 Партнёры</h1><p>Партнёры могут размещать заказы у нас, а A4PRINT — заказывать услуги у них по их прайсу</p></div><div class="layout-tools"><button id="resetLayout" type="button">Сбросить блоки</button><button id="refresh">Обновить</button></div></header><section class="grid"><div><article class="card"><div class="row"><h2 style="margin:0">База партнёров</h2><span id="count" class="small"></span></div><div class="toolbar"><input id="search" placeholder="Название, контакт, телефон, email…"></div><div id="partners"><div class="empty">Загрузка…</div></div></article><article class="card"><h2 style="margin:0">Наш каталог для партнёров</h2><div class="small">То, что партнёры могут заказывать у A4PRINT</div><div id="services"><div class="empty">Загрузка…</div></div></article></div><div><article class="card"><h2 style="margin-top:0">Добавить партнёра</h2><form id="partnerForm" class="form"><label class="full">Компания<input name="name" required></label><label>Контактное лицо<input name="contact_name"></label><label>Телефон<input name="phone"></label><label>Email для входа<input name="email" type="email"></label><label>Пароль для входа<input name="password" type="password" minlength="6"></label><label>Скидка, %<input name="discount_percent" type="number" min="0" max="100" value="0"></label><label>Отсрочка, дней<input name="payment_terms_days" type="number" min="0" value="0"></label><label class="full">Примечание<textarea name="notes"></textarea></label><div class="full"><button type="submit">Создать партнёра и доступ</button></div></form><div id="formStatus" class="small" style="margin-top:10px"></div></article><article class="card"><h2 style="margin-top:0">Заказать у партнёра</h2><form id="outboundForm" class="form"><label class="full">Партнёр<select id="outPartner" required><option value="">Выберите партнёра</option></select></label><label class="full">Услуга по прайсу партнёра<select id="outService" required><option value="">Сначала выберите партнёра</option></select></label><label>Количество<input id="outQty" type="number" min="0.001" step="0.001" value="1" required></label><label>Итого по прайсу<input id="outTotal" readonly value="0 ₽"></label><label class="full">Параметры заказа<textarea id="outParams" placeholder="Формат, материал, тираж, сроки, требования..."></textarea></label><label class="full">Комментарий партнёру<textarea id="outComment"></textarea></label><label class="full">Макеты / файлы<input id="outFiles" type="file" multiple></label><div class="full"><button type="submit" id="outSend">Отправить заказ партнёру</button></div></form><div id="outStatus" class="small" style="margin-top:10px"></div><div id="partnerPrice" class="small" style="margin-top:12px"></div></article></div></section></main><script type="module" src="./partners-core.js?v=20260922-phase5-1"></script></body></html>
