<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Партнёры — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script><style>.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:#fff;border:1px solid #e6ebf2;border-radius:18px;padding:18px}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{flex:1;padding:11px 12px;border:1px solid #dbe1ea;border-radius:10px}.partner{padding:14px 0;border-bottom:1px solid #eef2f7}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.meta,.small{color:#64748b;font-size:12px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:11px;font-weight:800}.badge.off{background:#fef2f2;color:#991b1b}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:grid;gap:5px;font-size:12px;color:#475569}.form .full{grid-column:1/-1}.form input,.form textarea,.form select{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid #dbe1ea;border-radius:9px;font:inherit}.form textarea{min-height:80px}.service{display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eef2f7}.service input{width:100%;padding:8px;border:1px solid #dbe1ea;border-radius:8px}.status-ok{color:#166534;font-weight:700}.status-error{color:#b91c1c;font-weight:700}.empty{padding:24px;text-align:center;color:#94a3b8}@media(max-width:960px){.grid{grid-template-columns:1fr}}@media(max-width:650px){.form,.service{grid-template-columns:1fr}.form .full{grid-column:auto}.sidebar{display:none}.main{margin-left:0!important}}</style></head><body><aside class="sidebar"><div class="brand"></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>🤝 Партнёры</h1><p>Партнёры могут размещать заказы у нас, а A4PRINT — заказывать услуги у них по их прайсу</p></div><button id="refresh">Обновить</button></header><section class="grid"><div><article class="card"><div class="row"><h2 style="margin:0">База партнёров</h2><span id="count" class="small"></span></div><div class="toolbar"><input id="search" placeholder="Название, контакт, телефон, email…"></div><div id="partners"><div class="empty">Загрузка…</div></div></article><article class="card" style="margin-top:18px"><h2 style="margin:0">Наш каталог для партнёров</h2><div class="small">То, что партнёры могут заказывать у A4PRINT</div><div id="services"><div class="empty">Загрузка…</div></div></article></div><div><article class="card"><h2 style="margin-top:0">Добавить партнёра</h2><form id="partnerForm" class="form"><label class="full">Компания<input name="name" required></label><label>Контактное лицо<input name="contact_name"></label><label>Телефон<input name="phone"></label><label>Email для входа<input name="email" type="email"></label><label>Пароль для входа<input name="password" type="password" minlength="6"></label><label>Скидка, %<input name="discount_percent" type="number" min="0" max="100" value="0"></label><label>Отсрочка, дней<input name="payment_terms_days" type="number" min="0" value="0"></label><label class="full">Примечание<textarea name="notes"></textarea></label><div class="full"><button type="submit">Создать партнёра и доступ</button></div></form><div id="formStatus" class="small" style="margin-top:10px"></div></article><article class="card" style="margin-top:18px"><h2 style="margin-top:0">Заказать у партнёра</h2><form id="outboundForm" class="form"><label class="full">Партнёр<select id="outPartner" required><option value="">Выберите партнёра</option></select></label><label class="full">Услуга по прайсу партнёра<select id="outService" required><option value="">Сначала выберите партнёра</option></select></label><label>Количество<input id="outQty" type="number" min="0.001" step="0.001" value="1" required></label><label>Итого по прайсу<input id="outTotal" readonly value="0 ₽"></label><label class="full">Параметры заказа<textarea id="outParams" placeholder="Формат, материал, тираж, сроки, требования..."></textarea></label><label class="full">Комментарий партнёру<textarea id="outComment"></textarea></label><label class="full">Макеты / файлы<input id="outFiles" type="file" multiple></label><div class="full"><button type="submit" id="outSend">Отправить заказ партнёру</button></div></form><div id="outStatus" class="small" style="margin-top:10px"></div><div id="partnerPrice" class="small" style="margin-top:12px"></div></article></div></section></main><script type="module">import{supabase}from'./guard.js';const cfg=window.A4PRINT_CONFIG||{},$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB'}).format(Number(v||0));let partners=[],supplierServices=[];async function token(){const{data:{session}}=await supabase.auth.getSession();return session?.access_token||''}async function api(path,opt={}){const t=await token();const r=await fetch(`${cfg.apiBaseUrl}${path}`,{...opt,headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`,...opt.headers}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error||`HTTP ${r.status}`);return j}async function access(){const[{data:a},{data:m}]=await Promise.all([supabase.rpc('has_role',{required_role:'ADMIN'}),supabase.rpc('has_role',{required_role:'MANAGER'})]);if(!a&&!m)throw new Error('Доступ только для администратора или менеджера')}async function loadPartners(){const j=await api('/api/v1/partners');partners=j.partners||[];renderPartners();$('outPartner').innerHTML='<option value="">Выберите партнёра</option>'+partners.filter(p=>p.is_active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}function renderPartners(){const q=$('search').value.trim().toLowerCase(),rows=partners.filter(p=>`${p.name} ${p.contact_name||''} ${p.email||''} ${p.phone||''}`.toLowerCase().includes(q));$('count').textContent=`${rows.length} партнёров`;$('partners').innerHTML=rows.map(p=>`<div class="partner"><div class="row"><div><b>${esc(p.name)}</b><div class="meta">${esc(p.contact_name||'Контакт не указан')} ${p.phone?'· '+esc(p.phone):''} ${p.email?'· '+esc(p.email):''}</div><div class="meta">Заказов: ${p.orders_count||0} · скидка ${Number(p.discount_percent||0)}% · отсрочка ${Number(p.payment_terms_days||0)} дн.</div></div><div><span class="badge ${p.is_active?'':'off'}">${p.is_active?'Активен':'Отключён'}</span><br><button data-order-partner="${p.id}" style="margin-top:7px">Заказать у него</button><br><button data-toggle="${p.id}" style="margin-top:7px">${p.is_active?'Отключить':'Включить'}</button></div></div></div>`).join('')||'<div class="empty">Партнёры не найдены</div>';document.querySelectorAll('[data-order-partner]').forEach(b=>b.onclick=()=>{$('outPartner').value=b.dataset.orderPartner;loadSupplierServices();$('outPartner').scrollIntoView({behavior:'smooth',block:'center'})});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const p=partners.find(x=>x.id===b.dataset.toggle);b.disabled=true;try{await api(`/api/v1/partners/${p.id}`,{method:'PATCH',body:JSON.stringify({is_active:!p.is_active})});await loadPartners()}catch(e){alert(e.message)}finally{b.disabled=false}})}async function loadServices(){const{data,error}=await supabase.from('partner_services').select('*').order('sort_order');if(error)throw error;$('services').innerHTML=(data||[]).map(s=>`<div class="service"><div><b>${esc(s.name)}</b><div class="small">${esc(s.category)} · ${esc(s.business_unit)}</div></div><label class="small">Розница, ₽<input data-field="base_price" data-id="${s.id}" type="number" min="0" value="${Number(s.base_price||0)}"></label><label class="small">Партнёр, ₽<input data-field="partner_price" data-id="${s.id}" type="number" min="0" value="${Number(s.partner_price||0)}"></label><button data-service-save="${s.id}">Сохранить</button></div>`).join('');document.querySelectorAll('[data-service-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.serviceSave,base=document.querySelector(`[data-id="${id}"][data-field="base_price"]`),partner=document.querySelector(`[data-id="${id}"][data-field="partner_price"]`);b.disabled=true;const{error}=await supabase.from('partner_services').update({base_price:Number(base.value)||0,partner_price:Number(partner.value)||0,updated_at:new Date().toISOString()}).eq('id',id);b.disabled=false;b.textContent=error?'Ошибка':'Сохранено ✓'})}async function loadSupplierServices(){const pid=$('outPartner').value;if(!pid){supplierServices=[];$('outService').innerHTML='<option value="">Сначала выберите партнёра</option>';return}const{data,error}=await supabase.from('partner_supplier_services').select('*').eq('partner_id',pid).eq('is_active',true).order('category').order('name');if(error){$('partnerPrice').textContent='Сначала выполните миграцию 013.';return}supplierServices=data||[];$('outService').innerHTML='<option value="">Выберите услугу</option>'+supplierServices.map(s=>`<option value="${s.id}">${esc(s.category)} — ${esc(s.name)} — ${money(s.price)}/${esc(s.unit)}</option>`).join('');$('partnerPrice').textContent=supplierServices.length?'Прайс партнёра загружен.':'У партнёра пока нет заполненного прайса.';calcOut()}function calcOut(){const s=supplierServices.find(x=>x.id===$('outService').value),q=Math.max(0,Number($('outQty').value)||0);$('outTotal').value=money(s?s.price*q:0)}async function uploadFiles(orderId,files){for(const file of files){const safe=file.name.replace(/[^a-zA-Zа-яА-Я0-9._-]+/g,'_'),path=`${orderId}/${crypto.randomUUID()}_${safe}`;const{error:uErr}=await supabase.storage.from('order-files').upload(path,file,{upsert:false,contentType:file.type||undefined});if(uErr)throw uErr;const{error:fErr}=await supabase.from('order_files').insert({order_id:orderId,file_name:file.name,file_url:path,mime_type:file.type||null});if(fErr)throw fErr}}function setStatus(id,msg,type=''){const e=$(id);e.textContent=msg;e.className=`small ${type==='ok'?'status-ok':type==='error'?'status-error':''}`}$('outPartner').onchange=loadSupplierServices;$('outService').onchange=calcOut;$('outQty').oninput=calcOut;$('outboundForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,pid=$('outPartner').value,sid=$('outService').value,qty=Number($('outQty').value)||1;if(!pid||!sid)return;setStatus('outStatus','Отправка…');$('outSend').disabled=true;try{const{data,error}=await supabase.rpc('create_hub_partner_order',{p_partner_id:pid,p_supplier_service_id:sid,p_quantity:qty,p_comment:$('outComment').value.trim()||null,p_parameters:{details:$('outParams').value.trim()}});if(error)throw error;const files=[...$('outFiles').files];if(files.length)await uploadFiles(data,files);setStatus('outStatus',`✓ Заказ создан и отправлен партнёру${files.length?`. Файлов: ${files.length}`:''}.`,'ok');form.reset();$('outQty').value=1;$('outTotal').value=money(0);supplierServices=[];$('outService').innerHTML='<option value="">Сначала выберите партнёра</option>'}catch(err){setStatus('outStatus','Ошибка: '+err.message,'error')}finally{$('outSend').disabled=false}};function setFormStatus(message,type=''){setStatus('formStatus',message,type)}$('partnerForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,body=Object.fromEntries(new FormData(form).entries()),button=form.querySelector('button[type="submit"]');setFormStatus('Создание…');button.disabled=true;try{await api('/api/v1/partners',{method:'POST',body:JSON.stringify(body)});form.reset();form.elements.discount_percent.value='0';form.elements.payment_terms_days.value='0';setFormStatus('✓ Партнёр создан. Данные для входа готовы.','ok');await loadPartners()}catch(err){setFormStatus('Ошибка: '+(/already been registered|already exists|duplicate/i.test(err.message)?'Пользователь с таким email уже существует. Укажите другой email партнёра.':err.message),'error')}finally{button.disabled=false}};$('search').oninput=renderPartners;$('refresh').onclick=()=>Promise.all([loadPartners(),loadServices()]);try{await access();await Promise.all([loadPartners(),loadServices()])}catch(e){document.querySelector('.main').innerHTML=`<div class="empty">${esc(e.message)}</div>`}</script></body></html>
