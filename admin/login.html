<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — A4PRINT HUB</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033}.card{width:min(440px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:32px;box-shadow:0 12px 40px rgba(15,23,42,.08)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;font-weight:800}.mark{width:44px;height:44px;border-radius:12px;background:#111827;color:#fff;display:grid;place-items:center}.muted{color:#64748b}.field{display:grid;gap:7px;margin:16px 0}.field input{width:100%;padding:13px;border:1px solid #dbe1ea;border-radius:10px;font:inherit}.button{width:100%;padding:13px;border:0;border-radius:10px;background:#111827;color:#fff;font:inherit;font-weight:700;cursor:pointer}.button:disabled{opacity:.6}.social{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#172033;border:1px solid #dbe1ea;margin-bottom:9px}.divider{display:flex;align-items:center;gap:12px;color:#94a3b8;font-size:12px;margin:12px 0}.divider:before,.divider:after{content:"";height:1px;background:#e5e7eb;flex:1}.error,.success{display:none;margin-top:14px;padding:11px;border-radius:9px;font-size:14px}.error{background:#fff1f2;color:#be123c}.success{background:#ecfdf5;color:#166534}.hint{margin-top:18px;text-align:center;font-size:12px;color:#94a3b8}.recover{margin-top:12px;text-align:center}.recover button{border:0;background:transparent;color:#2563eb;cursor:pointer;font:inherit;padding:6px}.recover-box{display:none;margin-top:16px;padding-top:16px;border-top:1px solid #eef2f7}.recover-box.open{display:block}.secondary{background:#fff;color:#172033;border:1px solid #dbe1ea;margin-top:8px}.register{margin-top:18px;padding-top:16px;border-top:1px solid #eef2f7;text-align:center;font-size:14px}.register a{color:#2563eb;text-decoration:none;font-weight:800}</style></head><body><div class="card"><div class="brand"><div class="mark">A4</div><div>A4PRINT HUB<br><small class="muted">Внутренняя система</small></div></div><h1>Вход</h1><p class="muted">А4-Принт · 3D-ARTPRINT</p><button class="button social" type="button" data-provider="google">🔵 Войти через Google</button><button class="button social" type="button" data-provider="custom:yandex">🟡 Войти через Яндекс</button><button class="button social" type="button" data-provider="custom:mailru">🔷 Войти через Mail.ru</button><div class="divider">или по email</div><form id="form"><label class="field">Email<input id="email" type="email" autocomplete="username" required></label><label class="field">Пароль<input id="password" type="password" autocomplete="current-password" required></label><button class="button" id="submit">Войти</button><div class="error" id="error"></div></form><div class="recover"><button type="button" id="showRecovery">Забыли пароль?</button></div><div id="recoveryBox" class="recover-box"><b>Восстановление пароля</b><p class="muted" style="font-size:13px">Укажите email учётной записи. Мы отправим ссылку для создания нового пароля.</p><label class="field">Email<input id="recoveryEmail" type="email" autocomplete="email"></label><button class="button" type="button" id="sendRecovery">Отправить ссылку</button><button class="button secondary" type="button" id="hideRecovery">Отмена</button><div class="error" id="recoveryError"></div><div class="success" id="recoverySuccess"></div></div><div class="register">Новый сотрудник? <a href="./register.html">Зарегистрироваться</a></div><div class="hint">Доступ к рабочим данным открывается после одобрения администратора</div></div><script src="./config.js?v=20260905-7"></script><script src="./mobile-auth-route.js?v=20260905-2"></script><script src="./login.js?v=20260905-authfix1"></script></body></html>
