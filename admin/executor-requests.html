<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявки исполнителей — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script><style>.request-grid{display:grid;gap:14px}.request-card{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:18px}.request-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{padding:12px;border-radius:12px;background:#f8fafc}.box b{display:block;margin-bottom:5px}.photo-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.photo-row img{width:180px;height:110px;border-radius:12px;object-fit:cover;border:1px solid #dbe3ee}.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{font-weight:800}.empty{padding:28px;text-align:center;color:#94a3b8}@media(max-width:800px){.cols{grid-template-columns:1fr}.request-head{flex-direction:column}}</style></head><body><aside class="sidebar"><div class="brand"></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>Заявки исполнителей</h1><p>Проверка компаний перед подключением к Partner CRM и Marketplace</p></div></header><section class="panel"><div class="panel-head"><h2>Запросы на регистрацию</h2><button id="reload">Обновить</button></div><div id="requests" class="request-grid"><div class="empty">Загрузка…</div></div></section></main><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function signed(path){if(!path)return null;const{data,error}=await supabase.storage.from('executor-registration-private').createSignedUrl(path,3600);return error?null:data.signedUrl}async function card(r){const file=await signed(r.verification_file_path);return`<article class="request-card"><div class="request-head"><div><h3 style="margin:0">${esc(r.company_name)}</h3><div class="meta"><span class="chip">${esc(r.company_type||'Тип не указан')}</span>${r.city?`<span class="chip">${esc(r.city)}</span>`:''}<span class="chip">${new Date(r.created_at).toLocaleString('ru-RU')}</span></div></div><div class="status">${esc(r.status)}</div></div><div class="cols"><div class="box"><b>Компания</b>${esc(r.legal_name||'—')}<br>ИНН: ${esc(r.inn||'—')} · КПП: ${esc(r.kpp||'—')}<br>ОГРН/ОГРНИП: ${esc(r.ogrn||'—')}<br>${esc(r.address||'')}</div><div class="box"><b>Контакт</b>${esc(r.contact_name)}<br>${r.phone?`<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a><br>`:''}<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>${r.website?`<br><a href="${esc(r.website)}" target="_blank">${esc(r.website)}</a>`:''}</div><div class="box"><b>Описание</b>${esc(r.description||'—')}</div><div class="box"><b>Услуги</b>${esc(r.services||'—')}<br><br><b>Оборудование</b>${esc(r.equipment||'—')}</div><div class="box"><b>Условия</b>Доставка: ${esc(r.delivery_info||'—')}<br>График: ${esc(r.working_hours||'—')}</div><div class="box"><b>Координаты</b>${r.latitude&&r.longitude?`${r.latitude}, ${r.longitude}`:'Не указаны'}${file?`<br><br><a class="btn" href="${esc(file)}" target="_blank">Проверочный документ</a>`:''}</div></div>${r.logo_url||r.cover_url?`<div class="photo-row">${r.logo_url?`<img src="${esc(r.logo_url)}" alt="Логотип">`:''}${r.cover_url?`<img src="${esc(r.cover_url)}" alt="Обложка">`:''}</div>`:''}<div class="admin-actions">${r.status!=='APPROVED'?`<button data-review="${r.id}">На проверке</button><button data-approve="${r.id}">Подтвердить и создать партнёра</button><button data-reject="${r.id}">Отклонить</button>`:`<span class="chip">Партнёр создан: ${esc(r.approved_partner_id||'')}</span>`}</div></article>`}async function load(){const{data,error}=await supabase.from('executor_registration_requests').select('*').order('created_at',{ascending:false});if(error){$('requests').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}const out=[];for(const r of(data||[]))out.push(await card(r));$('requests').innerHTML=out.join('')||'<div class="empty">Заявок пока нет</div>';document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>setStatus(b.dataset.review,'REVIEW'));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{const comment=prompt('Причина отклонения (необязательно):')||null;const{error}=await supabase.from('executor_registration_requests').update({status:'REJECTED',admin_comment:comment,updated_at:new Date().toISOString()}).eq('id',b.dataset.reject);if(error)alert(error.message);await load()});document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{if(!confirm('Подтвердить заявку и создать партнёра в системе?'))return;b.disabled=true;const{data,error}=await supabase.rpc('approve_executor_registration',{p_request_id:b.dataset.approve});if(error)alert(error.message);else alert('Партнёр создан: '+data);await load()})}async function setStatus(id,status){const{error}=await supabase.from('executor_registration_requests').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await load()}$('reload').onclick=load;await load();</script></body></html>
