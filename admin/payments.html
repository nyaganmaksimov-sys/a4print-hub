<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оплаты — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">A4</span><div>A4PRINT<br><small>HUB</small></div></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>💰 Оплаты</h1><p>Платежи по общей базе</p></div><button id="refresh">Обновить</button></header><section class="stats"><article><span>Всего операций</span><strong id="count">0</strong></article><article><span>Сумма</span><strong id="sum">0 ₽</strong></article></section><section class="panel"><div id="list"><div class="empty">Загрузка...</div></div></section></main><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id),rub=v=>Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';async function load(){const{data,error}=await supabase.from('payments').select('*').order('created_at',{ascending:false}).limit(200);if(error){$('list').innerHTML=`<div class="empty">Ошибка: ${error.message}</div>`;return}const rows=data||[];$('count').textContent=rows.length;$('sum').textContent=rub(rows.reduce((s,x)=>s+Number(x.amount||0),0));$('list').innerHTML=rows.map(x=>`<div style="display:grid;grid-template-columns:1fr auto;gap:15px;padding:14px 0;border-bottom:1px solid #e5e7eb"><div><b>${x.payment_method||x.method||'Оплата'}</b><div style="color:#64748b;font-size:13px;margin-top:5px">${new Date(x.created_at).toLocaleString('ru-RU')} ${x.description?'· '+x.description:''}</div></div><strong>${rub(x.amount)}</strong></div>`).join('')||'<div class="empty">Платежей пока нет</div>'}$('refresh').onclick=load;load();</script></body></html>
