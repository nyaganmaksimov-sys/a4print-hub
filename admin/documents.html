<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Документы — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script><style>.docs-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.docs-toolbar input,.docs-toolbar select{padding:11px;border:1px solid #e5e7eb;border-radius:9px}.docs-toolbar input{flex:1;min-width:220px}.doc-row{display:grid;grid-template-columns:150px 1fr 150px 150px;gap:14px;padding:14px 0;border-bottom:1px solid #e5e7eb;align-items:center}.doc-source{font-size:11px;padding:4px 7px;border-radius:999px;background:#eef2ff;color:#3730a3;width:max-content}.muted{color:#64748b;font-size:13px}@media(max-width:780px){.doc-row{grid-template-columns:1fr}.doc-row>*{min-width:0}}</style></head><body><aside class="sidebar"><div class="brand"></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>📁 Документы</h1><p>Договоры, счета, акты и документы клиентов</p></div><div><span id="userEmail"></span></div></header><section class="panel"><div class="docs-toolbar"><input id="search" placeholder="Поиск по номеру, названию или клиенту"><select id="status"><option value="">Все статусы</option><option>DRAFT</option><option>ISSUED</option><option>PAID</option><option>PENDING_APPROVAL</option><option>APPROVED</option><option>SIGNED</option><option>ACTIVE</option><option>ARCHIVED</option><option>CANCELLED</option></select><button id="refresh">Обновить</button></div><div id="documents"><div class="empty">Загрузка…</div></div></section></main><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const{data:{session}}=await supabase.auth.getSession();if(session)$('userEmail').textContent=session.user.email||'';let rows=[];async function load(){const [hub,client]=await Promise.all([supabase.from('documents').select('id,document_number,title,status,issue_date,created_at,metadata,customers(full_name,company_name)').order('created_at',{ascending:false}).limit(300),supabase.from('customer_documents').select('id,document_number,title,status,issue_date,created_at,amount,customer_id,customers(full_name,company_name)').order('created_at',{ascending:false}).limit(300)]);rows=[];if(!hub.error)rows.push(...(hub.data||[]).map(x=>({...x,source:'HUB',amount:x.metadata?.amount||0,customer:x.customers})));if(!client.error)rows.push(...(client.data||[]).map(x=>({...x,source:'Счёт клиента',customer:x.customers})));if(hub.error&&client.error){$('documents').innerHTML=`<div class="empty">Ошибка загрузки документов: ${esc(hub.error.message)} / ${esc(client.error.message)}</div>`;return}rows.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));render()}function render(){const q=$('search').value.trim().toLowerCase(),st=$('status').value;const list=rows.filter(x=>(!st||x.status===st)&&`${x.document_number||''} ${x.title||''} ${x.customer?.full_name||''} ${x.customer?.company_name||''}`.toLowerCase().includes(q));$('documents').innerHTML=list.map(x=>`<div class="doc-row"><div><b>${esc(x.document_number||'—')}</b><div class="doc-source">${esc(x.source)}</div></div><div><b>${esc(x.title||'Документ')}</b><div class="muted">${esc(x.customer?.company_name||x.customer?.full_name||'Клиент не указан')}${Number(x.amount||0)>0?' · '+Number(x.amount).toLocaleString('ru-RU')+' ₽':''}</div></div><span>${esc(x.status||'')}</span><span>${esc(x.issue_date||'')}</span></div>`).join('')||'<div class="empty">Документов нет</div>'}$('refresh').onclick=load;$('search').oninput=render;$('status').onchange=render;load();</script></body></html>
