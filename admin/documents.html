<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Документы — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script></head><body><main class="main" style="margin-left:0"><header class="topbar"><div><h1>Документы</h1><p>Договоры, счета, акты и другие документы</p></div><div><span id="userEmail" style="margin-right:12px"></span><a href="./index.html" style="text-decoration:none;color:inherit">← Главная</a></div></header><section class="panel"><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px"><input id="search" placeholder="Поиск по номеру или названию" style="flex:1;min-width:220px;padding:11px;border:1px solid #e5e7eb;border-radius:9px"><select id="status" style="padding:11px;border:1px solid #e5e7eb;border-radius:9px"><option value="">Все статусы</option><option>DRAFT</option><option>PENDING_APPROVAL</option><option>APPROVED</option><option>SIGNED</option><option>ACTIVE</option><option>EXPIRED</option><option>TERMINATED</option><option>ARCHIVED</option></select><button id="refresh">Обновить</button></div><div id="documents"><div class="empty">API ещё не подключён</div></div></section></main><script type="module">import {supabase} from './guard.js';const {data:{session}}=await supabase.auth.getSession();if(session)document.getElementById('userEmail').textContent=session.user.email||'';</script><script>const API_BASE=window.A4PRINT_API_URL||'';const $=id=>document.getElementById(id);async function load(){if(!API_BASE)return;const p=new URLSearchParams();if($('search').value)p.set('search',$('search').value);if($('status').value)p.set('status',$('status').value);try{const r=await fetch(`${API_BASE}/api/v1/documents?${p}`);if(!r.ok)throw Error();const d=await r.json();$('documents').innerHTML=(d.documents||[]).map(x=>`<div style="display:grid;grid-template-columns:120px 1fr 140px 160px;gap:14px;padding:14px 0;border-bottom:1px solid #e5e7eb"><b>${x.document_number||'—'}</b><span>${x.title}</span><span>${x.status}</span><span>${x.issue_date||''}</span></div>`).join('')||'<div class="empty">Документов нет</div>'}catch(e){$('documents').innerHTML='<div class="empty">Не удалось загрузить документы</div>'}}$('refresh').onclick=load;$('search').onkeydown=e=>{if(e.key==='Enter')load()};load();</script></body></html>
