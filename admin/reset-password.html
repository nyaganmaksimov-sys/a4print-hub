<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый пароль — A4PRINT HUB</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033}.card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:32px;box-shadow:0 12px 40px rgba(15,23,42,.08)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px;font-weight:800}.mark{width:44px;height:44px;border-radius:12px;background:#111827;color:#fff;display:grid;place-items:center}.muted{color:#64748b}.field{display:grid;gap:7px;margin:16px 0}.field input{width:100%;padding:13px;border:1px solid #dbe1ea;border-radius:10px;font:inherit}.button{width:100%;padding:13px;border:0;border-radius:10px;background:#111827;color:#fff;font:inherit;font-weight:700;cursor:pointer}.button:disabled{opacity:.6}.error,.success,.info{display:none;margin-top:14px;padding:11px;border-radius:9px;font-size:14px}.error{background:#fff1f2;color:#be123c}.success{background:#ecfdf5;color:#166534}.info{background:#eff6ff;color:#1d4ed8}.back{display:block;text-align:center;margin-top:16px;color:#2563eb;text-decoration:none}</style></head><body><div class="card"><div class="brand"><div class="mark">A4</div><div>A4PRINT HUB<br><small class="muted">Восстановление доступа</small></div></div><h1>Новый пароль</h1><p class="muted">Придумайте новый пароль для учётной записи.</p><div id="info" class="info">Проверяем ссылку восстановления…</div><form id="form" style="display:none"><label class="field">Новый пароль<input id="password" type="password" minlength="6" autocomplete="new-password" required></label><label class="field">Повторите пароль<input id="password2" type="password" minlength="6" autocomplete="new-password" required></label><button id="submit" class="button">Сохранить новый пароль</button></form><div id="error" class="error"></div><div id="success" class="success"></div><a class="back" href="./login.html">← Вернуться ко входу</a></div><script src="./config.js?v=20260905-7"></script><script src="./vendor/supabase.js?v=20260905-1"></script><script type="module">const createClient=window.supabase?.createClient;if(!createClient)throw new Error('Локальный модуль авторизации не загрузился. Обновите страницу.');const cfg=window.A4PRINT_CONFIG||{},supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);function show(id,text){$(id).textContent=text;$(id).style.display='block'}async function init(){show('info','Проверяем ссылку восстановления…');let session=(await supabase.auth.getSession()).data.session;if(!session){await new Promise(r=>setTimeout(r,500));session=(await supabase.auth.getSession()).data.session}if(!session){$('info').style.display='none';show('error','Ссылка восстановления недействительна или уже истекла. Запросите новую ссылку на странице входа.');return}$('info').style.display='none';$('form').style.display='block'}$('form').onsubmit=async e=>{e.preventDefault();$('error').style.display='none';$('success').style.display='none';const p=$('password').value,p2=$('password2').value;if(p!==p2)return show('error','Пароли не совпадают.');if(p.length<6)return show('error','Пароль должен содержать минимум 6 символов.');$('submit').disabled=true;$('submit').textContent='Сохраняем…';const{error}=await supabase.auth.updateUser({password:p});if(error){show('error',error.message);$('submit').disabled=false;$('submit').textContent='Сохранить новый пароль';return}show('success','Пароль изменён. Сейчас можно войти с новым паролем.');await supabase.auth.signOut();setTimeout(()=>location.replace('./login.html'),1400)};init().catch(e=>{$('info').style.display='none';show('error',e.message||'Не удалось открыть ссылку восстановления.')});</script></body></html>
