<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Производство — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">A4</span><div>A4PRINT<br><small>HUB</small></div></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>🏭 Производство</h1><p>Производственные задания</p></div><button id="refresh">Обновить</button></header><section class="stats"><article><span>Всего</span><strong id="all">0</strong></article><article><span>Новые</span><strong id="new">0</strong></article><article><span>В работе</span><strong id="work">0</strong></article><article><span>Готово</span><strong id="done">0</strong></article></section><section class="panel"><div id="list"><div class="empty">Загрузка...</div></div></section></main><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id);async function load(){const{data,error}=await supabase.from('production_jobs').select('id,title,status,priority,planned_start,planned_end,created_at,orders(order_number)').order('created_at',{ascending:false});if(error){$('list').innerHTML=`<div class="empty">Ошибка: ${error.message}</div>`;return}const rows=data||[];$('all').textContent=rows.length;$('new').textContent=rows.filter(x=>x.status==='NEW'||x.status==='QUEUED').length;$('work').textContent=rows.filter(x=>x.status==='IN_PROGRESS'||x.status==='PAUSED').length;$('done').textContent=rows.filter(x=>x.status==='DONE').length;$('list').innerHTML=rows.map(x=>`<div style="padding:14px 0;border-bottom:1px solid #e5e7eb"><b>${x.title}</b><div style="color:#64748b;font-size:13px;margin-top:5px">${x.orders?.order_number?'Заказ №'+x.orders.order_number+' · ':''}${x.status} · приоритет ${x.priority??0}</div></div>`).join('')||'<div class="empty">Производственных заданий пока нет</div>'}$('refresh').onclick=load;load();</script></body></html>
