<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Счёт — A4PRINT HUB</title>
  <script src="./config.js?v=20260908-invoice2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#111827;font-family:Arial,sans-serif}.toolbar{max-width:980px;margin:18px auto;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.toolbar a,.toolbar button{padding:10px 14px;border:0;border-radius:9px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.toolbar a.secondary{background:#475569}.toolbar a.payment{background:#15803d}.sheet{width:min(960px,calc(100% - 24px));margin:0 auto 30px;background:#fff;padding:42px 46px;box-shadow:0 10px 35px rgba(15,23,42,.12)}.title{font-size:27px;font-weight:900;border-bottom:2px solid #111827;padding-bottom:10px;margin-bottom:16px}.payment-state{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 13px;border:1px solid #fde68a;background:#fffbeb;border-radius:9px;margin-bottom:18px}.payment-state.paid{border-color:#bbf7d0;background:#f0fdf4}.payment-state b{font-size:13px}.payment-state.paid b{color:#166534}.payment-state span{font-size:12px;color:#64748b;text-align:right}.box{border:1px solid #111827;padding:12px 14px;margin-bottom:14px;line-height:1.45}.box h3{font-size:13px;text-transform:uppercase;margin:0 0 8px;color:#475569}.bank{width:100%;border-collapse:collapse;margin:14px 0}.bank td{border:1px solid #111827;padding:8px;vertical-align:top;font-size:13px}.items{width:100%;border-collapse:collapse;margin-top:22px}.items th,.items td{border:1px solid #111827;padding:9px}.items th{background:#f8fafc}.sum{text-align:right;font-size:21px;font-weight:900;margin-top:16px}.footer{margin-top:36px;border-top:1px solid #cbd5e1;padding-top:16px;display:flex;justify-content:space-between;gap:20px}.muted{color:#64748b;font-size:12px}.error{max-width:800px;margin:50px auto;padding:25px;background:#fff;border-radius:14px;color:#b91c1c}
    @media print{body{background:#fff}.toolbar{display:none}.sheet{width:100%;margin:0;box-shadow:none;padding:20px}.title{font-size:23px}.payment-state{break-inside:avoid}}
    @media(max-width:700px){.sheet{padding:24px 18px}.footer,.payment-state{flex-direction:column;align-items:flex-start}.payment-state span{text-align:left}.toolbar{padding:0 12px}.toolbar a,.toolbar button{flex:1;text-align:center}}
  </style>
</head>
<body>
  <div class="toolbar"><a id="back" class="secondary" href="./customers.html">← Назад</a><a id="paymentLink" class="payment" href="./payments.html">+ Зарегистрировать оплату</a><button onclick="window.print()">🖨 Печать / PDF</button></div>
  <main id="sheet" class="sheet"><div class="muted">Загрузка счёта…</div></main>
  <script type="module">
    import{supabase}from'./guard.js?v=20260905-netfix1';
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB'}).format(Number(v||0));
    const fmt=d=>d?new Date(String(d).length===10?d+'T00:00:00':d).toLocaleDateString('ru-RU'):'';
    const success=new Set(['PAID','COMPLETED','SUCCESS','SUCCESSFUL','CONFIRMED','CAPTURED']);
    const id=new URLSearchParams(location.search).get('id'),sheet=document.getElementById('sheet');
    if(!id){sheet.outerHTML='<div class="error">Не указан документ.</div>';throw Error('NO_ID')}
    const [{data:doc,error},{data:billing},{data:payments,error:paymentsError}]=await Promise.all([
      supabase.from('customer_documents').select('*').eq('id',id).single(),
      supabase.from('settings').select('value').eq('key','company_billing').maybeSingle(),
      supabase.from('payments').select('id,status,amount,payment_number,paid_at').eq('customer_document_id',id).order('created_at',{ascending:false})
    ]);
    if(error){sheet.outerHTML=`<div class="error">Ошибка загрузки: ${esc(error.message)}</div>`;throw error}
    const rows=paymentsError?[]:(payments||[]),paid=rows.filter(x=>success.has(String(x.status||'').toUpperCase())).reduce((sum,x)=>sum+Number(x.amount||0),0),left=Math.max(0,Number(doc.amount||0)-paid),isPaid=left<=0&&Number(doc.amount||0)>0;
    const s=billing?.value||{},c=doc.customer_snapshot||{};document.title=`${doc.document_number||'Счёт'} — A4PRINT HUB`;
    document.getElementById('back').href=`./customer.html?id=${doc.customer_id}`;
    const paymentLink=document.getElementById('paymentLink');paymentLink.href=`./payments.html?customer=${encodeURIComponent(doc.customer_id)}&document=${encodeURIComponent(doc.id)}`;if(isPaid)paymentLink.style.display='none';
    const sellerName=s.legal_name||s.name||'A4PRINT',buyerName=c.legal_name||c.company_name||c.full_name||'Клиент';
    sheet.innerHTML=`<div class="title">Счёт на оплату № ${esc(doc.document_number)} от ${fmt(doc.issue_date)}</div><div class="payment-state ${isPaid?'paid':''}"><b>${isPaid?'ОПЛАЧЕН':'К ОПЛАТЕ'}</b><span>Оплачено ${money(paid)} из ${money(doc.amount)}${isPaid?'':' · остаток '+money(left)}</span></div>${!s.inn?'<div class="box" style="border-color:#f59e0b;background:#fffbeb"><b>Внимание:</b> реквизиты продавца не заполнены. Заполните их в разделе «Настройки» HUB.</div>':''}<table class="bank"><tr><td rowspan="2"><b>${esc(s.bank_name||'Банк получателя')}</b></td><td>БИК<br><b>${esc(s.bik||'—')}</b></td><td>Сч. №<br><b>${esc(s.correspondent_account||'—')}</b></td></tr><tr><td colspan="2">Сч. № <b>${esc(s.settlement_account||'—')}</b></td></tr><tr><td colspan="3">Получатель: <b>${esc(sellerName)}</b><br>ИНН ${esc(s.inn||'—')}${s.kpp?` · КПП ${esc(s.kpp)}`:''}</td></tr></table><div class="box"><h3>Поставщик</h3><b>${esc(sellerName)}</b>${s.address?`<br>${esc(s.address)}`:''}${s.phone?`<br>Тел.: ${esc(s.phone)}`:''}${s.email?` · ${esc(s.email)}`:''}</div><div class="box"><h3>Покупатель</h3><b>${esc(buyerName)}</b>${c.inn?`<br>ИНН ${esc(c.inn)}`:''}${c.kpp?` · КПП ${esc(c.kpp)}`:''}${c.legal_address?`<br>${esc(c.legal_address)}`:''}${c.phone?`<br>Тел.: ${esc(c.phone)}`:''}${c.email?` · ${esc(c.email)}`:''}</div><table class="items"><thead><tr><th style="width:50px">№</th><th>Наименование</th><th style="width:120px">Кол-во</th><th style="width:160px">Цена</th><th style="width:160px">Сумма</th></tr></thead><tbody><tr><td>1</td><td>${esc(doc.description||'Услуги по счёту')}</td><td>1</td><td>${money(doc.amount)}</td><td>${money(doc.amount)}</td></tr></tbody></table><div class="sum">Итого к оплате: ${money(doc.amount)}</div>${doc.due_date?`<p><b>Оплатить до:</b> ${fmt(doc.due_date)}</p>`:''}<div class="footer"><div><b>${esc(s.signatory||'Руководитель')}</b><br><span class="muted">Подпись ____________________</span></div><div class="muted">Сформировано в A4PRINT HUB · статус ${esc(doc.status||'ISSUED')}</div></div>`;
  </script>
</body>
</html>
