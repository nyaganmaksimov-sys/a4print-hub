<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Касса A4-Принт</title><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#eef2f7;color:#172033}.pos{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 420px}.catalog{padding:24px}.head{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px}.head h1{margin:0}.head p,.meta,.status{color:#64748b}.head-actions{display:flex;gap:8px}.btn{border:1px solid #dbe1ea;border-radius:12px;padding:11px 15px;background:#fff;color:#172033;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.notice{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid #dbe1ea}.notice.error{border-color:#fecaca;background:#fff1f2;color:#991b1b}.notice.ok{border-color:#bbf7d0;background:#f0fdf4;color:#166534}.search{width:100%;padding:15px 17px;border:1px solid #dbe1ea;border-radius:14px;font:inherit;background:#fff;margin-bottom:16px}.filters{display:flex;gap:8px;margin-bottom:18px}.filter{border:1px solid #dbe1ea;background:#fff;border-radius:999px;padding:8px 13px}.filter.active{background:#111827;color:#fff}.goods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.card h3{margin:0 0 8px;font-size:16px}.price{font-size:23px;font-weight:800;margin-top:18px}.stock{font-size:12px;margin-top:5px;color:#15803d}.stock.zero{color:#b91c1c}.cart{background:#fff;border-left:1px solid #dbe1ea;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.cart-head{padding:22px;border-bottom:1px solid #e5e7eb}.cart-head h2{margin:0}.cart-list{padding:14px 20px;overflow:auto;flex:1}.empty{padding:30px 10px;text-align:center;color:#94a3b8}.item{padding:13px 0;border-bottom:1px solid #eef2f7}.item-top{display:flex;justify-content:space-between;gap:14px}.qty{display:flex;align-items:center;gap:8px;margin-top:10px}.qty button{height:32px;border:1px solid #dbe1ea;background:#fff;border-radius:8px}.cart-foot{padding:20px;border-top:1px solid #e5e7eb;display:grid;gap:12px}.field{display:grid;gap:6px}.field select{padding:12px;border:1px solid #dbe1ea;border-radius:10px}.total{display:flex;justify-content:space-between;align-items:end}.total strong{font-size:32px}.pay{padding:15px;border:0;border-radius:12px;background:#16a34a;color:#fff;font-size:17px;font-weight:800}.pay:disabled{opacity:.5}.denied{padding:40px}@media(max-width:1000px){.pos{grid-template-columns:1fr}.cart{position:relative;height:auto}}</style></head><body><div id="denied" class="denied" style="display:none"><h1>Доступ запрещён</h1></div><div id="pos" class="pos" style="display:none"><section class="catalog"><div class="head"><div><h1>Касса A4-Принт</h1><p id="subtitle">Загрузка…</p></div><div class="head-actions"><button id="sync" class="btn">↻ МойСклад</button><a class="btn" href="./cashbox.html">Финансы</a><a class="btn" href="./index.html">HUB</a></div></div><div id="notice" class="notice">Подключение…</div><input id="search" class="search" placeholder="Поиск товара, услуги или артикула"><div class="filters"><button class="filter active" data-type="ALL">Все</button><button class="filter" data-type="PRODUCT">Товары</button><button class="filter" data-type="SERVICE">Услуги</button></div><div id="goods" class="goods"></div></section><aside class="cart"><div class="cart-head"><h2>Чек</h2><div id="cartCount" class="status">0 позиций</div></div><div id="cartList" class="cart-list"></div><div class="cart-foot"><label class="field">Счёт<select id="account"></select></label><label class="field">Способ оплаты<select id="method"><option>Наличные</option><option>Карта</option><option>СБП</option><option>Банк</option></select></label><div class="total"><span>Итого</span><strong id="total">0 ₽</strong></div><button id="pay" class="pay">Оплатить и отправить в МойСклад</button></div></aside></div><script type="module">import{supabase}from'./guard.js';const $=x=>document.getElementById(x),rub=v=>Number(v||0).toLocaleString('ru-RU')+' ₽';let org,goods=[],accounts=[],cart=[],type='ALL',incomeCategory,stock={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function note(t,k='ok'){$('notice').textContent=t;$('notice').className='notice '+k}async function session(){const {data:{session}}=await supabase.auth.getSession();if(!session)throw new Error('Сессия истекла');return session}async function api(path,opt={}){const s=await session(),base=window.A4PRINT_CONFIG?.apiBaseUrl;if(!base)throw new Error('API не подключён');const r=await fetch(base+path,{...opt,headers:{Authorization:`Bearer ${s.access_token}`,'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw new Error(d.message||d.error);return d}async function setup(){let {data:a,error}=await supabase.from('cash_accounts').select('*').eq('organization_id',org.id).eq('is_active',true);if(error)throw error;accounts=a||[];let {data:c}=await supabase.from('cash_categories').select('*').eq('organization_id',org.id).eq('direction','INCOME').eq('name','Оплата заказа').maybeSingle();incomeCategory=c;$('account').innerHTML=accounts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}async function loadGoods(){const {data,error}=await supabase.from('catalog_items').select('*').eq('organization_id',org.id).eq('is_active',true).order('name');if(error)throw error;goods=data||[];renderGoods()}async function loadStock(){try{const d=await api('/api/v1/integrations/moysklad/stock');stock=d.stock||{};renderGoods()}catch(e){note('Каталог загружен, но остатки МойСклад: '+e.message,'error')}}async function init(){try{const {data:admin}=await supabase.rpc('has_role',{required_role:'ADMIN'});if(!admin){$('denied').style.display='block';return}$('pos').style.display='grid';const {data:o,error}=await supabase.from('organizations').select('id').eq('code','A4PRINT').single();if(error)throw error;org=o;await setup();await loadGoods();note(`Касса готова · ${goods.length} позиций · загружаю остатки…`);await loadStock();note(`МойСклад подключён · ${goods.length} позиций`)}catch(e){note('Ошибка: '+e.message,'error')}}function renderGoods(){const q=$('search').value.trim().toLowerCase(),rows=goods.filter(g=>(type==='ALL'||g.item_type===type)&&`${g.name} ${g.sku||''} ${g.article||''}`.toLowerCase().includes(q));$('subtitle').textContent=`${rows.length} из ${goods.length} позиций`;$('goods').innerHTML=rows.map(g=>{const st=g.external_id!=null?stock[g.external_id]:null;return`<article class="card" data-id="${g.id}"><div><h3>${esc(g.name)}</h3><div class="meta">${esc(g.article||g.sku||'—')} · ${g.item_type==='SERVICE'?'Услуга':'Товар'}</div>${g.item_type==='PRODUCT'&&st!=null?`<div class="stock ${st<=0?'zero':''}">Остаток МойСклад: ${st}</div>`:''}</div><div class="price">${rub(g.sale_price)}</div></article>`}).join('')||'<div class="empty">Каталог пуст. Нажмите ↻ МойСклад</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>add(c.dataset.id))}function add(id){const g=goods.find(x=>x.id===id);if(!g)return;const x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id:g.id,name:g.name,price:+g.sale_price||0,qty:1});renderCart()}function renderCart(){const n=cart.reduce((s,x)=>s+x.qty,0),sum=cart.reduce((s,x)=>s+x.price*x.qty,0);$('cartCount').textContent=n+' позиций';$('total').textContent=rub(sum);$('cartList').innerHTML=cart.map((x,i)=>`<div class="item"><div class="item-top"><div><b>${esc(x.name)}</b><div class="meta">${rub(x.price)} × ${x.qty}</div></div><b>${rub(x.price*x.qty)}</b></div><div class="qty"><button data-m="${i}">−</button><b>${x.qty}</b><button data-p="${i}">+</button><button data-r="${i}">Удалить</button></div></div>`).join('')||'<div class="empty">Добавьте товар слева</div>';document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;if(--cart[i].qty<1)cart.splice(i,1);renderCart()});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cart[+b.dataset.p].qty++;renderCart()});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.r,1);renderCart()})}$('search').oninput=renderGoods;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;renderGoods()});$('sync').onclick=async()=>{try{$('sync').disabled=true;note('Синхронизация МойСклад…');const d=await api('/api/v1/integrations/moysklad/sync',{method:'POST'});await loadGoods();await loadStock();note(`Синхронизация: получено ${d.received}, новых ${d.created}, обновлено ${d.updated}`)}catch(e){note('Ошибка синхронизации: '+e.message,'error')}finally{$('sync').disabled=false}};$('pay').onclick=async()=>{if(!cart.length)return note('Корзина пуста','error');if(!$('account').value)return note('Не выбран счёт','error');const total=cart.reduce((s,x)=>s+x.price*x.qty,0);try{$('pay').disabled=true;note('Создаю розничную продажу в МойСклад…');const ms=await api('/api/v1/pos/sale',{method:'POST',body:JSON.stringify({items:cart,payment_method:$('method').value})});const s=await session(),{data:u}=await supabase.from('users').select('id').eq('auth_user_id',s.user.id).maybeSingle();const {error}=await supabase.from('cash_transactions').insert({organization_id:org.id,cash_account_id:$('account').value,category_id:incomeCategory?.id||null,direction:'INCOME',amount:total,payment_method:$('method').value,description:`МойСклад ${ms.moysklad?.name||ms.moysklad?.id}: `+cart.map(x=>`${x.name} × ${x.qty}`).join(', '),transaction_date:new Date().toISOString().slice(0,10),created_by:u?.id||null});if(error)throw error;cart=[];renderCart();await loadStock();note(`Продажа ${ms.moysklad?.name||''} создана в МойСклад · ${rub(total)}`)}catch(e){note('Продажа не проведена: '+e.message,'error')}finally{$('pay').disabled=false}};renderCart();init();</script></body></html>
