<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Касса A4-Принт</title><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f7;color:#172033}.pos{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 420px}.catalog{padding:24px}.head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}.head h1{margin:0;font-size:28px}.head p{margin:5px 0 0;color:#64748b}.head-actions{display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#111827;color:#fff;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:#fff;color:#172033;border:1px solid #dbe1ea}.search{width:100%;padding:15px 17px;border:1px solid #dbe1ea;border-radius:14px;font:inherit;background:#fff;margin-bottom:16px}.filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.filter{border:1px solid #dbe1ea;background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer}.filter.active{background:#111827;color:#fff;border-color:#111827}.goods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;cursor:pointer;min-height:145px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0f172a12}.card h3{font-size:16px;margin:0 0 8px}.meta{font-size:12px;color:#64748b}.price{font-size:23px;font-weight:800;margin-top:18px}.cart{background:#fff;border-left:1px solid #dbe1ea;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.cart-head{padding:22px;border-bottom:1px solid #e5e7eb}.cart-head h2{margin:0}.cart-list{padding:14px 20px;overflow:auto;flex:1}.empty{padding:30px 10px;text-align:center;color:#94a3b8}.item{padding:13px 0;border-bottom:1px solid #eef2f7}.item-top{display:flex;justify-content:space-between;gap:14px}.item-name{font-weight:700}.qty{display:flex;align-items:center;gap:8px;margin-top:10px}.qty button{width:32px;height:32px;border:1px solid #dbe1ea;background:#fff;border-radius:8px;cursor:pointer}.remove{border:0;background:none;color:#b91c1c;cursor:pointer}.cart-foot{padding:20px;border-top:1px solid #e5e7eb;display:grid;gap:12px}.total{display:flex;justify-content:space-between;align-items:end}.total span{color:#64748b}.total strong{font-size:32px}.field{display:grid;gap:6px}.field select,.field input{padding:12px;border:1px solid #dbe1ea;border-radius:10px;font:inherit}.pay{padding:15px;border-radius:12px;border:0;background:#16a34a;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}.status{font-size:13px;color:#64748b}.denied{padding:40px}.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:10}@media(max-width:1000px){.pos{grid-template-columns:1fr}.cart{position:relative;height:auto;border-left:0;border-top:1px solid #dbe1ea}.goods{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}</style></head><body><div id="toast" class="toast"></div><div id="denied" class="denied" style="display:none"><h1>Доступ запрещён</h1><p>Касса доступна только администратору.</p></div><div id="pos" class="pos" style="display:none"><section class="catalog"><div class="head"><div><h1>Касса A4-Принт</h1><p id="subtitle">Продажа товаров и услуг</p></div><div class="head-actions"><button id="sync" class="btn secondary">↻ МойСклад</button><a class="btn secondary" href="./cashbox.html" style="text-decoration:none">Финансы</a><a class="btn secondary" href="./index.html" style="text-decoration:none">HUB</a></div></div><input id="search" class="search" placeholder="Поиск товара, услуги или артикула"><div class="filters"><button class="filter active" data-type="ALL">Все</button><button class="filter" data-type="PRODUCT">Товары</button><button class="filter" data-type="SERVICE">Услуги</button></div><div id="goods" class="goods"></div></section><aside class="cart"><div class="cart-head"><h2>Чек</h2><div id="cartCount" class="status">0 позиций</div></div><div id="cartList" class="cart-list"></div><div class="cart-foot"><label class="field">Счёт<select id="account"></select></label><label class="field">Способ оплаты<select id="method"><option>Наличные</option><option>Карта</option><option>СБП</option><option>Банк</option></select></label><div class="total"><span>Итого</span><strong id="total">0 ₽</strong></div><button id="pay" class="pay">Оплатить</button></div></aside></div><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id),rub=v=>Number(v||0).toLocaleString('ru-RU')+' ₽';let org,goods=[],accounts=[],cart=[],type='ALL';const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)};async function init(){const {data:isAdmin}=await supabase.rpc('has_role',{required_role:'ADMIN'});if(!isAdmin){$('denied').style.display='block';return}$('pos').style.display='grid';const {data:o,error:oe}=await supabase.from('organizations').select('id').eq('code','A4PRINT').single();if(oe)return toast(oe.message);org=o;const [{data:g,error:ge},{data:a,error:ae}]=await Promise.all([supabase.from('catalog_items').select('*').eq('organization_id',org.id).eq('external_source','MOYSKLAD').eq('is_active',true).order('name'),supabase.from('cash_accounts').select('*').eq('organization_id',org.id).eq('is_active',true).order('name')]);if(ge||ae)return toast((ge||ae).message);goods=g||[];accounts=a||[];$('account').innerHTML=accounts.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');renderGoods();renderCart()}function renderGoods(){const q=$('search').value.trim().toLowerCase();const rows=goods.filter(g=>(type==='ALL'||g.item_type===type)&&`${g.name} ${g.sku||''} ${g.article||''}`.toLowerCase().includes(q));$('subtitle').textContent=`${rows.length} позиций в каталоге`; $('goods').innerHTML=rows.map(g=>`<article class="card" data-id="${g.id}"><div><h3>${esc(g.name)}</h3><div class="meta">${esc(g.article||g.sku||'Без артикула')} · ${g.item_type==='SERVICE'?'Услуга':'Товар'}</div></div><div class="price">${rub(g.sale_price)}</div></article>`).join('')||'<div class="empty">Ничего не найдено</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>add(c.dataset.id))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function add(id){const g=goods.find(x=>x.id===id);if(!g)return;const x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id:g.id,name:g.name,price:Number(g.sale_price||0),qty:1});renderCart()}function renderCart(){const sum=cart.reduce((s,x)=>s+x.price*x.qty,0);$('cartCount').textContent=`${cart.reduce((s,x)=>s+x.qty,0)} позиций`;$('total').textContent=rub(sum);$('cartList').innerHTML=cart.map((x,i)=>`<div class="item"><div class="item-top"><div><div class="item-name">${esc(x.name)}</div><div class="meta">${rub(x.price)} × ${x.qty}</div></div><b>${rub(x.price*x.qty)}</b></div><div class="qty"><button data-minus="${i}">−</button><b>${x.qty}</b><button data-plus="${i}">+</button><button class="remove" data-remove="${i}">Удалить</button></div></div>`).join('')||'<div class="empty">Добавьте товар слева</div>';document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const x=cart[+b.dataset.minus];x.qty--;if(x.qty<=0)cart.splice(+b.dataset.minus,1);renderCart()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{cart[+b.dataset.plus].qty++;renderCart()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);renderCart()})}$('search').oninput=renderGoods;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;renderGoods()});$('pay').onclick=async()=>{if(!cart.length)return toast('Корзина пуста');const total=cart.reduce((s,x)=>s+x.price*x.qty,0);const {data:{session}}=await supabase.auth.getSession();const {data:u}=await supabase.from('users').select('id').eq('auth_user_id',session.user.id).maybeSingle();const {data:cat}=await supabase.from('cash_categories').select('id').eq('organization_id',org.id).eq('direction','INCOME').eq('name','Оплата заказа').maybeSingle();const desc='Продажа: '+cart.map(x=>`${x.name} × ${x.qty}`).join(', ');const {error}=await supabase.from('cash_transactions').insert({organization_id:org.id,cash_account_id:$('account').value,category_id:cat?.id||null,direction:'INCOME',amount:total,payment_method:$('method').value,description:desc,transaction_date:new Date().toISOString().slice(0,10),created_by:u?.id||null});if(error)return toast(error.message);cart=[];renderCart();toast('Продажа проведена')};$('sync').onclick=async()=>{const base=window.A4PRINT_CONFIG?.apiBaseUrl;if(!base)return toast('API не подключён');const {data:{session}}=await supabase.auth.getSession();$('sync').disabled=true;try{const r=await fetch(base+'/api/v1/integrations/moysklad/sync',{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`}}),d=await r.json();if(!r.ok)throw new Error(d.message||d.error);const {data:g}=await supabase.from('catalog_items').select('*').eq('organization_id',org.id).eq('external_source','MOYSKLAD').eq('is_active',true).order('name');goods=g||[];renderGoods();toast(`Синхронизировано: ${d.received}`)}catch(e){toast(e.message)}finally{$('sync').disabled=false}};init();</script></body></html>
