<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script><style>.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{min-height:42px;padding:0 12px;border:1px solid #dbe3ee;border-radius:10px;background:#fff;font:inherit}.toolbar input{min-width:280px;flex:1}.status{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:12px;font-weight:800}.status i{width:8px;height:8px;border-radius:50%;background:#94a3b8}.status.on i{background:#22c55e}.list{display:grid;gap:12px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:16px}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.sender b{display:block;font-size:15px}.sender small{display:block;margin-top:3px;color:#64748b}.chip{display:inline-flex;align-items:center;min-height:25px;padding:0 8px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:10px;font-weight:850}.chip.work{background:#fff7ed;color:#c2410c}.chip.order{background:#ecfdf5;color:#15803d}.chip.closed{background:#f1f5f9;color:#475569}.message{margin-top:12px;padding:13px 14px;border-radius:12px;background:#f8fafc;color:#1e293b;white-space:pre-wrap;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button,.actions a{min-height:38px;padding:0 12px;border:1px solid #dbe3ee;border-radius:9px;background:#fff;color:#334155;font:inherit;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.actions .primary{background:#2563eb;color:#fff;border-color:#2563eb}.actions .green{background:#16a34a;color:#fff;border-color:#16a34a}.empty{padding:36px;text-align:center;color:#94a3b8;border:1px dashed #dbe3ee;border-radius:14px}.topnote{margin-bottom:14px;padding:12px 14px;border:1px solid #dbeafe;border-radius:12px;background:#eff6ff;color:#1e40af;font-size:12px;line-height:1.5}@media(max-width:700px){.head{flex-direction:column}.toolbar input{min-width:0;width:100%}.toolbar select{flex:1}.actions button,.actions a{flex:1;justify-content:center}}</style></head><body><aside class="sidebar"><div class="brand"></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>Telegram</h1><p>Входящие сообщения и заявки клиентов</p></div><div style="display:flex;gap:8px;align-items:center"><span id="botStatus" class="status"><i></i>Проверка…</span><a class="btn" href="./settings.html">Настроить</a></div></header><section class="panel"><div class="topnote">Сообщения Telegram сохраняются в A4PRINT HUB. Здесь можно ответить клиенту, взять обращение в работу или создать из него заказ.</div><div class="toolbar"><input id="q" type="search" placeholder="Поиск по имени, username или тексту"><select id="statusFilter"><option value="">Все статусы</option><option value="NEW">Новые</option><option value="IN_WORK">В работе</option><option value="ORDER_CREATED">Создан заказ</option><option value="CLOSED">Закрытые</option></select><button id="reload">Обновить</button></div><div id="list" class="list"><div class="empty">Загрузка…</div></div></section></main><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id),cfg=window.A4PRINT_CONFIG||{},esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let session=null,rows=[],acceptOrders=true;const statusText=s=>({NEW:'Новое',READ:'Прочитано',IN_WORK:'В работе',ORDER_CREATED:'Заказ создан',CLOSED:'Закрыто'}[s]||s);const statusClass=s=>s==='IN_WORK'?'work':s==='ORDER_CREATED'?'order':s==='CLOSED'?'closed':'';async function api(path,options={}){if(!session?.access_token)throw new Error('Нет активной сессии');const res=await fetch((cfg.apiBaseUrl||'https://a4print-hub-api.onrender.com')+path,{...options,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(options.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||data.error||('HTTP '+res.status));return data}function sender(r){const n=[r.first_name,r.last_name].filter(Boolean).join(' ').trim();return n||(r.username?'@'+r.username:'Telegram '+r.chat_id)}function filtered(){const q=$('q').value.trim().toLowerCase(),st=$('statusFilter').value;return rows.filter(r=>(!st||r.status===st)&&(!q||[r.first_name,r.last_name,r.username,r.message_text,r.chat_id].some(v=>String(v||'').toLowerCase().includes(q))))}function render(){const data=filtered();$('list').innerHTML=data.map(r=>`<article class="card"><div class="head"><div class="sender"><b>${esc(sender(r))}</b><small>${r.username?'@'+esc(r.username)+' · ':''}${new Date(r.created_at).toLocaleString('ru-RU')}</small></div><span class="chip ${statusClass(r.status)}">${statusText(r.status)}</span></div><div class="message">${esc(r.message_text||'Сообщение без текста')}</div><div class="actions">${r.status==='NEW'?`<button data-work="${r.id}">В работу</button>`:''}<button data-reply="${r.id}" class="primary">Ответить</button>${acceptOrders&&!r.linked_order_id?`<button data-order="${r.id}" class="green">Создать заказ А4</button><button data-order3d="${r.id}">Создать 3D-заказ</button>`:''}${r.linked_order_id?`<a href="./order.html?id=${encodeURIComponent(r.linked_order_id)}" class="green">Открыть заказ</a>`:''}${r.status!=='CLOSED'?`<button data-close="${r.id}">Закрыть</button>`:''}</div></article>`).join('')||'<div class="empty">Сообщений пока нет</div>';wire()}function wire(){document.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>setStatus(b.dataset.work,'IN_WORK'));document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>setStatus(b.dataset.close,'CLOSED'));document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=async()=>{const text=prompt('Ответ клиенту в Telegram:');if(!text?.trim())return;b.disabled=true;try{await api(`/api/v1/integrations/telegram/messages/${b.dataset.reply}/reply`,{method:'POST',body:JSON.stringify({text})});await load()}catch(e){alert(e.message)}finally{b.disabled=false}});document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>createOrder(b.dataset.order,'A4_PRINT'));document.querySelectorAll('[data-order3d]').forEach(b=>b.onclick=()=>createOrder(b.dataset.order3d,'3D_ARTPRINT'))}async function setStatus(id,status){try{await api(`/api/v1/integrations/telegram/messages/${id}`,{method:'PATCH',body:JSON.stringify({status})});await load()}catch(e){alert(e.message)}}async function createOrder(id,unit){if(!confirm(`Создать новый заказ ${unit==='3D_ARTPRINT'?'3D-ARTPRINT':'А4-Принт'} из этого сообщения?`))return;try{const d=await api(`/api/v1/integrations/telegram/messages/${id}/create-order`,{method:'POST',body:JSON.stringify({business_unit:unit})});if(d.order?.id)location.href='./order.html?id='+encodeURIComponent(d.order.id);else await load()}catch(e){alert('Не удалось создать заказ: '+e.message)}}async function load(){try{$('list').innerHTML='<div class="empty">Загрузка…</div>';const[s,m]=await Promise.all([api('/api/v1/integrations/telegram/status'),api('/api/v1/integrations/telegram/messages')]);acceptOrders=s.accept_orders!==false;const st=$('botStatus');st.classList.toggle('on',!!s.connected&&!!s.enabled);st.innerHTML=`<i></i>${s.connected?(s.enabled?'@'+(s.bot_username||'bot'):'Бот выключен'):'Не подключён'}`;rows=m.messages||[];render()}catch(e){$('list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}$('q').oninput=render;$('statusFilter').onchange=render;$('reload').onclick=load;const s=await supabase.auth.getSession();session=s.data.session;if(!session)location.replace('./login.html');else await load();</script></body></html>
