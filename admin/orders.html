<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заказы — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script></head><body><aside class="sidebar"><div class="brand"></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>🛒 Заказы</h1><p>Заказы А4-Принт, 3D-ARTPRINT и партнёрского канала</p></div><button id="refresh">Обновить</button></header><section class="stats"><article><span>Всего</span><strong id="all">0</strong></article><article><span>Новые</span><strong id="new">0</strong></article><article><span>В работе</span><strong id="work">0</strong></article><article><span>🤝 Партнёрские</span><strong id="partnerCount">0</strong></article></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Поиск по номеру, услуге, клиенту или партнёру"><select id="status"><option value="">Все статусы</option><option value="NEW">Новые</option><option value="WORK">В работе</option><option value="CONFIRMED">Подтверждённые</option><option value="IN_PROGRESS">Только в производстве</option><option value="READY">Готовые</option><option value="COMPLETED">Завершённые</option><option value="ON_HOLD">Приостановленные</option><option value="CANCELLED">Отменённые</option></select><select id="unit"><option value="">Все направления</option><option value="A4_PRINT">А4-Принт</option><option value="3D_ARTPRINT">3D-ARTPRINT</option><option value="COMMON">Общие</option></select><select id="source"><option value="">Все источники</option><option value="PARTNER">Партнёрские</option><option value="DIRECT">Без партнёров</option></select></div><div id="list"><div class="empty">Загрузка...</div></div></section></main><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let orders=[];const labels={NEW:'Новый',CONFIRMED:'Подтверждён',IN_PROGRESS:'В работе',READY:'Готов',COMPLETED:'Завершён',ON_HOLD:'Приостановлен',CANCELLED:'Отменён'};const params=new URLSearchParams(location.search);if(params.get('q'))$('search').value=params.get('q');if(params.get('status')&&[...$('status').options].some(o=>o.value===params.get('status')))$('status').value=params.get('status');if(params.get('unit')&&[...$('unit').options].some(o=>o.value===params.get('unit')))$('unit').value=params.get('unit');async function load(){const {data,error}=await supabase.from('orders').select('*,customers(full_name,company_name,phone,email),requester:partners!orders_partner_id_fkey(name,contact_name,phone,email),executor:partners!orders_fulfillment_partner_id_fkey(name,contact_name,phone,email)').order('created_at',{ascending:false});if(error){$('list').innerHTML=`<div class="empty">Ошибка: ${esc(error.message)}</div>`;return}orders=data||[];render()}function render(){const q=$('search').value.trim().toLowerCase(),s=$('status').value,u=$('unit').value,src=$('source').value;const rows=orders.filter(o=>{const c=o.customers||{},p=o.requester||o.executor||{};const text=`${o.order_number||''} ${o.model_name||''} ${o.source||''} ${c.full_name||''} ${c.company_name||''} ${c.phone||''} ${c.email||''} ${p.name||''} ${p.contact_name||''}`.toLowerCase(),isPartner=!!(o.partner_id||o.fulfillment_partner_id),statusOk=!s||(s==='WORK'?['CONFIRMED','IN_PROGRESS'].includes(o.status):o.status===s);return(!q||text.includes(q))&&statusOk&&(!u||o.business_unit===u)&&(!src||(src==='PARTNER'?isPartner:!isPartner))});$('all').textContent=orders.length;$('new').textContent=orders.filter(x=>x.status==='NEW').length;$('work').textContent=orders.filter(x=>['CONFIRMED','IN_PROGRESS'].includes(x.status)).length;$('partnerCount').textContent=orders.filter(x=>x.partner_id||x.fulfillment_partner_id).length;$('list').innerHTML=rows.map(o=>{const c=o.customers||{},p=o.requester||o.executor||{},isOutbound=!!o.fulfillment_partner_id&&o.partner_direction==='OUTBOUND',isPartner=!!(o.partner_id||o.fulfillment_partner_id),who=isPartner?p.name:(c.full_name||c.company_name||'Клиент не указан'),badge=isOutbound?'🤝 МЫ ЗАКАЗАЛИ У ПАРТНЁРА':'🤝 ПАРТНЁР ЗАКАЗАЛ У НАС';return`<a class="order" href="./order.html?id=${o.id}"><div><b>Заказ №${esc(o.order_number)}</b>${isPartner?`<span class="partner-badge">${badge}</span>`:''}<small>${o.business_unit==='3D_ARTPRINT'?'3D-ARTPRINT':o.business_unit==='A4_PRINT'?'А4-Принт':'Общий'} · ${new Date(o.created_at).toLocaleString('ru-RU')}</small></div><div><b>${esc(who)}</b><small>${esc(isPartner?(p.contact_name||p.phone||p.email||'Партнёрский кабинет'):(o.model_name||o.source||'—'))}</small></div><div><b>${Number(o.total||0).toLocaleString('ru-RU')} ₽</b><small>${esc(labels[o.status]||o.status)}</small></div></a>`}).join('')||'<div class="empty">Заказы не найдены</div>'}['search','status','unit','source'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('refresh').onclick=load;load();</script><style>.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{padding:11px;border:1px solid #dbe1ea;border-radius:9px;font:inherit}.toolbar input{flex:1;min-width:240px}.order{display:grid;grid-template-columns:1fr 1fr 180px;gap:18px;padding:16px;border-bottom:1px solid #e5e7eb;text-decoration:none;color:inherit}.order:hover{background:#f8fafc}.order small{display:block;color:#64748b;margin-top:5px}.partner-badge{display:inline-block;margin-left:8px;padding:4px 7px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:10px;font-weight:900}@media(max-width:800px){.order{grid-template-columns:1fr}.sidebar{display:none}.main{margin-left:0!important}}</style></body></html>
