<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заказы — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">A4</span><div>A4PRINT<br><small>HUB</small></div></div><nav><a href="./index.html">🏠 Главная</a><a class="active" href="./orders.html">🛒 Заказы</a><a href="./customers.html">👥 Клиенты</a><a href="./warehouse.html">📦 Склад</a><a href="./warehouse.html">🧾 Номенклатура</a><a href="./production.html">🏭 Производство</a><a href="./messages.html">💬 Сообщения</a><a href="./documents.html">📁 Документы</a><a href="./payments.html">💰 Оплаты</a><a href="./reports.html">📊 Отчёты</a></nav></aside><main class="main"><header class="topbar"><div><h1>🛒 Заказы</h1><p>Заказы А4-Принт и 3D-ARTPRINT</p></div><button id="refresh">Обновить</button></header><section class="stats"><article><span>Всего</span><strong id="all">0</strong></article><article><span>Новые</span><strong id="new">0</strong></article><article><span>В работе</span><strong id="work">0</strong></article><article><span>Готовы</span><strong id="ready">0</strong></article></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Поиск по номеру, модели, клиенту"><select id="status"><option value="">Все статусы</option><option value="NEW">Новые</option><option value="CONFIRMED">Подтверждённые</option><option value="IN_PROGRESS">В работе</option><option value="READY">Готовые</option><option value="COMPLETED">Завершённые</option><option value="ON_HOLD">Приостановленные</option><option value="CANCELLED">Отменённые</option></select><select id="unit"><option value="">Все направления</option><option value="A4_PRINT">А4-Принт</option><option value="3D_ARTPRINT">3D-ARTPRINT</option><option value="COMMON">Общие</option></select></div><div id="list"><div class="empty">Загрузка...</div></div></section></main><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id);let orders=[];const labels={NEW:'Новый',CONFIRMED:'Подтверждён',IN_PROGRESS:'В работе',READY:'Готов',COMPLETED:'Завершён',ON_HOLD:'Приостановлен',CANCELLED:'Отменён'};async function load(){const {data,error}=await supabase.from('orders').select('*,customers(full_name,company_name,phone,email)').order('created_at',{ascending:false});if(error){$('list').innerHTML=`<div class="empty">Ошибка: ${error.message}</div>`;return}orders=data||[];render()}function render(){const q=$('search').value.trim().toLowerCase(),s=$('status').value,u=$('unit').value;const rows=orders.filter(o=>{const c=o.customers||{};const text=`${o.order_number||''} ${o.model_name||''} ${c.full_name||''} ${c.company_name||''} ${c.phone||''}`.toLowerCase();return(!q||text.includes(q))&&(!s||o.status===s)&&(!u||o.business_unit===u)});$('all').textContent=orders.length;$('new').textContent=orders.filter(x=>x.status==='NEW').length;$('work').textContent=orders.filter(x=>['CONFIRMED','IN_PROGRESS'].includes(x.status)).length;$('ready').textContent=orders.filter(x=>x.status==='READY').length;$('list').innerHTML=rows.map(o=>{const c=o.customers||{};return`<a class="order" href="./order.html?id=${o.id}"><div><b>Заказ №${o.order_number}</b><small>${o.business_unit==='3D_ARTPRINT'?'3D-ARTPRINT':o.business_unit==='A4_PRINT'?'А4-Принт':'Общий'} · ${new Date(o.created_at).toLocaleString('ru-RU')}</small></div><div><b>${c.full_name||c.company_name||'Клиент не указан'}</b><small>${o.model_name||o.source||'—'}</small></div><div><b>${Number(o.total||0).toLocaleString('ru-RU')} ₽</b><small>${labels[o.status]||o.status}</small></div></a>`}).join('')||'<div class="empty">Заказы не найдены</div>'}['search','status','unit'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('refresh').onclick=load;load();</script><style>.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{padding:11px;border:1px solid #dbe1ea;border-radius:9px;font:inherit}.toolbar input{flex:1;min-width:240px}.order{display:grid;grid-template-columns:1fr 1fr 180px;gap:18px;padding:16px;border-bottom:1px solid #e5e7eb;text-decoration:none;color:inherit}.order:hover{background:#f8fafc}.order small{display:block;color:#64748b;margin-top:5px}@media(max-width:800px){.order{grid-template-columns:1fr}.sidebar{display:none}.main{margin-left:0!important}}</style></body></html>
