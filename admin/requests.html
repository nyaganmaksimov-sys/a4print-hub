<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявки — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script><style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid #dbe3ee;background:#fff;color:#334155}.tab.active{background:#0f172a;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:14px}.stat small{color:#64748b}.stat strong{display:block;font-size:24px;margin-top:4px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:10px 12px;border:1px solid #dbe3ee;border-radius:10px;font:inherit}.list{display:grid;gap:14px}.request-card{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:18px}.headrow{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.headrow h3{margin:0 0 5px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800}.chip.new{background:#dbeafe;color:#1d4ed8}.chip.review,.chip.contacted{background:#fef3c7;color:#92400e}.chip.approved{background:#dcfce7;color:#166534}.chip.rejected{background:#fee2e2;color:#991b1b}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.box{padding:12px;border-radius:12px;background:#f8fafc;line-height:1.55}.box b{display:block;margin-bottom:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.photos img{width:180px;height:110px;object-fit:cover;border-radius:12px;border:1px solid #dbe3ee}.empty{padding:30px;text-align:center;color:#94a3b8;border:1px dashed #dbe3ee;border-radius:14px}.note{font-size:12px;color:#64748b;margin-top:5px}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.headrow{flex-direction:column}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><aside class="sidebar"><div class="brand"></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>Заявки</h1><p>Все входящие запросы с сайта и регистрации исполнителей</p></div><button id="reload">Обновить</button></header><section class="panel"><div class="tabs"><button class="btn tab active" data-tab="connect">Подключение к HUB <span id="connectBadge"></span></button><button class="btn tab" data-tab="executor">Регистрация исполнителей <span id="executorBadge"></span></button></div><div class="stats"><div class="stat"><small>Новые</small><strong id="statNew">0</strong></div><div class="stat"><small>В работе</small><strong id="statWork">0</strong></div><div class="stat"><small>Подтверждены</small><strong id="statApproved">0</strong></div><div class="stat"><small>Отклонены</small><strong id="statRejected">0</strong></div></div><div class="toolbar"><input id="q" placeholder="Поиск по компании, контакту, email"><select id="statusFilter"><option value="">Все статусы</option><option value="NEW">Новые</option><option value="CONTACTED">В работе / связались</option><option value="REVIEW">На проверке</option><option value="APPROVED">Подтверждены</option><option value="REJECTED">Отклонены</option></select></div><div id="list" class="list"><div class="empty">Загрузка…</div></div></section></main><script type="module">import{supabase}from'./guard.js';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let tab='connect',rows=[];const statusClass=s=>String(s||'').toLowerCase();const statusText=s=>({NEW:'Новая',CONTACTED:'В работе',REVIEW:'На проверке',APPROVED:'Подтверждена',REJECTED:'Отклонена'}[s]||s||'—');async function signed(path){if(!path)return null;const{data}=await supabase.storage.from('executor-registration-private').createSignedUrl(path,3600);return data?.signedUrl||null}function recalc(){const f=filtered();$('statNew').textContent=f.filter(x=>x.status==='NEW').length;$('statWork').textContent=f.filter(x=>['CONTACTED','REVIEW'].includes(x.status)).length;$('statApproved').textContent=f.filter(x=>x.status==='APPROVED').length;$('statRejected').textContent=f.filter(x=>x.status==='REJECTED').length}function filtered(){const q=$('q').value.trim().toLowerCase(),st=$('statusFilter').value;return rows.filter(x=>(!st||x.status===st)&&(!q||[x.company_name,x.contact_name,x.email,x.phone,x.city,x.legal_name,x.inn].some(v=>String(v||'').toLowerCase().includes(q))))}function connectCard(r){return`<article class="request-card"><div class="headrow"><div><h3>${esc(r.company_name)}</h3><div class="meta"><span class="chip ${statusClass(r.status)}">${statusText(r.status)}</span>${r.interest?`<span class="chip">${esc(r.interest)}</span>`:''}${r.city?`<span class="chip">${esc(r.city)}</span>`:''}<span class="chip">${new Date(r.created_at).toLocaleString('ru-RU')}</span></div></div></div><div class="cols"><div class="box"><b>Контакт</b>${esc(r.contact_name)}${r.phone?`<br><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>`:''}${r.email?`<br><a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`:''}</div><div class="box"><b>Комментарий</b>${esc(r.message||'Комментарий не указан')}</div></div><div class="actions">${r.status!=='CONTACTED'?`<button data-connect-status="${r.id}|CONTACTED">В работу / связались</button>`:''}${r.status!=='APPROVED'?`<button data-connect-status="${r.id}|APPROVED">Подтвердить</button>`:''}${r.status!=='REJECTED'?`<button data-connect-status="${r.id}|REJECTED">Отклонить</button>`:''}</div></article>`}async function executorCard(r){const file=await signed(r.verification_file_path);return`<article class="request-card"><div class="headrow"><div><h3>${esc(r.company_name)}</h3><div class="meta"><span class="chip ${statusClass(r.status)}">${statusText(r.status)}</span>${r.company_type?`<span class="chip">${esc(r.company_type)}</span>`:''}${r.city?`<span class="chip">${esc(r.city)}</span>`:''}<span class="chip">${new Date(r.created_at).toLocaleString('ru-RU')}</span></div></div></div><div class="cols"><div class="box"><b>Компания</b>${esc(r.legal_name||'—')}<br>ИНН: ${esc(r.inn||'—')} · КПП: ${esc(r.kpp||'—')}<br>ОГРН/ОГРНИП: ${esc(r.ogrn||'—')}<br>${esc(r.address||'')}</div><div class="box"><b>Контакт</b>${esc(r.contact_name)}${r.phone?`<br><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>`:''}${r.email?`<br><a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`:''}${r.website?`<br><a href="${esc(r.website)}" target="_blank">${esc(r.website)}</a>`:''}</div><div class="box"><b>Описание</b>${esc(r.description||'—')}<br><br><b>Услуги</b><br>${esc(r.services||'—')}</div><div class="box"><b>Оборудование</b>${esc(r.equipment||'—')}<br><br><b>Доставка / график</b><br>${esc(r.delivery_info||'—')} · ${esc(r.working_hours||'—')}</div></div>${r.logo_url||r.cover_url?`<div class="photos">${r.logo_url?`<img src="${esc(r.logo_url)}" alt="Логотип">`:''}${r.cover_url?`<img src="${esc(r.cover_url)}" alt="Обложка">`:''}</div>`:''}<div class="actions">${file?`<a class="btn" href="${esc(file)}" target="_blank">Проверочный документ</a>`:''}${r.status==='NEW'?`<button data-exec-review="${r.id}">На проверку</button>`:''}${r.status!=='APPROVED'?`<button data-exec-approve="${r.id}">Подтвердить и создать партнёра</button>`:''}${r.status!=='REJECTED'?`<button data-exec-reject="${r.id}">Отклонить</button>`:''}${r.status==='APPROVED'?`<button data-invite="${r.id}">${r.invite_sent_at?'Отправить приглашение повторно':'Отправить приглашение в Partner CRM'}</button>`:''}</div>${r.invite_sent_at?`<div class="note">Приглашение отправлено: ${new Date(r.invite_sent_at).toLocaleString('ru-RU')}</div>`:''}${r.admin_comment?`<div class="note">Комментарий администратора: ${esc(r.admin_comment)}</div>`:''}</article>`}async function render(){recalc();const f=filtered();if(tab==='connect')$('list').innerHTML=f.map(connectCard).join('')||'<div class="empty">Заявок нет</div>';else{const out=[];for(const r of f)out.push(await executorCard(r));$('list').innerHTML=out.join('')||'<div class="empty">Заявок нет</div>'}wire()}function wire(){document.querySelectorAll('[data-connect-status]').forEach(b=>b.onclick=async()=>{const[id,status]=b.dataset.connectStatus.split('|');let extra={};if(status==='REJECTED'){const reason=prompt('Причина отклонения (необязательно):')||null;extra={message:reason?`${(rows.find(x=>x.id===id)?.message||'')}\n\nКомментарий администратора: ${reason}`:rows.find(x=>x.id===id)?.message||null}}b.disabled=true;const{error}=await supabase.from('connection_requests').update({status,...extra,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await load()});document.querySelectorAll('[data-exec-review]').forEach(b=>b.onclick=()=>execStatus(b.dataset.execReview,'REVIEW'));document.querySelectorAll('[data-exec-reject]').forEach(b=>b.onclick=async()=>{const comment=prompt('Причина отклонения (необязательно):')||null;const{error}=await supabase.from('executor_registration_requests').update({status:'REJECTED',admin_comment:comment,updated_at:new Date().toISOString()}).eq('id',b.dataset.execReject);if(error)alert(error.message);await load()});document.querySelectorAll('[data-exec-approve]').forEach(b=>b.onclick=async()=>{if(!confirm('Подтвердить компанию и создать партнёра?'))return;b.disabled=true;const{data,error}=await supabase.rpc('approve_executor_registration',{p_request_id:b.dataset.execApprove});if(error)alert(error.message);else alert('Партнёр создан: '+data);await load()});document.querySelectorAll('[data-invite]').forEach(b=>b.onclick=async()=>{if(!confirm('Отправить приглашение на email исполнителя?'))return;b.disabled=true;b.textContent='Отправляем…';const{data,error}=await supabase.functions.invoke('invite-approved-executor',{body:{request_id:b.dataset.invite}});if(error)alert(error.message);else alert(data?.message||'Приглашение отправлено');await load()})}async function execStatus(id,status){const{error}=await supabase.from('executor_registration_requests').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await load()}async function load(){ $('list').innerHTML='<div class="empty">Загрузка…</div>';const table=tab==='connect'?'connection_requests':'executor_registration_requests';const{data,error}=await supabase.from(table).select('*').order('created_at',{ascending:false});if(error){$('list').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=data||[];await updateBadges();await render()}async function updateBadges(){const [{count:c1},{count:c2}]=await Promise.all([supabase.from('connection_requests').select('*',{count:'exact',head:true}).eq('status','NEW'),supabase.from('executor_registration_requests').select('*',{count:'exact',head:true}).eq('status','NEW')]);$('connectBadge').textContent=c1?`(${c1})`:'';$('executorBadge').textContent=c2?`(${c2})`:''}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('statusFilter').value='';$('q').value='';await load()});$('q').oninput=render;$('statusFilter').onchange=render;$('reload').onclick=load;await load();</script></body></html>
