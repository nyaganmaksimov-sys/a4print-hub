<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пользователи — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script><style>.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}.btn.secondary{background:#fff;color:#334155;border:1px solid #dbe2ea}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top}.roles{display:flex;gap:6px;flex-wrap:wrap}.role{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}.muted{color:#64748b;font-size:13px}.status{font-size:12px;font-weight:800;padding:4px 8px;border-radius:999px}.status.on{background:#dcfce7;color:#166534}.status.off{background:#fee2e2;color:#991b1b}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;place-items:center;padding:20px;z-index:50}.modal.open{display:grid}.box{width:min(620px,100%);background:#fff;border-radius:18px;padding:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:10px 0}.field input{padding:11px 12px;border:1px solid #dbe2ea;border-radius:10px;font:inherit}.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rolecheck{border:1px solid #e5e7eb;border-radius:10px;padding:10px;display:flex;gap:8px;align-items:flex-start}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}@media(max-width:700px){.grid2,.rolegrid{grid-template-columns:1fr}}</style></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">A4</span><div>A4PRINT<br><small>HUB</small></div></div><nav><a href="./index.html">🏠 Главная</a><a href="./orders.html">🛒 Заказы</a><a href="./customers.html">👥 Клиенты</a><a href="./warehouse.html">📦 Склад</a><a href="./documents.html">📁 Документы</a><a class="active" href="./users.html">🔐 Пользователи</a></nav></aside><main class="main"><header class="topbar"><div><h1>Пользователи и права</h1><p>Создание сотрудников и назначение ролей доступа</p></div><div class="user"><button id="logout" class="btn secondary">Выйти</button></div></header><section class="panel"><div class="toolbar"><div><b>Сотрудники</b><div class="muted">Управление выполняется только администратором</div></div><button id="newUser" class="btn">+ Добавить пользователя</button></div><div id="list" class="muted">Загрузка...</div></section></main><div id="modal" class="modal"><form id="form" class="box"><h2 id="modalTitle">Новый пользователь</h2><input id="userId" type="hidden"><div class="grid2"><label class="field">ФИО<input id="fullName" required></label><label class="field">Телефон<input id="phone"></label></div><label class="field">Email<input id="email" type="email" required></label><label class="field">Пароль<input id="password" type="password" minlength="6" placeholder="Минимум 6 символов"></label><div class="field"><b>Роли доступа</b><div id="roles" class="rolegrid"></div></div><label class="field" id="activeWrap" style="display:none"><span><input id="active" type="checkbox" checked> Пользователь активен</span></label><div id="formError" style="color:#b91c1c;font-size:13px"></div><div class="actions"><button type="button" id="cancel" class="btn secondary">Отмена</button><button class="btn" id="save">Сохранить</button></div></form></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.A4PRINT_CONFIG||{},supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id);let session,roles=[],users=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){const r=await fetch(cfg.apiBaseUrl+path,{...opt,headers:{Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||'Ошибка API');return d}async function init(){const s=await supabase.auth.getSession();session=s.data.session;if(!session)return location.replace('./login.html');const{data:isAdmin,error}=await supabase.rpc('has_role',{required_role:'ADMIN'});if(error||!isAdmin){alert('Только администратор может управлять пользователями.');return location.replace('./index.html')}await load()}async function load(){const[r,u]=await Promise.all([api('/api/v1/users/roles'),api('/api/v1/users')]);roles=r.roles||[];users=u.users||[];render()}function render(){if(!users.length)return $('list').innerHTML='<div class="muted">Пользователей нет</div>';$('list').innerHTML=`<table class="table"><thead><tr><th>Пользователь</th><th>Роли</th><th>Статус</th><th></th></tr></thead><tbody>${users.map(u=>`<tr><td><b>${esc(u.full_name)}</b><div class="muted">${esc(u.email||'')}</div><div class="muted">${esc(u.phone||'')}</div></td><td><div class="roles">${(u.roles||[]).map(r=>`<span class="role">${esc(r.name)}</span>`).join('')}</div></td><td><span class="status ${u.is_active?'on':'off'}">${u.is_active?'Активен':'Отключён'}</span></td><td><button class="btn secondary" data-edit="${u.id}">Изменить</button></td></tr>`).join('')}</tbody></table>`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit))}function drawRoles(selected=[]){const set=new Set(selected);$('roles').innerHTML=roles.map(r=>`<label class="rolecheck"><input type="checkbox" value="${r.id}" ${set.has(r.id)?'checked':''}><span><b>${esc(r.name)}</b><div class="muted">${esc(r.description||'')}</div></span></label>`).join('')}function openNew(){$('form').reset();$('userId').value='';$('modalTitle').textContent='Новый пользователь';$('email').disabled=false;$('password').required=true;$('activeWrap').style.display='none';drawRoles();$('modal').classList.add('open')}function openEdit(id){const u=users.find(x=>x.id===id);if(!u)return;$('form').reset();$('userId').value=u.id;$('modalTitle').textContent='Изменить пользователя';$('fullName').value=u.full_name||'';$('phone').value=u.phone||'';$('email').value=u.email||'';$('email').disabled=true;$('password').required=false;$('password').placeholder='Оставьте пустым, чтобы не менять';$('active').checked=u.is_active!==false;$('activeWrap').style.display='block';drawRoles((u.roles||[]).map(r=>r.id));$('modal').classList.add('open')}function selectedRoles(){return[...$('roles').querySelectorAll('input:checked')].map(x=>x.value)}$('newUser').onclick=openNew;$('cancel').onclick=()=>$('modal').classList.remove('open');$('form').onsubmit=async e=>{e.preventDefault();$('formError').textContent='';const id=$('userId').value,role_ids=selectedRoles();if(!role_ids.length)return $('formError').textContent='Выберите хотя бы одну роль.';const body={full_name:$('fullName').value.trim(),phone:$('phone').value.trim(),role_ids};if(!id){body.email=$('email').value.trim();body.password=$('password').value}else{body.is_active=$('active').checked;if($('password').value)body.password=$('password').value}try{$('save').disabled=true;await api(id?'/api/v1/users/'+id:'/api/v1/users',{method:id?'PATCH':'POST',body:JSON.stringify(body)});$('modal').classList.remove('open');await load()}catch(e){$('formError').textContent=e.message}finally{$('save').disabled=false}};$('logout').onclick=async()=>{await supabase.auth.signOut();location.replace('./login.html')};init().catch(e=>{$('list').textContent=e.message});</script></body></html>
