<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЦУИМ Доставка — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css?v=20260923-delivery1"><link rel="stylesheet" href="./human-light-ui.css?v=20260922-3"><script src="./config.js?v=20260923-delivery1"></script><style>.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}.box{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:grid;gap:5px;font-size:13px;color:#475569}.form .full{grid-column:1/-1}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid #dbe3ee;border-radius:10px;font:inherit}.form textarea{min-height:72px}.delivery{padding:14px 0;border-bottom:1px solid #eef2f7}.delivery:last-child{border:0}.route{font-weight:900}.meta{color:#64748b;font-size:13px;line-height:1.55;margin-top:5px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:11px;font-weight:900}.price{font-weight:900}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.msg{font-size:13px;margin-top:10px;color:#64748b}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.form{grid-template-columns:1fr}.form .full{grid-column:auto}.sidebar{display:none}.main{margin-left:0!important}}.delivery-loading-list{display:grid;gap:10px}.delivery-loading-list .a4-skeleton{height:86px}.delivery-error{padding:16px;border:1px solid #fecaca;background:#fff7f7;border-radius:12px;color:#991b1b}.delivery-error button{margin-top:10px}.msg.ok{color:#15803d}.msg.error{color:#b91c1c}</style></head><body><aside class="sidebar"><div class="brand"></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>🚚 ЦУИМ Доставка</h1><p>Оформление курьерской доставки менеджером A4PRINT HUB</p></div><div class="user"><span id="userEmail"></span></div></header><div class="grid"><section class="box"><div class="head"><div><h2 style="margin:0">Новая доставка</h2><div class="meta">Заявка сразу попадёт на биржу курьеров Москвы.</div></div></div><form id="form" class="form"><label class="full">Адрес забора *<input id="pickup" required placeholder="Москва, улица, дом"></label><label>Ориентир забора<input id="pickupHint" placeholder="м. ..., район ..."></label><label>Ориентир доставки<input id="deliveryHint" placeholder="м. ..., район ..."></label><label class="full">Адрес доставки *<input id="delivery" required placeholder="Москва, улица, дом, квартира/офис"></label><label>Получатель<input id="recipient" placeholder="ФИО"></label><label>Телефон получателя<input id="phone" placeholder="+7..."></label><label class="full">Что доставляем<textarea id="package" placeholder="Тираж визиток, коробка, документы..."></textarea></label><label>Оплата курьеру, ₽ *<input id="price" type="number" min="0" step="1" required></label><label>Вес, кг<input id="weight" type="number" min="0" step="0.1"></label><label>Габариты<input id="dims" placeholder="40×30×20 см"></label><label>Транспорт<select id="vehicle"><option value="">Любой</option><option value="FOOT">Пеший</option><option value="BICYCLE">Велосипед</option><option value="SCOOTER">Самокат</option><option value="CAR">Легковой автомобиль</option><option value="VAN">Фургон</option><option value="TRUCK">Грузовой</option></select></label><label>Забрать до<input id="pickupUntil" type="datetime-local"></label><label>Доставить до<input id="deliverUntil" type="datetime-local"></label><div class="full"><button class="btn" id="submit">Опубликовать в ЦУИМ Доставка</button><div id="msg" class="msg"></div></div></form></section><section class="box"><div class="head"><div><h2 style="margin:0">Мои заявки</h2><div class="meta">Заявки на доставку, созданные из рабочего кабинета.</div></div><button class="btn secondary" id="refresh">Обновить</button></div><div id="list"><div class="delivery-loading-list"><div class="a4-skeleton"></div><div class="a4-skeleton"></div><div class="a4-skeleton"></div></div></div></section></div></main><script type="module" src="./navigation.js?v=20260923-delivery1"></script><script type="module" src="./cuim-delivery.js?v=20260923-phase6-1"></script></body></html>
