<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЦУИМ Доставка — A4PRINT HUB</title><link rel="stylesheet" href="./styles.css"><script src="./config.js"></script><style>.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}.box{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:grid;gap:5px;font-size:13px;color:#475569}.form .full{grid-column:1/-1}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid #dbe3ee;border-radius:10px;font:inherit}.form textarea{min-height:72px}.delivery{padding:14px 0;border-bottom:1px solid #eef2f7}.delivery:last-child{border:0}.route{font-weight:900}.meta{color:#64748b;font-size:13px;line-height:1.55;margin-top:5px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:11px;font-weight:900}.price{font-weight:900}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.msg{font-size:13px;margin-top:10px;color:#64748b}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.form{grid-template-columns:1fr}.form .full{grid-column:auto}.sidebar{display:none}.main{margin-left:0!important}}</style></head><body><aside class="sidebar"><div class="brand"></div><nav></nav></aside><main class="main"><header class="topbar"><div><h1>🚚 ЦУИМ Доставка</h1><p>Оформление курьерской доставки менеджером A4PRINT HUB</p></div><div class="user"><span id="userEmail"></span></div></header><div class="grid"><section class="box"><div class="head"><div><h2 style="margin:0">Новая доставка</h2><div class="meta">Заявка сразу попадёт на биржу курьеров Москвы.</div></div></div><form id="form" class="form"><label class="full">Адрес забора *<input id="pickup" required placeholder="Москва, улица, дом"></label><label>Ориентир забора<input id="pickupHint" placeholder="м. ..., район ..."></label><label>Ориентир доставки<input id="deliveryHint" placeholder="м. ..., район ..."></label><label class="full">Адрес доставки *<input id="delivery" required placeholder="Москва, улица, дом, квартира/офис"></label><label>Получатель<input id="recipient" placeholder="ФИО"></label><label>Телефон получателя<input id="phone" placeholder="+7..."></label><label class="full">Что доставляем<textarea id="package" placeholder="Тираж визиток, коробка, документы..."></textarea></label><label>Оплата курьеру, ₽ *<input id="price" type="number" min="0" step="1" required></label><label>Вес, кг<input id="weight" type="number" min="0" step="0.1"></label><label>Габариты<input id="dims" placeholder="40×30×20 см"></label><label>Транспорт<select id="vehicle"><option value="">Любой</option><option value="FOOT">Пеший</option><option value="BICYCLE">Велосипед</option><option value="SCOOTER">Самокат</option><option value="CAR">Легковой автомобиль</option><option value="VAN">Фургон</option><option value="TRUCK">Грузовой</option></select></label><label>Забрать до<input id="pickupUntil" type="datetime-local"></label><label>Доставить до<input id="deliverUntil" type="datetime-local"></label><div class="full"><button class="btn" id="submit">Опубликовать в ЦУИМ Доставка</button><div id="msg" class="msg"></div></div></form></section><section class="box"><div class="head"><div><h2 style="margin:0">Мои заявки</h2><div class="meta">Заявки на доставку, созданные из рабочего кабинета.</div></div><button class="btn secondary" id="refresh">Обновить</button></div><div id="list"><div class="meta">Загрузка…</div></div></section></div></main><script type="module">import{supabase}from'./guard.js';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])),money=x=>new Intl.NumberFormat('ru-RU').format(Number(x||0))+' ₽',labels={OPEN:'Ищем курьера',ASSIGNED:'Курьер назначен',GOING_TO_PICKUP:'Едет за заказом',PICKED_UP:'Забрал',IN_TRANSIT:'В пути',DELIVERED:'Доставлено',CANCELLED:'Отменено'};const{data:{session}}=await supabase.auth.getSession();if(session)$('userEmail').textContent=session.user.email||'';const[{data:a},{data:m}]=await Promise.all([supabase.rpc('has_role',{required_role:'ADMIN'}),supabase.rpc('has_role',{required_role:'MANAGER'})]);if(!a&&!m){document.querySelector('.main').innerHTML='<div style="padding:30px">Доступ только для администратора или менеджера.</div>';throw 0}async function load(){const{data,error}=await supabase.rpc('manager_delivery_offers');if(error){$('list').innerHTML='<div class="meta">'+esc(error.message)+'</div>';return}$('list').innerHTML=(data||[]).map(o=>`<article class="delivery"><div style="display:flex;justify-content:space-between;gap:10px"><span class="badge">${esc(labels[o.status]||o.status)}</span><span class="price">${money(o.price)}</span></div><div class="route" style="margin-top:8px">${esc(o.pickup_address)} → ${esc(o.delivery_address)}</div><div class="meta">${esc(o.package_description||'Посылка')}<br>Получатель: ${esc(o.recipient_name||'—')} · ${esc(o.recipient_phone||'—')}${o.courier_name?`<br><b>Курьер: ${esc(o.courier_name)} · ${esc(o.courier_phone||'')}</b>`:''}</div></article>`).join('')||'<div class="meta">Вы ещё не создавали заявок на доставку.</div>'}$('refresh').onclick=load;$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('msg').textContent='Публикуем…';const dt=id=>$(id).value?new Date($(id).value).toISOString():null;const{data,error}=await supabase.rpc('manager_create_courier_offer',{p_pickup_address:$('pickup').value,p_pickup_hint:$('pickupHint').value||null,p_delivery_address:$('delivery').value,p_delivery_hint:$('deliveryHint').value||null,p_recipient_name:$('recipient').value||null,p_recipient_phone:$('phone').value||null,p_package_description:$('package').value||null,p_price:Number($('price').value||0),p_weight_kg:$('weight').value?Number($('weight').value):null,p_dimensions_text:$('dims').value||null,p_vehicle_required:$('vehicle').value||null,p_pickup_until:dt('pickupUntil'),p_deliver_until:dt('deliverUntil')});$('submit').disabled=false;if(error){$('msg').textContent=error.message;return}let pushed=0;try{const{data:r,error:pe}=await supabase.functions.invoke('courier-push-notify',{body:{offer_id:data}});if(!pe)pushed=Number(r?.sent||0)}catch(e){console.warn('courier push failed',e)}$('msg').textContent='Заявка опубликована.'+(pushed?' Push отправлен: '+pushed+' курьер(ам).':' Курьеры увидят её на бирже.');$('form').reset();await load()};await load();supabase.channel('manager-delivery-live').on('postgres_changes',{event:'*',schema:'public',table:'courier_delivery_offers'},load).subscribe();</script><script src="./navigation.js"></script></body></html>
