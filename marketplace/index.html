<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Найти исполнителя — A4PRINT Marketplace</title><script>window.MARKETPLACE_CFG={url:'https://qgakliolffnwkymoqvzn.supabase.co',key:'sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'}</script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f7fb;color:#0f172a}.hero{padding:46px 20px 24px;text-align:center}.hero h1{font-size:42px;margin:0}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.searchbar,.card{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:16px}.searchbar{display:grid;grid-template-columns:1fr 260px auto;gap:10px}input,select,textarea{width:100%;padding:12px;border:1px solid #dbe3ee;border-radius:11px;font:inherit}.btn{border:0;border-radius:11px;padding:12px 16px;background:#0f172a;color:#fff;font-weight:800;cursor:pointer}.section{margin-top:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.muted{color:#64748b;font-size:13px}.price{font-size:24px;font-weight:900}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.legal-check{display:flex;gap:10px;align-items:flex-start;font-size:13px}.legal-check input{width:auto;margin-top:3px}.legal-check a,footer a{color:#174ea6}.msg{font-size:13px}.ok{color:#166534}.bad{color:#b91c1c}footer{margin:30px 0;padding:20px;text-align:center;font-size:12px;color:#64748b}@media(max-width:800px){.grid,.form-grid,.searchbar{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="hero"><h1>Найдите исполнителя за пару минут</h1><p>Сравните услуги партнёров или разместите заявку.</p></header><main class="wrap"><section class="searchbar"><input id="q" placeholder="Например: баннер, визитки, 3D-печать"><select id="category"><option value="">Все категории</option></select><button class="btn" id="searchBtn">Найти</button></section><section class="section"><h2>Услуги исполнителей</h2><div id="results" class="grid"></div></section><section class="card section"><h2>Разместить заявку</h2><form id="requestForm" class="form-grid"><div class="field"><label>Что нужно сделать *</label><input id="title" required></div><div class="field"><label>Категория</label><input id="requestCategory"></div><div class="field full"><label>Описание</label><textarea id="description" rows="4"></textarea></div><div class="field"><label>Бюджет, ₽</label><input id="budget" type="number"></div><div class="field"><label>Срок</label><input id="desiredDate" type="date"></div><div class="field"><label>Количество</label><input id="quantity" type="number"></div><div class="field"><label>Единица</label><input id="unit"></div><div class="field"><label>Ваше имя *</label><input id="customerName" required></div><div class="field"><label>Телефон</label><input id="customerPhone"></div><div class="field full"><label>Email</label><input id="customerEmail" type="email"></div><div class="field full legal-check"><input id="pdConsent" type="checkbox" required><label for="pdConsent">Я даю <a href="../legal/consent.html" target="_blank">согласие на обработку персональных данных</a> и ознакомлен(а) с <a href="../legal/privacy.html" target="_blank">Политикой обработки персональных данных</a>.</label></div><div class="field full legal-check"><input id="termsConsent" type="checkbox" required><label for="termsConsent">Я принимаю <a href="../legal/user-agreement.html" target="_blank">Пользовательское соглашение</a> и <a href="../legal/marketplace-rules.html" target="_blank">Правила Marketplace</a>.</label></div><div class="field full"><button class="btn" id="sendBtn">Разместить заявку</button><div id="msg" class="msg"></div></div></form></section><footer>ИП Шевачев Антон Леонидович · ИНН 771987330739 · ОГРНИП 325774600834216 · <a href="../legal/">Правовая информация</a></footer></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.MARKETPLACE_CFG,s=createClient(c.url,c.key),$=x=>document.getElementById(x),e=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function cats(){const{data}=await s.rpc('marketplace_categories');$('category').innerHTML='<option value="">Все категории</option>'+((data||[]).map(x=>`<option>${e(x.category)}</option>`).join(''))}async function search(){const{data,error}=await s.rpc('marketplace_search_services',{p_query:$('q').value.trim()||null,p_category:$('category').value||null});$('results').innerHTML=error?`<div class="card">${e(error.message)}</div>`:(data||[]).map(x=>`<article class="card"><h3>${e(x.name)}</h3><div class="muted">${e(x.category||'Без категории')} · ${e(x.partner_name)}</div><p>${e(x.description||'')}</p><div class="price">${Number(x.price||0).toLocaleString('ru-RU')} ₽ / ${e(x.unit||'шт')}</div><button class="btn" data-use="${e(x.name)}" data-cat="${e(x.category||'')}">Оставить заявку</button></article>`).join('')||'<div class="card">Ничего не найдено — оставьте заявку.</div>';document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{$('title').value=b.dataset.use;$('requestCategory').value=b.dataset.cat;$('requestForm').scrollIntoView({behavior:'smooth'})})}$('searchBtn').onclick=search;$('requestForm').onsubmit=async ev=>{ev.preventDefault();const b=$('sendBtn');b.disabled=true;try{const v=id=>$(id).value.trim();const{data,error}=await s.rpc('create_marketplace_request',{p_title:v('title'),p_description:v('description')||null,p_category:v('requestCategory')||null,p_budget:Number($('budget').value)||null,p_quantity:Number($('quantity').value)||null,p_unit:v('unit')||null,p_desired_date:$('desiredDate').value||null,p_customer_name:v('customerName'),p_customer_phone:v('customerPhone')||null,p_customer_email:v('customerEmail')||null});if(error)throw error;$('msg').className='msg ok';$('msg').textContent='Заявка размещена. Номер: '+String(data).slice(0,8);ev.currentTarget.reset()}catch(err){$('msg').className='msg bad';$('msg').textContent='Ошибка: '+err.message}finally{b.disabled=false}};await cats();await search();</script></body></html>
