<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Найти исполнителя — A4PRINT Marketplace</title><script>window.MARKETPLACE_CFG={url:'https://qgakliolffnwkymoqvzn.supabase.co',key:'sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'}</script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f4f7fb,#eef3f9);color:#0f172a}.hero{padding:46px 20px 24px;text-align:center}.hero h1{font-size:42px;letter-spacing:-.04em;margin:0 0 10px}.hero p{color:#64748b;font-size:17px;margin:0}.wrap{width:min(1180px,calc(100% - 32px));margin:0 auto 48px}.searchbar{display:grid;grid-template-columns:1fr 260px auto;gap:10px;background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:12px;box-shadow:0 14px 34px rgba(15,23,42,.06)}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #dbe3ee;border-radius:11px;font:inherit;background:#fff}.btn{border:0;border-radius:11px;padding:12px 16px;background:#0f172a;color:#fff;font-weight:800;cursor:pointer}.section{margin-top:22px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.head h2{margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:rgba(255,255,255,.94);border:1px solid #dfe6ef;border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(15,23,42,.05)}.card h3{margin:0 0 6px}.muted{color:#64748b;font-size:13px}.price{font-size:24px;font-weight:900;margin-top:12px}.partner{display:inline-flex;margin-top:10px;padding:5px 8px;border-radius:999px;background:#eef4ff;color:#234b8b;font-size:11px;font-weight:800}.empty{padding:30px;text-align:center;color:#94a3b8;background:#fff;border:1px dashed #cbd5e1;border-radius:16px}.request{margin-top:28px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#475569}.msg{margin-top:10px;font-size:13px}.ok{color:#166534}.bad{color:#b91c1c}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.searchbar{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero h1{font-size:32px}}</style></head><body><header class="hero"><h1>Найдите исполнителя за пару минут</h1><p>Сравните услуги партнёров или разместите заявку, чтобы исполнитель сам взял её в работу.</p></header><main class="wrap"><section class="searchbar"><input id="q" placeholder="Например: баннер 3×6, визитки, 3D-печать"><select id="category"><option value="">Все категории</option></select><button class="btn" id="searchBtn">Найти</button></section><section class="section"><div class="head"><h2>Услуги исполнителей</h2><span id="count" class="muted"></span></div><div id="results" class="grid"><div class="empty">Загрузка…</div></div></section><section class="card request"><div class="head"><div><h2>Не нашли подходящее?</h2><div class="muted">Оставьте заявку — её увидят партнёры и смогут взять в работу.</div></div></div><form id="requestForm" class="form-grid"><div class="field"><label>Что нужно сделать *</label><input id="title" required placeholder="Например: печать 200 буклетов"></div><div class="field"><label>Категория</label><input id="requestCategory"></div><div class="field full"><label>Описание</label><textarea id="description" rows="4" placeholder="Размеры, материал, тираж, требования"></textarea></div><div class="field"><label>Бюджет, ₽</label><input id="budget" type="number" min="0" step="0.01"></div><div class="field"><label>Желаемый срок</label><input id="desiredDate" type="date"></div><div class="field"><label>Количество</label><input id="quantity" type="number" min="0" step="0.001"></div><div class="field"><label>Единица</label><input id="unit" placeholder="шт, м², заказ"></div><div class="field"><label>Ваше имя *</label><input id="customerName" required></div><div class="field"><label>Телефон</label><input id="customerPhone" type="tel"></div><div class="field full"><label>Email</label><input id="customerEmail" type="email"></div><div class="field full"><button class="btn" id="sendBtn">Разместить заявку</button><div id="msg" class="msg"></div></div></form></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.MARKETPLACE_CFG,s=createClient(cfg.url,cfg.key),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));async function cats(){const{data}=await s.rpc('marketplace_categories');$('category').innerHTML='<option value="">Все категории</option>'+((data||[]).map(x=>`<option>${esc(x.category)}</option>`).join(''))}async function search(){ $('results').innerHTML='<div class="empty">Ищем…</div>';const{data,error}=await s.rpc('marketplace_search_services',{p_query:$('q').value.trim()||null,p_category:$('category').value||null});if(error){$('results').innerHTML=`<div class="empty">Ошибка: ${esc(error.message)}</div>`;return}const rows=data||[];$('count').textContent=`${rows.length} предложений`;$('results').innerHTML=rows.map(x=>`<article class="card"><h3>${esc(x.name)}</h3><div class="muted">${esc(x.category||'Без категории')}${x.sku?` · ${esc(x.sku)}`:''}</div>${x.description?`<p class="muted">${esc(x.description)}</p>`:''}<div class="price">${Number(x.price||0).toLocaleString('ru-RU')} ₽ <span class="muted">/ ${esc(x.unit||'шт')}</span></div><div class="partner">${esc(x.partner_name)}</div><button class="btn" style="margin-top:12px;width:100%" data-use="${esc(x.name)}" data-cat="${esc(x.category||'')}">Оставить заявку</button></article>`).join('')||'<div class="empty">По вашему запросу пока ничего не найдено. Оставьте заявку ниже.</div>';document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{$('title').value=b.dataset.use;$('requestCategory').value=b.dataset.cat;document.querySelector('.request').scrollIntoView({behavior:'smooth'})})}$('searchBtn').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('requestForm').onsubmit=async e=>{e.preventDefault();const b=$('sendBtn');b.disabled=true;b.textContent='Отправляем…';$('msg').textContent='';const val=id=>$(id).value.trim();try{const{data,error}=await s.rpc('create_marketplace_request',{p_title:val('title'),p_description:val('description')||null,p_category:val('requestCategory')||null,p_budget:Number($('budget').value)||null,p_quantity:Number($('quantity').value)||null,p_unit:val('unit')||null,p_desired_date:$('desiredDate').value||null,p_customer_name:val('customerName'),p_customer_phone:val('customerPhone')||null,p_customer_email:val('customerEmail')||null});if(error)throw error;$('msg').className='msg ok';$('msg').textContent=`Заявка размещена. Номер: ${String(data).slice(0,8)}.`;e.currentTarget.reset()}catch(err){$('msg').className='msg bad';$('msg').textContent='Ошибка: '+err.message}finally{b.disabled=false;b.textContent='Разместить заявку'}};await cats();await search();</script></body></html>
