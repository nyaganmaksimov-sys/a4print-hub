name: Check Production Farm Phase 22

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'admin/equipment-contract-amendments.html'
      - 'admin/equipment-contract-amendment-signatures.js'
      - 'partner/equipment.html'
      - 'partner/equipment-owner-amendment-acceptance.js'
      - 'database/migrations/20260915_production_farm_contract_amendment_signature_evidence.sql'
      - 'docs/PRODUCTION_FARM_PHASE22.md'
      - '.github/workflows/check-production-farm-phase22.yml'

jobs:
  phase22-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check admin/equipment-contract-amendment-signatures.js
          node --check partner/equipment-owner-amendment-acceptance.js

      - name: Verify UI wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s admin/equipment-contract-amendment-signatures.js
          test -s partner/equipment-owner-amendment-acceptance.js
          grep -q 'equipment-contract-amendment-signatures.js?v=20260915-phase22-1' admin/equipment-contract-amendments.html
          grep -q 'equipment-owner-amendment-acceptance.js?v=20260915-phase22-1' partner/equipment.html
          grep -q 'record_equipment_contract_amendment_signature' admin/equipment-contract-amendment-signatures.js
          grep -q 'PARTNER_ACCEPTANCE_REQUIRED' admin/equipment-contract-amendment-signatures.js
          grep -q 'get_my_equipment_contract_amendments' partner/equipment-owner-amendment-acceptance.js
          grep -q 'submit_equipment_partner_response' partner/equipment-owner-amendment-acceptance.js
          grep -q 'Подтверждаю условия' partner/equipment-owner-amendment-acceptance.js

      - name: Verify database safety markers
        shell: bash
        run: |
          set -euo pipefail
          sql='database/migrations/20260915_production_farm_contract_amendment_signature_evidence.sql'
          test -s "$sql"
          grep -q 'create table if not exists public.equipment_contract_amendment_signatures' "$sql"
          grep -q 'enable row level security' "$sql"
          grep -q 'SIGNATURE_EVIDENCE_IMMUTABLE' "$sql"
          grep -q "'PORTAL_ACCEPTANCE','PAPER','EXTERNAL_ESIGN'" "$sql"
          grep -q 'EQ_CONTRACT_AMENDMENT' "$sql"
          grep -q 'PARTNER_ACCEPTANCE_REQUIRED' "$sql"
          grep -q 'SIGNATURE_REFERENCE_REQUIRED' "$sql"
          grep -q "set search_path=''" "$sql"
          grep -q 'revoke all on function public.record_equipment_contract_amendment_signature' "$sql"
          grep -q 'grant execute on function public.record_equipment_contract_amendment_signature' "$sql"
          grep -q "public.record_equipment_contract_amendment_signature(" "$sql"

      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/PRODUCTION_FARM_PHASE22.md'
          test -s "$doc"
          grep -q 'phase22_signature_evidence_ok' "$doc"
          grep -q 'ROLLBACK' "$doc"
          grep -q 'PORTAL_ACCEPTANCE' "$doc"
          grep -q 'SIGNATURE_EVIDENCE_IMMUTABLE' "$doc"
          grep -q 'не называет портальное подтверждение квалифицированной электронной подписью' "$doc"
