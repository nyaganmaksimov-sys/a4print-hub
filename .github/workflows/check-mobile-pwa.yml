name: Check Mobile PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'admin/login.html'
      - 'admin/login.js'
      - 'admin/mobile-auth-route.js'
      - 'admin/profile.html'
      - 'admin/profile.js'
      - 'admin/manager.html'
      - 'admin/manager-runtime.js'
      - 'admin/mobile-shell.*'
      - 'admin/config.js'
      - 'admin/guard.js'
      - 'admin/auth-ui.js'
      - 'admin/chat-watchdog.js'
      - 'admin/chat-modern.js'
      - 'admin/messages.html'
      - 'admin/support.html'
      - 'admin/support.js'
      - 'admin/support-access.js'
      - 'admin/onboarding.js'
      - 'api/src/mobile-proxy.js'
      - 'database/migrations/101_staff_profile_avatar_self_service.sql'
      - 'a4print-hub-sw.js'
      - '.github/workflows/check-mobile-pwa.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check mobile/oauth-bridge.js
          node --check mobile/app-v3.js
          node --check mobile/quick-menu.js
          node --check mobile/pwa.js
          node --check mobile/updates-client.js
          node --check admin/login.js
          node --check admin/mobile-auth-route.js
          node --check admin/profile.js
          node --check admin/manager-runtime.js
          node --check admin/mobile-shell.js
          node --check admin/chat-watchdog.js
          node --check admin/chat-modern.js
          node --check admin/guard.js
          node --check admin/auth-ui.js
          node --check admin/support.js
          node --check admin/support-access.js
          node --check admin/onboarding.js
          node --check api/src/mobile-proxy.js
          node --check a4print-hub-sw.js

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('mobile/manifest.webmanifest','utf8')); console.log('manifest ok')"
          node -e "JSON.parse(require('fs').readFileSync('mobile/updates.json','utf8')); console.log('updates ok')"

      - name: Verify mobile entrypoint
        run: |
          grep -q 'manifest.webmanifest' mobile/index.html
          grep -q 'oauth-bridge.js' mobile/index.html
          grep -q 'app-v3.js' mobile/index.html
          grep -q 'quick-menu.js' mobile/index.html
          grep -q 'pwa.js' mobile/index.html
          grep -q '/admin/orders.html?status=NEW&mobile=1' mobile/index.html
          grep -q '/admin/messages.html?app=1' mobile/index.html
          grep -q '/admin/customers.html?mobile=1' mobile/index.html
          grep -q '/mobile/account.html' mobile/index.html
          grep -q '/admin/profile.html?mobile=1' mobile/account.html
          grep -q 'enforceSupportRole' mobile/pwa.js
          grep -q '/admin/support.html?mobile=1' mobile/pwa.js

      - name: Verify direct mobile auth routing
        run: |
          grep -q 'auth/v1/authorize' mobile/oauth-bridge.js
          grep -q "new URL('/mobile/'" mobile/oauth-bridge.js
          grep -q 'redirect_to' mobile/oauth-bridge.js
          ! grep -q "new URL('/admin/login.html'" mobile/oauth-bridge.js
          grep -q 'startProvider' admin/mobile-auth-route.js
          grep -q 'location.replace(auth.href)' admin/mobile-auth-route.js
          grep -q "location.replace('/mobile/'" admin/mobile-auth-route.js
          grep -q 'mobile-auth-route.js' admin/login.html
          grep -q 'finishOAuth' mobile/app-v3.js
          grep -q 'access_token' mobile/app-v3.js
          grep -q 'grant_type=password' mobile/app-v3.js
          ! grep -q 'a4printhub://auth/callback' mobile/auth-callback.html

      - name: Verify resilient desktop login
        run: |
          grep -q 'signInWithPassword' admin/login.js
          grep -q 'signInWithOAuth' admin/login.js
          grep -q 'get_my_staff_profile' admin/login.js
          grep -q 'A4SupabaseFetch' admin/login.js
          grep -q 'A4SupabaseFetch' admin/guard.js
          grep -q 'A4SupabaseFetch' admin/config.js
          grep -q '/api/v1/supabase' admin/config.js
          grep -q "'/api/v1/supabase'" api/src/mobile-proxy.js
          grep -q 'vendor/supabase.js' admin/login.html
          grep -q 'login.js?v=20260905-netfix1' admin/login.html
          ! grep -q 'cdn.jsdelivr.net/npm/@supabase/supabase-js' admin/login.js
          ! grep -q 'sb-qgakliolffnwkymoqvzn-auth-token' admin/login.js

      - name: Verify Google auth provider
        shell: bash
        run: |
          set -euo pipefail
          KEY='sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'
          curl -fsS --max-time 20 -H "apikey: $KEY" 'https://qgakliolffnwkymoqvzn.supabase.co/auth/v1/settings' -o /tmp/auth-settings.json
          node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/auth-settings.json','utf8')); if(s.external?.google!==true){console.error(s); process.exit(1)}; console.log('Google OAuth provider enabled')"
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' 'https://qgakliolffnwkymoqvzn.supabase.co/auth/v1/authorize?provider=google&redirect_to=https%3A%2F%2Fa4print-hub.ru%2Fmobile%2F')
          test "$code" = "302" || test "$code" = "303"

      - name: Verify self-service profile
        run: |
          grep -q 'staff-avatars' admin/profile.js
          grep -q 'update_my_staff_profile' admin/profile.js
          grep -q 'update_my_staff_avatar' admin/profile.js
          grep -q 'changePassword' admin/profile.js
          grep -q 'changeEmail' admin/profile.js
          grep -q 'staff-avatars' database/migrations/101_staff_profile_avatar_self_service.sql
          grep -q 'on_auth_user_email_updated' database/migrations/101_staff_profile_avatar_self_service.sql

      - name: Verify core mobile admin pages
        run: |
          for f in admin/orders.html admin/order.html admin/customers.html admin/customer.html; do
            grep -q './config.js' "$f"
            grep -q './guard.js' "$f"
          done
          grep -q './config.js?v=20260905-4' admin/manager.html
          grep -q 'manager-runtime.js?v=20260905-4' admin/manager.html
          grep -q 'a4print_mobile_access' admin/manager-runtime.js
          ! grep -q "import {supabase} from './guard.js'" admin/manager.html
          grep -q 'mobile-shell.js' admin/config.js
          grep -q 'mobile-shell.js' admin/chat-watchdog.js

      - name: Verify background Push
        run: |
          grep -q "addEventListener('push'" a4print-hub-sw.js
          grep -q 'pushManager.subscribe' mobile/pwa.js
          grep -q 'push_subscriptions' mobile/pwa.js

      - name: Mobile PWA smoke result
        run: echo 'A4PRINT HUB mobile PWA smoke checks passed.'
