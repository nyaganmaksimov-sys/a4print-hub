name: Build A4PRINT KASSA Desktop

permissions:
  contents: write

on:
  pull_request:
    paths:
      - 'desktop-kassa/**'
      - '.github/workflows/build-kassa-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop-kassa/**'
      - '.github/workflows/build-kassa-desktop.yml'
  workflow_dispatch:

jobs:
  desktop-build:
    name: desktop-build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-kassa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate desktop sources
        run: npm run check
      - name: Build Windows installer
        run: npm run dist:win
      - name: Verify updater metadata
        shell: pwsh
        run: |
          if (-not (Test-Path release/latest.yml)) { throw 'latest.yml was not generated' }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: A4PRINT-KASSA-Windows
          path: |
            desktop-kassa/release/*.exe
            desktop-kassa/release/latest.yml
            desktop-kassa/release/*.blockmap
            desktop-kassa/update-notes.json
          if-no-files-found: error
      - name: Publish stable updater channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = 'kassa-desktop'
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo ${{ github.repository }} --title "A4PRINT KASSA $version" --notes "Стабильный канал автоматических обновлений A4PRINT KASSA."
          } else {
            gh release edit $tag --repo ${{ github.repository }} --title "A4PRINT KASSA $version"
          }
          gh release upload $tag release/*.exe release/latest.yml release/*.blockmap update-notes.json --clobber --repo ${{ github.repository }}
