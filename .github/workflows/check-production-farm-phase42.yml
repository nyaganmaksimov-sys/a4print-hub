name: Check Production Farm Phase 42

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'database/migrations/20260918_production_farm_equipment_composition_annex.sql'
      - 'admin/equipment-contract-amendments.html'
      - 'admin/equipment-contract-amendments.js'
      - 'admin/equipment-contract-composition.js'
      - 'partner/equipment-owner-contract-amendments.js'
      - 'partner/equipment-owner-amendment-acceptance.js'
      - 'docs/PRODUCTION_FARM_PHASE42.md'
      - '.github/workflows/check-production-farm-phase42.yml'

jobs:
  phase42-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check admin/equipment-contract-amendments.js
          node --check admin/equipment-contract-composition.js
          node --check partner/equipment-owner-contract-amendments.js
          node --check partner/equipment-owner-amendment-acceptance.js

      - name: Verify composition annex migration
        shell: bash
        run: |
          set -euo pipefail
          sql='database/migrations/20260918_production_farm_equipment_composition_annex.sql'
          test -s "$sql"

          grep -q 'EQUIPMENT_COMPOSITION' "$sql"
          grep -q 'create_equipment_composition_amendment' "$sql"
          grep -q 'equipment_contract_amendment_assets' "$sql"
          grep -q 'equipment_composition' "$sql"

          grep -q 'ACTIVE_CONTRACT_EQUIPMENT_CHANGE_REQUIRES_NEW_ANNEX' "$sql"
          grep -q 'EQUIPMENT_CONTRACT_PERIOD_OVERLAP' "$sql"
          grep -q 'EQUIPMENT_CONTRACT_PERIOD_CONFLICT' "$sql"

          grep -q 'app.equipment_contract_amendment_apply' "$sql"
          grep -q 'app.equipment_contract_initial_composition_save' "$sql"
          grep -q 'app.equipment_contract_termination_finalize' "$sql"

          grep -q 'source_amendment_id' "$sql"
          grep -q 'ended_by_amendment_id' "$sql"
          grep -q 'effective_end_date' "$sql"
          grep -q 'count(DISTINCT ca.equipment_id)' "$sql"
          grep -q 'security_invoker=true' "$sql"

          grep -q 'assert_production_farm_security_baseline' "$sql"
          grep -q 'assert_equipment_contract_child_tenant' "$sql"
          grep -q 'current_partner_id()' "$sql"
          grep -q 'EQUIPMENT_CONTRACT_ENTITY_NOT_AVAILABLE' "$sql"

      - name: Verify UI wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'equipment-contract-composition.js' admin/equipment-contract-amendments.html
          grep -q 'Изменить состав' admin/equipment-contract-composition.js
          grep -q 'create_equipment_composition_amendment' admin/equipment-contract-composition.js
          grep -q 'equipment_add' admin/equipment-contract-amendments.js
          grep -q 'equipment_remove' partner/equipment-owner-contract-amendments.js
          grep -q 'EQUIPMENT_COMPOSITION' partner/equipment-owner-amendment-acceptance.js

      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/PRODUCTION_FARM_PHASE42.md'
          test -s "$doc"
          grep -q 'phase42_equipment_composition_annex_ok' "$doc"
          grep -q 'phase42_temporal_termination_scope_ok' "$doc"
          grep -q 'phase42_cross_contract_period_guard_ok' "$doc"
          grep -q 'phase42_partner_portal_acceptance_ok' "$doc"
          grep -q 'BEGIN ... ROLLBACK' "$doc"
          grep -q 'ACTIVE_CONTRACT_EQUIPMENT_CHANGE_REQUIRES_NEW_ANNEX' "$doc"
          grep -q 'EQUIPMENT_CONTRACT_PERIOD_CONFLICT' "$doc"
          grep -q 'Phase 43' "$doc"
