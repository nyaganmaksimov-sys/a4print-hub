name: Check Kassa 2

on:
  push:
    branches: [main]
    paths:
      - 'kassa/**'
      - 'desktop-kassa/**'
      - 'desktop-kassa/**'
      - 'api/src/moysklad.js'
      - 'api/src/moysklad-shift-sanity.js'
      - 'api/src/shift-debug.js'
      - 'api/src/pos-shift-live-patch.js'
      - 'api/src/pos-shift-fresh-open.js'
      - 'api/src/pos-sale-idempotency.js'
      - 'api/src/pos-cash-operations.js'
      - 'api/src/boot.js'
      - 'api/src/pos-build-marker.js'
      - 'database/migrations/107_pos_sale_idempotency.sql'
      - 'database/migrations/110_pos_cash_operations.sql'
      - '.github/workflows/check-kassa2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kassa/**'
      - 'desktop-kassa/**'
      - 'api/src/moysklad.js'
      - 'api/src/moysklad-shift-sanity.js'
      - 'api/src/shift-debug.js'
      - 'api/src/pos-shift-live-patch.js'
      - 'api/src/pos-shift-fresh-open.js'
      - 'api/src/pos-sale-idempotency.js'
      - 'api/src/pos-cash-operations.js'
      - 'api/src/boot.js'
      - 'api/src/pos-build-marker.js'
      - 'database/migrations/107_pos_sale_idempotency.sql'
      - 'database/migrations/110_pos_cash_operations.sql'
      - '.github/workflows/check-kassa2.yml'
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check kassa/app.js
          node --check kassa/modules.js
          node --check kassa/ui.js
          node --check kassa/db.js
          node --check kassa/sw.js
          node --check kassa/bootstrap.js
          node --check kassa/network-safety.js
          node --check kassa/shift-session-gate.js
          node --check kassa/sync-throttle.js
          node --check kassa/shift-operator.js
          node --check kassa/shift-state-sync.js
          node --check kassa/cash-operations.js
          node --check kassa/startup-shift.js
          node --check kassa/sale-submit-guard.js
          node --check kassa/sale-finish.js
          node --check kassa/return-finish.js
          node --check kassa/history-hub.js
          node --check kassa/held-receipts.js
          node --check kassa/report-source-summary.js
          node --check kassa/settings-help.js
          node --check kassa/sale-view-fix.js
          node --check kassa/runtime-stability.js
          node --check kassa/desktop-updater.js
          node --check kassa/order-entry-menu.js
          node --check desktop-kassa/main.js
          node --check desktop-kassa/preload.js
          node desktop-kassa/scripts/prepare-web.js
          node --check api/src/moysklad.js
          node --check api/src/moysklad-shift-sanity.js
          node --check api/src/pos-shift-live-patch.js
          node --check api/src/pos-shift-fresh-open.js
          node --check api/src/pos-sale-idempotency.js
          node --check api/src/pos-cash-operations.js
          node --check api/src/boot.js
          node --check api/src/pos-build-marker.js
      - name: Check Kassa shell
        run: |
          test -f kassa/index.html
          test -f kassa/styles.css
          test -f kassa/modules.css
          test -f kassa/modules.js
          test -f kassa/ui.js
          test -f kassa/network-safety.js
          test -f kassa/shift-layout-fix.css
          test -f kassa/shift-session-gate.js
          test -f kassa/sync-throttle.js
          test -f kassa/shift-state-sync.js
          test -f kassa/cash-operations.js
          test -f kassa/startup-shift.js
          test -f kassa/settings-help.js
          test -f kassa/runtime-stability.js
          test -f kassa/desktop-updater.js
          test -f kassa/order-entry-menu.js
          test -f kassa/order-entry-menu.css
          test -f kassa/manifest.webmanifest
          test -f desktop-kassa/main.js
          test -f desktop-kassa/splash.html
          test -f desktop-kassa/package.json
          test -f desktop-kassa/update-notes.json
          test -f desktop-kassa/scripts/prepare-web.js
          test -f desktop-kassa/web/kassa/index.html
          test -f desktop-kassa/web/admin/vendor/supabase.js
          grep -q 'TRANSIENT_LOAD_CODES' desktop-kassa/main.js
          grep -q 'RETRY_DELAYS' desktop-kassa/main.js
          grep -q 'auto-retry' desktop-kassa/main.js
          grep -q 'electron-updater' desktop-kassa/main.js
          grep -q 'a4-kassa:update:check' desktop-kassa/main.js
          grep -q 'quitAndInstall' desktop-kassa/main.js
          grep -q 'startLocalKassaServer' desktop-kassa/main.js
          grep -q 'pathToFileURL' desktop-kassa/main.js
          grep -q 'a4-kassa-logo.webp' desktop-kassa/main.js
          grep -q 'brandLogo' desktop-kassa/splash.html
          grep -q 'navCreateOrder' kassa/order-entry-menu.js
          grep -q 'Печати и штампы' kassa/order-entry-menu.js
          grep -q 'MEMORIAL' kassa/order-entry-menu.js
          grep -q 'SOUVENIR' kassa/order-entry-menu.js
          grep -q 'TYPOGRAPHY' kassa/order-entry-menu.js
          grep -q 'A4KassaStampOrders' kassa/stamp-orders.js
          grep -q 'A4KassaPartnerOrders' kassa/partner-orders.js
          ! grep -q 'navStampOrder' kassa/stamp-orders.js
          ! grep -q 'navPartnerOrder' kassa/partner-orders.js
          grep -q '127.0.0.1' desktop-kassa/main.js
          grep -q 'prepare:web' desktop-kassa/package.json
          grep -q 'extraResources' desktop-kassa/package.json
          grep -q 'stamp-nav-icon' kassa/stamp-orders.js
          grep -q 'a4-kassa-logo.webp' kassa/index.html
          grep -q 'updater:Object.freeze' desktop-kassa/preload.js
          grep -q 'desktop-updater.js' kassa/bootstrap.js
          grep -q 'Перезапустить и установить' kassa/desktop-updater.js
          grep -q '2.1.5' desktop-kassa/package.json
          node -e "const p=require('./desktop-kassa/package.json'),n=require('./desktop-kassa/update-notes.json');if(p.version!==n.version)throw new Error('release notes version mismatch')"
          grep -q 'Что нового' kassa/desktop-updater.js
          grep -q 'showWhatsNew' desktop-kassa/main.js
          test ! -e kassa/shift-live.js
          test ! -e api/src/shift-debug.js
          test -f api/src/pos-shift-live-patch.js
          test -f api/src/pos-shift-fresh-open.js
          test -f api/src/pos-sale-idempotency.js
          test -f api/src/pos-cash-operations.js
          test -f database/migrations/107_pos_sale_idempotency.sql
          test -f database/migrations/110_pos_cash_operations.sql
          grep -q 'A4PRINT KASSA' kassa/index.html
          grep -q 'A4PRINT KASSA 2.1' kassa/manifest.webmanifest
          grep -q 'Отложенные чеки' kassa/index.html
          grep -q 'Возвраты' kassa/index.html
          grep -q 'Отчёты и статистика' kassa/index.html
          grep -q '/api/v1/pos/returns' kassa/modules.js
          grep -q 'pos_dashboard' kassa/modules.js
          grep -q 'a4_kassa_catalog_mode' kassa/ui.js
          grep -q 'IndexedDB\|indexedDB' kassa/db.js
          grep -q "DB.put('queue'" kassa/app.js
          grep -q 'syncQueue' kassa/app.js
          grep -q 'serviceWorker.register' kassa/app.js
          grep -q 'client_operation_id' kassa/app.js
          grep -q 'network-safety.js' kassa/bootstrap.js
          grep -q 'network-safety.js' kassa/sw.js
          grep -q 'AbortController' kassa/network-safety.js
          grep -q 'READ_TIMEOUT=6500' kassa/network-safety.js
          grep -q 'WRITE_TIMEOUT=14000' kassa/network-safety.js
          grep -q "RENDER='https://a4print-hub-api.onrender.com'" kassa/network-safety.js
          grep -q 'readWithFailover' kassa/network-safety.js
          grep -q 'isIdempotentWrite' kassa/network-safety.js
          grep -q 'shift-session-gate.js' kassa/bootstrap.js
          grep -q 'shift-layout-fix.css' kassa/bootstrap.js
          grep -q 'sync-throttle.js' kassa/bootstrap.js
          grep -q 'sync-throttle.js' kassa/sw.js
          grep -q 'nextDelay=60000' kassa/sync-throttle.js
          grep -q 'shift-state-sync.js' kassa/bootstrap.js
          grep -q 'cash-operations.js' kassa/bootstrap.js
          grep -q 'cash-operations.js' kassa/sw.js
          grep -q '/api/v1/pos/cashout' kassa/cash-operations.js
          grep -q 'Изъять деньги' kassa/cash-operations.js
          grep -q 'Наличные в кассе' kassa/report-source-summary.js
          grep -q 'startup-shift.js' kassa/bootstrap.js
          grep -q 'startup-shift.js' kassa/sw.js
          grep -q 'runtime-stability.js' kassa/bootstrap.js
          grep -q 'runtime-stability.js' kassa/sw.js
          grep -q 'closeRouteOverlays' kassa/runtime-stability.js
          grep -q 'local queue write failed' kassa/runtime-stability.js
          grep -q 'sale.click()' kassa/startup-shift.js
          grep -q 'app.hidden' kassa/startup-shift.js
          grep -q 'manualRequired' kassa/shift-session-gate.js
          grep -q 'a4:kassa-shift' kassa/shift-session-gate.js
          grep -q 'SHIFT_NOT_OPEN' kassa/shift-operator.js
          grep -q 'overflow-y:auto' kassa/shift-layout-fix.css
          ! grep -q "loadScript('./shift-live.js')" kassa/bootstrap.js
          grep -q 'status.summary' kassa/ui.js
          ! grep -q "rpc('pos_shift_summary'" kassa/ui.js
          grep -q '120000' kassa/ui.js
          ! grep -Eq 'new[[:space:]]+MutationObserver|MutationObserver[[:space:]]*\(' kassa/shift-state-sync.js
          grep -q 'setInterval(sync,30000)' kassa/shift-state-sync.js
          grep -q 'latestOpenShift' api/src/moysklad.js
          grep -q 'cashSum' api/src/moysklad.js
          grep -q 'noCashSum' api/src/moysklad.js
          grep -q 'qrSum' api/src/moysklad.js
          grep -q 'pos-shift-live-patch.js' api/src/boot.js
          grep -q 'liveShift' api/src/pos-shift-live-patch.js
          grep -q 'hubFallback' api/src/pos-shift-live-patch.js
          grep -q '/api/v1/pos/shift' api/src/pos-shift-live-patch.js
          grep -q 'pos-shift-fresh-open.js' api/src/boot.js
          grep -q 'closeStaleOpenShift' api/src/pos-shift-fresh-open.js
          grep -q 'pos-sale-idempotency.js' api/src/boot.js
          grep -q 'SALE_SYNC_IN_PROGRESS' api/src/pos-sale-idempotency.js
          grep -q 'A4OP:' api/src/pos-sale-idempotency.js
          grep -q 'pos_sale_operations' database/migrations/107_pos_sale_idempotency.sql
          grep -q 'pos-cash-operations.js' api/src/boot.js
          grep -q '/api/v1/pos/cashout' api/src/pos-cash-operations.js
          grep -q 'retaildrawercashout' api/src/pos-cash-operations.js
          grep -q 'pos_cash_operations' database/migrations/110_pos_cash_operations.sql
          grep -q 'moysklad-shift-sanity.js' api/src/boot.js
          grep -q 'Europe/Moscow' api/src/moysklad-shift-sanity.js
          grep -q 'RENDER_GIT_COMMIT' api/src/pos-build-marker.js
          grep -q 'cashOperations:true' api/src/pos-build-marker.js
          grep -q 'receiptQueueRecovery:true' api/src/pos-build-marker.js
          ! grep -q 'shift-debug.js' api/src/boot.js
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('kassa/manifest.webmanifest','utf8')); console.log('manifest ok')"

  live-backend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout change context
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect whether an API deploy is expected
        id: api-change
        shell: bash
        run: |
          set -euo pipefail
          changed=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before='${{ github.event.before }}'
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$before" || true
              fi
              files=$(git diff --name-only "$before" "$GITHUB_SHA" 2>/dev/null || git show --pretty='' --name-only "$GITHUB_SHA")
            else
              files=$(git show --pretty='' --name-only "$GITHUB_SHA")
            fi
            printf '%s\n' "$files"
            if printf '%s\n' "$files" | grep -Eq '^api/src/'; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "API source changed: $changed"

      - name: Check live backend capabilities and deployment when required
        shell: bash
        run: |
          set -euo pipefail
          url='https://a4print-hub-api.onrender.com/api/v1/pos/build'
          marker="git-${GITHUB_SHA:0:12}"
          require_marker='${{ steps.api-change.outputs.changed }}'
          for attempt in $(seq 1 45); do
            echo "Render POS build check $attempt/45 (require current commit: $require_marker)"
            code=$(curl -L -sS --max-time 20 -o /tmp/live.json -w '%{http_code}' "$url" || true)
            cat /tmp/live.json 2>/dev/null || true
            echo
            marker_ok=true
            if [ "$require_marker" = "true" ] && ! grep -q "$marker" /tmp/live.json; then
              marker_ok=false
            fi
            if [ "$code" = "200" ] \
              && [ "$marker_ok" = "true" ] \
              && grep -q '"shiftSanity":true' /tmp/live.json \
              && grep -q '"freshManualShift":true' /tmp/live.json \
              && grep -q '"shiftIdSummary":true' /tmp/live.json \
              && grep -q '"paymentBreakdown":true' /tmp/live.json \
              && grep -q '"saleIdempotency":true' /tmp/live.json \
              && grep -q '"cashOperations":true' /tmp/live.json \
              && grep -q '"receiptQueueRecovery":true' /tmp/live.json; then
              if [ "$require_marker" = "true" ]; then
                echo 'Render is running the current API commit with required capabilities.'
              else
                echo 'No API source changed; the existing live backend has all required capabilities.'
              fi
              exit 0
            fi
            sleep 8
          done
          if [ "$require_marker" = "true" ]; then
            echo 'Render did not deploy the current API commit in time.'
          else
            echo 'Live backend capabilities did not become healthy in time.'
          fi
          exit 1
