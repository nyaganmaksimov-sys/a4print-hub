name: Check Production Farm Phase 30

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'admin/equipment-condition-claim-integrity.html'
      - 'admin/equipment-condition-claim-integrity.js'
      - 'admin/equipment-condition-claim-reversals.html'
      - 'database/migrations/20260915_production_farm_claim_financial_integrity.sql'
      - 'database/migrations/20260915_production_farm_claim_financial_integrity_append_only.sql'
      - 'database/migrations/20260915_production_farm_claim_financial_integrity_function_names.sql'
      - 'database/migrations/20260915_production_farm_claim_financial_integrity_external_truth.sql'
      - 'docs/PRODUCTION_FARM_PHASE30.md'
      - '.github/workflows/check-production-farm-phase30.yml'

jobs:
  phase30-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check admin/equipment-condition-claim-integrity.js

      - name: Verify HUB wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s admin/equipment-condition-claim-integrity.html
          test -s admin/equipment-condition-claim-integrity.js
          grep -q 'equipment-condition-claim-integrity.js?v=20260915-phase30-1' admin/equipment-condition-claim-integrity.html
          grep -q 'get_equipment_condition_claim_financial_integrity' admin/equipment-condition-claim-integrity.js
          grep -q 'Контроль целостности' admin/equipment-condition-claim-reversals.html
          grep -q 'equipment-condition-claim-integrity.html' admin/equipment-condition-claim-reversals.html
          grep -q 'REVERSAL_EXTERNAL_TRANSACTION_MISSING' admin/equipment-condition-claim-integrity.js
          grep -q 'REPOST_EXTERNAL_TRANSACTION_MISSING' admin/equipment-condition-claim-integrity.js
          grep -q 'NET_EFFECT_MISMATCH' admin/equipment-condition-claim-integrity.js
          grep -q 'Только нарушения' admin/equipment-condition-claim-integrity.html
          grep -q 'Фактический net effect' admin/equipment-condition-claim-integrity.html

      - name: Verify database integrity markers
        shell: bash
        run: |
          set -euo pipefail
          sql='database/migrations/20260915_production_farm_claim_financial_integrity.sql'
          imm='database/migrations/20260915_production_farm_claim_financial_integrity_append_only.sql'
          names='database/migrations/20260915_production_farm_claim_financial_integrity_function_names.sql'
          truth='database/migrations/20260915_production_farm_claim_financial_integrity_external_truth.sql'
          test -s "$sql"; test -s "$imm"; test -s "$names"; test -s "$truth"
          grep -q 'create table if not exists public.equipment_condition_claim_financial_integrity_events' "$sql"
          grep -q 'equipment_condition_claim_financial_integrity_rows' "$sql"
          grep -q 'get_equipment_condition_claim_financial_integrity' "$sql"
          grep -q 'REVERSAL_DIRECTION_MISMATCH' "$sql"
          grep -q 'REVERSAL_ACCOUNT_MISMATCH' "$sql"
          grep -q 'REPOST_WITHOUT_REVERSAL' "$sql"
          grep -q 'REPOST_AMOUNT_MISMATCH' "$sql"
          grep -q 'NET_EFFECT_MISMATCH' "$sql"
          grep -q "set search_path=''" "$sql"
          grep -q 'revoke all on public.equipment_condition_claim_financial_integrity_events from public,anon,authenticated' "$sql"
          grep -q 'grant select on public.equipment_condition_claim_financial_integrity_events to authenticated' "$sql"
          grep -q 'CONDITION_CLAIM_FINANCIAL_INTEGRITY_EVENT_APPEND_ONLY' "$imm"
          grep -q 'emit_equipment_claim_financial_integrity_notifications' "$names"
          grep -q 'guard_equipment_claim_financial_integrity_event' "$names"
          grep -q "equipment-claim-financial-integrity-daily" "$names"
          grep -q "'30 6 \* \* \*'" "$names"
          grep -q 'revoke all on function public.emit_equipment_claim_financial_integrity_notifications() from public,anon,authenticated' "$names"
          grep -q 'REVERSAL_EXTERNAL_TRANSACTION_MISSING' "$truth"
          grep -q 'REPOST_EXTERNAL_TRANSACTION_MISSING' "$truth"
          grep -q "external_source='EQUIPMENT_CONDITION_CLAIM_REVERSAL'" "$truth"
          grep -q "external_source='EQUIPMENT_CONDITION_CLAIM_REPOST'" "$truth"
          grep -q 'actual_net' "$truth"
          grep -q "revoke all on function public.equipment_condition_claim_financial_integrity_rows() from public,anon,authenticated" "$truth"

      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/PRODUCTION_FARM_PHASE30.md'
          test -s "$doc"
          grep -q 'phase30_claim_financial_integrity_ok' "$doc"
          grep -q 'phase30_external_truth_without_audit_ok' "$doc"
          grep -q 'BEGIN ... ROLLBACK' "$doc"
          grep -q 'source-tagged' "$doc"
          grep -q 'REVERSAL_EXTERNAL_TRANSACTION_MISSING' "$doc"
          grep -q 'REPOST_EXTERNAL_TRANSACTION_MISSING' "$doc"
          grep -q 'REVERSAL_DIRECTION_MISMATCH' "$doc"
          grep -q 'NET_EFFECT_MISMATCH' "$doc"
          grep -q 'actual net effect = 200' "$doc"
          grep -q 'expected net effect = 0' "$doc"
          grep -q 'повторный вызов создал 0 дублей' "$doc"
          grep -q 'REVERSAL_AUDIT_MISSING' "$doc"
          grep -q 'residual assets = 0' "$doc"
          grep -q '06:30 UTC' "$doc"
