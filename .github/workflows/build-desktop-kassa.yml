name: Build A4PRINT KASSA Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop-kassa/**'
      - '.github/workflows/build-desktop-kassa.yml'
  push:
    branches: [main]
    paths:
      - 'desktop-kassa/**'
      - '.github/workflows/build-desktop-kassa.yml'
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-kassa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        run: npm install
      - name: Check desktop shell
        run: npm run check
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: A4PRINT-KASSA-Setup-2.1.2
          path: desktop-kassa/release/*.exe
          if-no-files-found: error
          retention-days: 14
