name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: mobile-app
        run: npm install

      - name: Create Android project
        working-directory: mobile-app
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: mobile-app
        run: npx cap sync android

      - name: Configure A4PRINT HUB deep link
        working-directory: mobile-app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          strings = Path('android/app/src/main/res/values/strings.xml')
          text = strings.read_text(encoding='utf-8')
          if 'name="custom_url_scheme"' in text:
              text = re.sub(r'<string name="custom_url_scheme">.*?</string>', '<string name="custom_url_scheme">a4printhub</string>', text)
          else:
              text = text.replace('</resources>', '    <string name="custom_url_scheme">a4printhub</string>\n</resources>')
          strings.write_text(text, encoding='utf-8')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text(encoding='utf-8')
          if 'android:scheme="@string/custom_url_scheme"' not in xml:
              deep_link = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="@string/custom_url_scheme" android:host="auth" />
                  </intent-filter>
              '''
              xml = xml.replace('</activity>', deep_link + '\n        </activity>', 1)
          manifest.write_text(xml, encoding='utf-8')
          PY

      - name: Build debug APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: A4PRINT-HUB-Android-debug
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK download
        run: |
          set -e
          APK_PATH="$PWD/mobile-app/android/app/build/outputs/apk/debug/app-debug.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p download
            cp "$APK_PATH" download/A4PRINT-HUB.apk
            git add download/A4PRINT-HUB.apk

            if git diff --cached --quiet; then
              echo "Stable APK is already current"
              exit 0
            fi

            git commit -m "Publish latest Android APK [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Could not publish stable APK after 3 attempts"
          exit 1
