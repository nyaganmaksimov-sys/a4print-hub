name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: mobile-app
        run: npm install

      - name: Create Android project
        working-directory: mobile-app
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: mobile-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: A4PRINT-HUB-Android-debug
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK download
        run: |
          mkdir -p download
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk download/A4PRINT-HUB.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/A4PRINT-HUB.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest Android APK [skip ci]"
            git push origin HEAD:main
          fi
