name: Check Production Farm Phase 24

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'admin/equipment-condition-comparisons.html'
      - 'admin/equipment-condition-comparisons.js'
      - 'admin/navigation.js'
      - 'partner/equipment.html'
      - 'partner/equipment-owner-condition-comparisons.js'
      - 'database/migrations/20260915_production_farm_condition_comparisons.sql'
      - 'docs/PRODUCTION_FARM_PHASE24.md'
      - '.github/workflows/check-production-farm-phase24.yml'

jobs:
  phase24-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check admin/equipment-condition-comparisons.js
          node --check partner/equipment-owner-condition-comparisons.js
          node --check admin/navigation.js

      - name: Verify HUB and partner wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s admin/equipment-condition-comparisons.html
          test -s admin/equipment-condition-comparisons.js
          test -s partner/equipment-owner-condition-comparisons.js
          grep -q 'equipment-condition-comparisons.js?v=20260915-phase24-1' admin/equipment-condition-comparisons.html
          grep -q 'list_equipment_condition_comparisons' admin/equipment-condition-comparisons.js
          grep -q 'resolve_equipment_condition_comparison' admin/equipment-condition-comparisons.js
          grep -q 'equipment-condition-comparisons.html.*Сверка состояния' admin/navigation.js
          grep -q 'equipment-owner-condition-comparisons.js?v=20260915-phase24-1' partner/equipment.html
          grep -q 'get_my_equipment_condition_comparisons' partner/equipment-owner-condition-comparisons.js
          grep -q 'submit_equipment_condition_comparison_response' partner/equipment-owner-condition-comparisons.js
          grep -q 'Сверка возврата' partner/equipment-owner-condition-comparisons.js

      - name: Verify database safety markers
        shell: bash
        run: |
          set -euo pipefail
          sql='database/migrations/20260915_production_farm_condition_comparisons.sql'
          test -s "$sql"
          grep -q 'create table if not exists public.equipment_condition_comparisons' "$sql"
          grep -q 'create table if not exists public.equipment_condition_comparison_responses' "$sql"
          grep -q 'EQ_CONDITION_COMPARISON' "$sql"
          grep -q 'build_equipment_condition_delta' "$sql"
          grep -q "'NO_BASELINE'" "$sql"
          grep -q "'NO_DISCREPANCY'" "$sql"
          grep -q "'OPEN'" "$sql"
          grep -q "'RESOLVED'" "$sql"
          grep -q 'new_checklist_issues' "$sql"
          grep -q 'new_defects' "$sql"
          grep -q 'COMPARISON_RESPONSE_APPEND_ONLY' "$sql"
          grep -q 'get_my_equipment_condition_comparisons' "$sql"
          grep -q 'submit_equipment_condition_comparison_response' "$sql"
          grep -q 'resolve_equipment_condition_comparison' "$sql"
          grep -q "set search_path=''" "$sql"
          grep -q 'revoke all on function public.ensure_equipment_condition_comparison' "$sql"
          grep -q 'OWNER_RESPONSIBILITY' "$sql"

      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/PRODUCTION_FARM_PHASE24.md'
          test -s "$doc"
          grep -q 'phase24_condition_comparisons_ok' "$doc"
          grep -q 'ROLLBACK' "$doc"
          grep -q 'NO_BASELINE' "$doc"
          grep -q 'NO_DISCREPANCY' "$doc"
          grep -q 'COMPARISON_RESPONSE_APPEND_ONLY' "$doc"
          grep -q 'не создаёт долг' "$doc"
          grep -q 'не создаёт ни платёж' "$doc"
