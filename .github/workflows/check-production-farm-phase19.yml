name: Check Production Farm Phase 19

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'admin/equipment.html'
      - 'admin/equipment-risk-assets.js'
      - 'admin/equipment-risk-assets.css'
      - 'database/migrations/20260915_production_farm_insurance_improvements.sql'
      - 'docs/PRODUCTION_FARM_PHASE19.md'
      - '.github/workflows/check-production-farm-phase19.yml'

jobs:
  phase19-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check admin/equipment-risk-assets.js

      - name: Verify equipment UI wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s admin/equipment-risk-assets.js
          test -s admin/equipment-risk-assets.css
          grep -q 'equipment-risk-assets.css?v=' admin/equipment.html
          grep -q 'equipment-risk-assets.js?v=' admin/equipment.html
          grep -q 'equipment_risk_overview' admin/equipment-risk-assets.js
          grep -q 'equipment_insurance_policies' admin/equipment-risk-assets.js
          grep -q 'equipment_improvements' admin/equipment-risk-assets.js
          grep -q 'Страхование и улучшения' admin/equipment-risk-assets.js

      - name: Verify database safety markers
        shell: bash
        run: |
          set -euo pipefail
          sql='database/migrations/20260915_production_farm_insurance_improvements.sql'
          test -s "$sql"
          grep -q 'create table if not exists public.equipment_insurance_policies' "$sql"
          grep -q 'create table if not exists public.equipment_improvements' "$sql"
          grep -q 'equipment_risk_overview' "$sql"
          grep -q 'security_invoker=true' "$sql"
          grep -q "public.has_permission('equipment.manage')" "$sql"
          grep -q 'equipment_insurance_notice_events' "$sql"
          grep -q 'emit_equipment_insurance_notifications' "$sql"
          grep -q 'expire_equipment_insurance_policies' "$sql"
          grep -q "set search_path=''" "$sql"
          grep -q "equipment-insurance-daily'" "$sql"
          grep -q "'15 6 \* \* \*'" "$sql"
          grep -q 'revoke all on function public.emit_equipment_insurance_notifications() from public,anon,authenticated' "$sql"

      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/PRODUCTION_FARM_PHASE19.md
          grep -q 'POLICY_EXPIRING' docs/PRODUCTION_FARM_PHASE19.md
          grep -q 'pg_cron' docs/PRODUCTION_FARM_PHASE19.md
          grep -q 'ROLLBACK' docs/PRODUCTION_FARM_PHASE19.md
