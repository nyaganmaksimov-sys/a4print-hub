name: Check Neon Cloud Staging
on:
  pull_request:
    paths:
      - 'api/cloud-staging/**'
      - '.github/workflows/check-neon-cloud-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check code and package
        run: |
          node --check api/cloud-staging/server.js
          node -e "const p=require('./api/cloud-staging/package.json');if(!p.dependencies.pg)process.exit(1)"
      - name: Check no production writes are enabled
        run: |
          grep -q 'productionTrafficEnabled: false' api/cloud-staging/server.js
          grep -q 'posSalesEnabled: false' api/cloud-staging/server.js
          grep -q 'moyskladWritesEnabled: false' api/cloud-staging/server.js
          grep -q 'STAGING_ENDPOINT_DISABLED' api/cloud-staging/server.js
      - name: Install and smoke test HTTP routes
        run: |
          set -e
          npm install --prefix api/cloud-staging --omit=dev --no-audit --no-fund
          PORT=34491 node api/cloud-staging/server.js > /tmp/staging.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          code=$(curl -s -o /tmp/response.json -w '%{http_code}' http://127.0.0.1:34491/api/v1/cloud/health)
          test "$code" = 503
          node -e "const s=require('/tmp/response.json');if(s.productionTrafficEnabled!==false||s.posSalesEnabled!==false)process.exit(1)"
          code=$(curl -s -o /tmp/blocked.json -w '%{http_code}' -X POST http://127.0.0.1:34491/api/v1/pos/sales)
          test "$code" = 503
          node -e "const s=require('/tmp/blocked.json');if(s.error!=='STAGING_ENDPOINT_DISABLED')process.exit(1)"
          code=$(curl -s -o /tmp/catalog-unready.json -w '%{http_code}' http://127.0.0.1:34491/api/v1/cloud/cuim/taxonomy)
          test "$code" = 503
          node -e "const s=require('/tmp/catalog-unready.json');if(s.error!=='CATALOG_SNAPSHOT_UNAVAILABLE')process.exit(1)"
          test -f api/cloud-staging/sql/001_cuim_taxonomy.sql
          grep -q 'enable row level security' api/cloud-staging/sql/001_cuim_taxonomy.sql
          grep -q 'a4print_cloud_probe' api/cloud-staging/sql/001_cuim_taxonomy.sql
          test -f api/cloud-staging/sql/003_synthetic_auth_probe.sql
          grep -q 'enable row level security' api/cloud-staging/sql/003_synthetic_auth_probe.sql
          grep -q 'anon' api/cloud-staging/sql/003_synthetic_auth_probe.sql || true
          node --check api/cloud-staging/scripts/neon-auth-e2e.mjs
          code=$(curl -s -o /tmp/auth-disabled.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"login":"staging_operator","password":"incorrect-password-1234"}' http://127.0.0.1:34491/api/v1/cloud/auth/password)
          test "$code" = 503
          node -e "const s=require('/tmp/auth-disabled.json');if(s.error!=='STAGING_AUTH_DISABLED')process.exit(1)"

  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Neon/Render API
        run: |
          set -euo pipefail
          url="https://a4print-neon-cloud-api-staging.onrender.com"
          code=$(curl --retry 3 --retry-delay 3 -sS --max-time 45 -o /tmp/staging-health.json -w '%{http_code}' "$url/api/v1/cloud/health")
          echo "Health HTTP $code"
          cat /tmp/staging-health.json
          test "$code" = 200
          node -e "const a=require('/tmp/staging-health.json');if(a.environment!=='TEST_ONLY'||!a.checks.database||!a.checks.neonAuthJwks||a.productionTrafficEnabled!==false||Number(a.applicationTables)<4)process.exit(1)"
      - name: Verify live CUIM catalog came from Neon
        run: |
          set -euo pipefail
          url="https://a4print-neon-cloud-api-staging.onrender.com/api/v1/cloud/cuim/taxonomy"
          code=$(curl --retry 3 --retry-delay 3 -sS --max-time 50 -o /tmp/cuim-taxonomy.json -w '%{http_code}' "$url")
          echo "Taxonomy HTTP $code"
          test "$code" = 200
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/cuim-taxonomy.json', 'utf8'));
          if (data.environment !== 'TEST_ONLY' || data.readOnly !== true || data.customerDataIncluded !== false) process.exit(1);
          if (data.counts?.sections !== 8 || data.counts?.subcategories !== 61) process.exit(2);
          if (data.catalog.sections.length !== 8 || data.catalog.subcategories.length !== 61) process.exit(3);
          for (const row of [...data.catalog.sections, ...data.catalog.subcategories]) {
            if ('cost_price' in row || 'email' in row || 'password' in row || 'active' in row) process.exit(4);
          }
          console.log('CUIM catalog snapshot: 8 sections, 61 subcategories, read-only');
          NODE
      - name: Verify staging synthetic login probe is locked after E2E
        run: |
          set -euo pipefail
          api="https://a4print-neon-cloud-api-staging.onrender.com"
          code=$(curl --retry 2 --retry-delay 2 -sS --max-time 45 -X POST -H 'Content-Type: application/json' \
            -d '{"login":"staging_operator","password":"incorrect-password-1234"}' \
            -o /tmp/closed-auth.json -w '%{http_code}' "$api/api/v1/cloud/auth/password")
          echo "Staging auth lockdown HTTP $code"
          test "$code" = 503
          node -e "const r=require('/tmp/closed-auth.json');if(r.error!=='STAGING_AUTH_DISABLED'||r.environment!=='TEST_ONLY')process.exit(1)"
      - name: Ensure real sale endpoint is disabled
        run: |
          set -euo pipefail
          url="https://a4print-neon-cloud-api-staging.onrender.com"
          code=$(curl -sS --max-time 25 -X POST -o /tmp/staging-blocked.json -w '%{http_code}' "$url/api/v1/pos/sales")
          echo "Blocked write HTTP $code"
          cat /tmp/staging-blocked.json
          test "$code" = 503
          node -e "const a=require('/tmp/staging-blocked.json');if(a.error!=='STAGING_ENDPOINT_DISABLED')process.exit(1)"
