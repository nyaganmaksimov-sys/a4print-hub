name: Neon Auth isolated end-to-end (staging #2)
on:
  pull_request:
    paths:
      - '.github/workflows/check-neon-auth-e2e.yml'
  workflow_dispatch:

concurrency:
  group: cloud-auth-e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One-time live Neon Auth proof (fake account; random password; never print)
        run: |
          set -euo pipefail
          node --check api/cloud-staging/test/neon-auth-live.mjs
          node api/cloud-staging/test/neon-auth-live.mjs
