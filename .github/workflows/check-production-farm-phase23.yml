name: Check Production Farm Phase 23

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'admin/equipment-condition-inspections.html'
      - 'admin/equipment-condition-inspections.js'
      - 'admin/navigation.js'
      - 'partner/equipment.html'
      - 'partner/equipment-owner-condition-inspections.js'
      - 'database/migrations/20260915_production_farm_equipment_condition_inspections.sql'
      - 'docs/PRODUCTION_FARM_PHASE23.md'
      - '.github/workflows/check-production-farm-phase23.yml'

jobs:
  phase23-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check admin/equipment-condition-inspections.js
          node --check partner/equipment-owner-condition-inspections.js
          node --check admin/navigation.js

      - name: Verify HUB and partner wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s admin/equipment-condition-inspections.html
          test -s admin/equipment-condition-inspections.js
          test -s partner/equipment-owner-condition-inspections.js
          grep -q 'equipment-condition-inspections.js?v=' admin/equipment-condition-inspections.html
          grep -q "list_equipment_condition_inspections" admin/equipment-condition-inspections.js
          grep -q "save_equipment_condition_inspection" admin/equipment-condition-inspections.js
          grep -q "complete_equipment_condition_inspection" admin/equipment-condition-inspections.js
          grep -q "equipment-condition-inspections.html.*Осмотры состояния" admin/navigation.js
          grep -q 'equipment-owner-condition-inspections.js?v=' partner/equipment.html
          grep -q "get_my_equipment_condition_inspections" partner/equipment-owner-condition-inspections.js
          grep -q "createSignedUrl" partner/equipment-owner-condition-inspections.js
          grep -q 'Осмотры состояния' partner/equipment-owner-condition-inspections.js

      - name: Verify database safety markers
        shell: bash
        run: |
          set -euo pipefail
          sql='database/migrations/20260915_production_farm_equipment_condition_inspections.sql'
          test -s "$sql"
          grep -q 'create table if not exists public.equipment_condition_inspections' "$sql"
          grep -q 'create table if not exists public.equipment_condition_inspection_files' "$sql"
          grep -q 'EQ_CONDITION_INSPECTION' "$sql"
          grep -q 'INSPECTION_PHOTO_REQUIRED' "$sql"
          grep -q 'COMPLETED_INSPECTION_IMMUTABLE' "$sql"
          grep -q 'COMPLETED_INSPECTION_FILES_IMMUTABLE' "$sql"
          grep -q 'RETURN_INSPECTION_REQUIRED' "$sql"
          grep -q 'get_my_equipment_condition_inspections' "$sql"
          grep -q 'current_partner_id' "$sql"
          grep -q 'hub_documents_equipment_partner_inspection_read' "$sql"
          grep -q "set search_path=''" "$sql"
          grep -q 'revoke all on function public.guard_completed_equipment_condition_inspection' "$sql"
          grep -q 'revoke all on function public.guard_equipment_termination_return_inspections' "$sql"

      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/PRODUCTION_FARM_PHASE23.md'
          test -s "$doc"
          grep -q 'phase23_condition_inspections_ok' "$doc"
          grep -q 'ROLLBACK' "$doc"
          grep -q 'RETURN_INSPECTION_REQUIRED' "$doc"
          grep -q 'COMPLETED_INSPECTION_IMMUTABLE' "$doc"
          grep -q 'hub_documents_equipment_partner_inspection_read' "$doc"
