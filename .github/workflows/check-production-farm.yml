name: Check Production Farm

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'admin/equipment-ownership.js'
      - 'admin/equipment-ownership.css'
      - 'admin/equipment-buyout.js'
      - 'admin/equipment-buyout.css'
      - 'admin/equipment-economics.js'
      - 'admin/equipment-economics.css'
      - 'admin/equipment.html'
      - 'admin/production-modern.js'
      - 'admin/production-farm-runtime.js'
      - 'admin/production-farm-runtime.css'
      - 'admin/production-farm-materials.js'
      - 'admin/production-farm-materials.css'
      - 'admin/production-farm-settlements.js'
      - 'admin/production-farm-settlements.css'
      - 'admin/production-farm-capacity.js'
      - 'admin/production-farm-capacity.css'
      - 'admin/production-farm-dispatcher.js'
      - 'admin/production-farm-dispatcher.css'
      - 'admin/production-farm-operator.js'
      - 'admin/production-farm-operator.css'
      - 'admin/production-farm-analytics.js'
      - 'admin/production-farm-analytics.css'
      - 'admin/production-farm-monitoring.js'
      - 'admin/production-farm-monitoring.css'
      - 'admin/production.html'
      - 'database/migrations/*production_farm*'
      - 'docs/PRODUCTION_FARM_PHASE*.md'
      - '.github/workflows/check-production-farm.yml'
  push:
    branches: [main]
    paths:
      - 'admin/equipment-ownership.js'
      - 'admin/equipment-ownership.css'
      - 'admin/equipment-buyout.js'
      - 'admin/equipment-buyout.css'
      - 'admin/equipment-economics.js'
      - 'admin/equipment-economics.css'
      - 'admin/equipment.html'
      - 'admin/production-modern.js'
      - 'admin/production-farm-runtime.js'
      - 'admin/production-farm-runtime.css'
      - 'admin/production-farm-materials.js'
      - 'admin/production-farm-materials.css'
      - 'admin/production-farm-settlements.js'
      - 'admin/production-farm-settlements.css'
      - 'admin/production-farm-capacity.js'
      - 'admin/production-farm-capacity.css'
      - 'admin/production-farm-dispatcher.js'
      - 'admin/production-farm-dispatcher.css'
      - 'admin/production-farm-operator.js'
      - 'admin/production-farm-operator.css'
      - 'admin/production-farm-analytics.js'
      - 'admin/production-farm-analytics.css'
      - 'admin/production-farm-monitoring.js'
      - 'admin/production-farm-monitoring.css'
      - 'admin/production.html'
      - 'database/migrations/*production_farm*'
      - 'docs/PRODUCTION_FARM_PHASE*.md'
      - '.github/workflows/check-production-farm.yml'

jobs:
  farm-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/equipment-ownership.js admin/equipment-ownership.css
            admin/equipment-buyout.js admin/equipment-buyout.css
            admin/equipment-economics.js admin/equipment-economics.css
            admin/production-modern.js
            admin/production-farm-runtime.js admin/production-farm-runtime.css
            admin/production-farm-materials.js admin/production-farm-materials.css
            admin/production-farm-settlements.js admin/production-farm-settlements.css
            admin/production-farm-capacity.js admin/production-farm-capacity.css
            admin/production-farm-dispatcher.js admin/production-farm-dispatcher.css
            admin/production-farm-operator.js admin/production-farm-operator.css
            admin/production-farm-analytics.js admin/production-farm-analytics.css
            admin/production-farm-monitoring.js admin/production-farm-monitoring.css
            admin/production.html
            database/migrations/20260914_production_farm_foundation.sql
            database/migrations/20260914_production_farm_foundation_hardening.sql
            database/migrations/20260914_production_farm_management_rpcs.sql
            database/migrations/20260914_production_farm_job_execution.sql
            database/migrations/20260914_production_farm_job_execution_clock_fix.sql
            database/migrations/20260914_production_farm_materials_costing.sql
            database/migrations/20260914_production_farm_materials_bridge.sql
            database/migrations/20260914_production_farm_material_cost_updates.sql
            database/migrations/20260914_production_farm_owner_settlements.sql
            database/migrations/20260914_production_farm_owner_settlements_hardening.sql
            database/migrations/20260914_production_farm_owner_settlements_advisor_hardening.sql
            database/migrations/20260914_production_farm_owner_settlements_acl_fix.sql
            database/migrations/20260914_production_farm_lease_buyout.sql
            database/migrations/20260914_production_farm_lease_buyout_hardening.sql
            database/migrations/20260914_production_farm_equipment_economics.sql
            database/migrations/20260914_production_farm_equipment_economics_hardening.sql
            database/migrations/20260914_production_farm_capacity_planning.sql
            database/migrations/20260914_production_farm_dispatcher.sql
            database/migrations/20260914_production_farm_operator_station.sql
            database/migrations/20260914_production_farm_oee_analytics.sql
            database/migrations/20260914_production_farm_monitoring.sql
            database/migrations/20260914_production_farm_monitoring_hardening.sql
            docs/PRODUCTION_FARM_PHASE1.md docs/PRODUCTION_FARM_PHASE2.md
            docs/PRODUCTION_FARM_PHASE3.md docs/PRODUCTION_FARM_PHASE4.md
            docs/PRODUCTION_FARM_PHASE5.md docs/PRODUCTION_FARM_PHASE6.md
            docs/PRODUCTION_FARM_PHASE7.md docs/PRODUCTION_FARM_PHASE8.md
            docs/PRODUCTION_FARM_PHASE9.md docs/PRODUCTION_FARM_PHASE10.md
            docs/PRODUCTION_FARM_PHASE11.md
          )
          for f in "${files[@]}"; do test -s "$f" || { echo "Missing/empty: $f"; exit 1; }; done

      - name: Check JavaScript syntax
        run: |
          node --check admin/equipment-ownership.js
          node --check admin/equipment-buyout.js
          node --check admin/equipment-economics.js
          node --check admin/production-modern.js
          node --check admin/production-farm-runtime.js
          node --check admin/production-farm-materials.js
          node --check admin/production-farm-settlements.js
          node --check admin/production-farm-capacity.js
          node --check admin/production-farm-dispatcher.js
          node --check admin/production-farm-operator.js
          node --check admin/production-farm-analytics.js
          node --check admin/production-farm-monitoring.js

      - name: Verify UI wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'equipment-ownership.js?v=' admin/equipment.html
          grep -q 'equipment-buyout.js?v=' admin/equipment.html
          grep -q 'equipment-economics.js?v=' admin/equipment.html
          grep -q 'production-farm-runtime.js?v=' admin/production.html
          grep -q 'production-farm-materials.js?v=' admin/production.html
          grep -q 'production-farm-settlements.js?v=' admin/production.html
          grep -q 'production-farm-capacity.js?v=' admin/production.html
          grep -q 'production-farm-dispatcher.js?v=' admin/production.html
          grep -q 'production-farm-dispatcher.css?v=' admin/production.html
          grep -q 'production-farm-operator.js?v=' admin/production.html
          grep -q 'production-farm-operator.css?v=' admin/production.html
          grep -q 'production-farm-analytics.js?v=' admin/production.html
          grep -q 'production-farm-analytics.css?v=' admin/production.html
          grep -q 'production-farm-monitoring.js?v=' admin/production.html
          grep -q 'production-farm-monitoring.css?v=' admin/production.html
          grep -q 'jobDuration' admin/production.html
          grep -q 'jobOperation' admin/production.html
          grep -q 'deadline_at' admin/production-modern.js
          grep -q 'planned_machine_minutes' admin/production-modern.js
          grep -q 'auto_dispatch_production_queue' admin/production-farm-dispatcher.js
          grep -q 'schedule_production_job_into_day' admin/production-farm-dispatcher.js
          grep -q 'set_production_dispatch_lock' admin/production-farm-dispatcher.js
          grep -q 'save_production_dispatch_settings' admin/production-farm-dispatcher.js
          grep -q 'save_production_equipment_capabilities' admin/production-farm-dispatcher.js
          grep -q 'draggable=' admin/production-farm-dispatcher.js
          grep -q 'Диспетчер производства' admin/production-farm-dispatcher.js
          grep -q 'production_operator_action' admin/production-farm-operator.js
          grep -q 'production_operator_overview' admin/production-farm-operator.js
          grep -q 'data-farm-action' admin/production-farm-operator.js
          grep -q 'Оператор производства' admin/production-farm-operator.js
          grep -q 'production_oee_daily' admin/production-farm-analytics.js
          grep -q 'production_downtime_pareto_daily' admin/production-farm-analytics.js
          grep -q 'production_capacity_between' admin/production-farm-analytics.js
          grep -q 'Производственная аналитика / OEE' admin/production-farm-analytics.js
          grep -q 'production_equipment_monitor' admin/production-farm-monitoring.js
          grep -q 'production_monitor_settings' admin/production-farm-monitoring.js
          grep -q 'save_production_monitor_settings' admin/production-farm-monitoring.js
          grep -q 'Контроль производства' admin/production-farm-monitoring.js

      - name: Verify production database safety markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'create table if not exists public.permissions' database/migrations/20260914_production_farm_foundation.sql
          grep -q 'SHARES_MUST_TOTAL_100' database/migrations/20260914_production_farm_management_rpcs.sql
          grep -q 'production_jobs_one_running_per_equipment_idx' database/migrations/20260914_production_farm_job_execution.sql
          grep -q 'production_job_cost_breakdown' database/migrations/20260914_production_farm_materials_costing.sql
          grep -q 'generate_equipment_owner_settlement' database/migrations/20260914_production_farm_owner_settlements.sql
          grep -q 'complete_equipment_buyout' database/migrations/20260914_production_farm_lease_buyout.sql
          grep -q 'equipment_economics_daily' database/migrations/20260914_production_farm_equipment_economics.sql
          grep -q 'validate_production_job_schedule' database/migrations/20260914_production_farm_capacity_planning.sql
          grep -q 'EQUIPMENT_PLAN_OVERLAP' database/migrations/20260914_production_farm_capacity_planning.sql
          grep -q 'create table if not exists public.production_dispatch_settings' database/migrations/20260914_production_farm_dispatcher.sql
          grep -q 'create table if not exists public.production_equipment_capabilities' database/migrations/20260914_production_farm_dispatcher.sql
          grep -q 'production_find_dispatch_slot_internal' database/migrations/20260914_production_farm_dispatcher.sql
          grep -q 'auto_dispatch_production_job' database/migrations/20260914_production_farm_dispatcher.sql
          grep -q 'auto_dispatch_production_queue' database/migrations/20260914_production_farm_dispatcher.sql
          grep -q 'schedule_production_job_into_day' database/migrations/20260914_production_farm_dispatcher.sql
          grep -q 'trg_replan_production_jobs_after_equipment_fault' database/migrations/20260914_production_farm_dispatcher.sql
          grep -q "dispatch_locked=true" database/migrations/20260914_production_farm_dispatcher.sql
          grep -q "status in ('NEW','QUEUED','PAUSED')" database/migrations/20260914_production_farm_dispatcher.sql
          grep -q 'create table if not exists public.production_job_events' database/migrations/20260914_production_farm_operator_station.sql
          grep -q 'production_operator_action' database/migrations/20260914_production_farm_operator_station.sql
          grep -q 'production_operator_overview' database/migrations/20260914_production_farm_operator_station.sql
          grep -q 'trg_log_production_job_run_event' database/migrations/20260914_production_farm_operator_station.sql
          grep -q 'PAUSE_REASON_REQUIRED' database/migrations/20260914_production_farm_operator_station.sql
          grep -q 'security_invoker=true' database/migrations/20260914_production_farm_operator_station.sql
          grep -q 'revoke all on public.production_job_events from public,anon,authenticated' database/migrations/20260914_production_farm_operator_station.sql
          grep -q 'create or replace view public.production_oee_daily' database/migrations/20260914_production_farm_oee_analytics.sql
          grep -q 'create or replace view public.production_downtime_pareto_daily' database/migrations/20260914_production_farm_oee_analytics.sql
          grep -q 'security_invoker=true' database/migrations/20260914_production_farm_oee_analytics.sql
          grep -q 'revoke all on public.production_oee_daily from public,anon' database/migrations/20260914_production_farm_oee_analytics.sql
          grep -q 'create table if not exists public.production_monitor_settings' database/migrations/20260914_production_farm_monitoring.sql
          grep -q 'save_production_monitor_settings' database/migrations/20260914_production_farm_monitoring.sql
          grep -q 'create or replace view public.production_equipment_monitor' database/migrations/20260914_production_farm_monitoring.sql
          grep -q 'security definer' database/migrations/20260914_production_farm_monitoring.sql
          grep -q 'revoke all on public.production_monitor_settings from public,anon,authenticated' database/migrations/20260914_production_farm_monitoring.sql
          grep -q 'equipment_capacity_rules' database/migrations/20260914_production_farm_monitoring_hardening.sql
          test "$(grep -c 'production_capacity_between' database/migrations/20260914_production_farm_monitoring_hardening.sql)" -eq 1
