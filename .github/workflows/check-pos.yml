name: Check A4PRINT POS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pos/**'
      - 'admin/pos.html'
      - 'api/src/server.js'
      - 'api/src/mobile-proxy.js'
      - 'api/src/moysklad.js'
      - 'database/migrations/103_pos_shift_sales_analytics.sql'
      - 'database/migrations/104_pos_rpc_and_cash_sync.sql'
      - 'database/migrations/105_pos_operator_cash_account_read.sql'
      - 'database/migrations/106_pos_dashboard_include_legacy_cash.sql'
      - '.github/workflows/check-pos.yml'

jobs:
  pos-static:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify POS files
        run: |
          set -euo pipefail
          test -s pos/index.html
          test -s pos/login.html
          test -s pos/app-v2.js
          test -s pos/manual-shift.js
          test -s pos/runtime-guard.js
          test -s pos/styles-v2.css
          test -s pos/logo-fix.css
          test -s pos/manifest.webmanifest
          test -s pos/sw.js
          test -s api/src/server.js
          test -s api/src/mobile-proxy.js
          test -s api/src/moysklad.js
          grep -q "location.replace(target.pathname" admin/pos.html
      - name: Check JavaScript syntax
        run: |
          node --check pos/app-v2.js
          node --check pos/manual-shift.js
          node --check pos/runtime-guard.js
          node --check pos/sw.js
          node --check api/src/server.js
          node --check api/src/mobile-proxy.js
          node --check api/src/moysklad.js
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('pos/manifest.webmanifest','utf8')); console.log('POS manifest ok')"
      - name: Verify POS wiring
        run: |
          set -euo pipefail
          grep -q 'manual-shift.js' pos/index.html
          grep -q 'runtime-guard.js' pos/index.html
          grep -q 'logo-fix.css' pos/index.html
          grep -q 'a4print-hub-logo-white.svg' pos/index.html
          grep -q 'record_pos_sale' pos/app-v2.js
          grep -q 'record_pos_shift' pos/app-v2.js
          grep -q '/api/v1/pos/shift/open' pos/app-v2.js
          grep -q '/api/v1/pos/shift/close' pos/app-v2.js
          grep -q 'manualActivationRequired' pos/manual-shift.js
          grep -q 'posSale' pos/runtime-guard.js
          grep -q '20260905-pos-sale-v2' api/src/mobile-proxy.js
          grep -q 'createRetailSale' api/src/server.js
          grep -q "'https://a4print-hub.ru'" api/src/mobile-proxy.js

  pos-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Pages and API deployment
        run: sleep 35
      - name: Check live POS assets
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            page=$(curl -fsSL --max-time 20 "https://a4print-hub.ru/pos/index.html?poscheck=${GITHUB_SHA}" || true)
            manual=$(curl -fsSL --max-time 20 "https://a4print-hub.ru/pos/manual-shift.js?poscheck=${GITHUB_SHA}" || true)
            guard=$(curl -fsSL --max-time 20 "https://a4print-hub.ru/pos/runtime-guard.js?poscheck=${GITHUB_SHA}" || true)
            css=$(curl -fsSL --max-time 20 "https://a4print-hub.ru/pos/styles-v2.css?poscheck=${GITHUB_SHA}" || true)
            logo=$(curl -fsSL --max-time 20 "https://a4print-hub.ru/admin/assets/a4print-hub-logo-white.svg?poscheck=${GITHUB_SHA}" || true)
            legacy=$(curl -fsSL --max-time 20 "https://a4print-hub.ru/admin/pos.html?poscheck=${GITHUB_SHA}" || true)
            if echo "$page" | grep -q 'manual-shift.js' \
              && echo "$manual" | grep -q 'manualActivationRequired' \
              && echo "$guard" | grep -q 'posSale' \
              && echo "$css" | grep -q '100dvh' \
              && echo "$logo" | grep -q 'A4PRINT HUB' \
              && echo "$legacy" | grep -q "location.replace(target.pathname"; then
              echo 'POS responsive build, white logo and manual shift control are live.'
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo 'POS build did not become live in time.'
              exit 1
            fi
            sleep 5
          done
      - name: Check API POS sale capability, MoySklad and browser CORS readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            health=$(curl -fsSL --retry 2 --retry-delay 2 --retry-all-errors --max-time 25 https://a4print-hub-api.onrender.com/api/v1/health || true)
            echo "$health"
            if echo "$health" | grep -q '"success":true' \
              && echo "$health" | grep -q '"databaseConfigured":true' \
              && echo "$health" | grep -q '"moyskladConfigured":true' \
              && echo "$health" | grep -q '"posSale":true'; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo 'Live API did not expose the POS sale capability in time.'
              exit 1
            fi
            sleep 5
          done

          headers=$(mktemp)
          curl -sS -o /dev/null -D "$headers" \
            -X OPTIONS \
            -H 'Origin: https://a4print-hub.ru' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            --retry 8 --retry-delay 5 --retry-all-errors --max-time 25 \
            https://a4print-hub-api.onrender.com/api/v1/pos/shift
          cat "$headers"
          tr -d '\r' < "$headers" | grep -qi '^access-control-allow-origin: https://a4print-hub.ru$'
          tr -d '\r' < "$headers" | grep -qi '^access-control-allow-headers: .*Authorization.*Content-Type'
