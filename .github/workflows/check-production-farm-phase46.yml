name: Check Production Farm Phase 46

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'database/migrations/20260918_production_farm_allocation_weight_annex.sql'
      - 'admin/equipment-contract-amendments.html'
      - 'admin/equipment-contract-amendments.js'
      - 'admin/equipment-contract-allocation.js'
      - 'partner/equipment-owner-contract-amendments.js'
      - 'partner/equipment-owner-amendment-acceptance.js'
      - 'docs/PRODUCTION_FARM_PHASE46.md'
      - '.github/workflows/check-production-farm-phase46.yml'

jobs:
  phase46-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check admin/equipment-contract-amendments.js
          node --check admin/equipment-contract-allocation.js
          node --check partner/equipment-owner-contract-amendments.js
          node --check partner/equipment-owner-amendment-acceptance.js

      - name: Verify allocation annex migration
        shell: bash
        run: |
          set -euo pipefail
          sql='database/migrations/20260918_production_farm_allocation_weight_annex.sql'
          test -s "$sql"

          grep -q 'EQUIPMENT_ALLOCATION_WEIGHT' "$sql"
          grep -q 'equipment_contract_amendment_allocations' "$sql"
          grep -q 'previous_allocation_weight' "$sql"
          grep -q 'new_allocation_weight' "$sql"
          grep -q 'source_contract_asset_id' "$sql"
          grep -q 'result_contract_asset_id' "$sql"

          grep -q 'create_equipment_allocation_weight_amendment' "$sql"
          grep -q 'apply_equipment_contract_allocation_weight_amendment' "$sql"
          grep -q 'ALLOCATION_PERIOD_CHANGED_SINCE_DRAFT' "$sql"
          grep -q 'ALLOCATION_WEIGHT_CHANGED_SINCE_DRAFT' "$sql"

          grep -q 'assert_non_partner_staff_context' "$sql"
          grep -q 'STAFF_CONTEXT_REQUIRED' "$sql"
          grep -q 'list_equipment_contract_amendments' "$sql"
          grep -q 'current_user_organization_id' "$sql"

          grep -q "set search_path=''" "$sql"
          grep -q 'assert_production_farm_security_baseline' "$sql"

      - name: Verify UI markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'equipment-contract-allocation.js' admin/equipment-contract-amendments.html
          grep -q 'create_equipment_allocation_weight_amendment' admin/equipment-contract-allocation.js
          grep -q 'EQUIPMENT_ALLOCATION_WEIGHT' admin/equipment-contract-amendments.js
          grep -q 'EQUIPMENT_ALLOCATION_WEIGHT' partner/equipment-owner-contract-amendments.js
          grep -q 'EQUIPMENT_ALLOCATION_WEIGHT' partner/equipment-owner-amendment-acceptance.js
          grep -q 'previous_allocation_weight' admin/equipment-contract-amendments.js
          grep -q 'new_allocation_weight' partner/equipment-owner-contract-amendments.js

      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/PRODUCTION_FARM_PHASE46.md'
          test -s "$doc"
          grep -q 'phase46_allocation_weight_annex_ok' "$doc"
          grep -q 'BEGIN ... ROLLBACK' "$doc"
          grep -q '600 ₽' "$doc"
          grep -q '400 ₽' "$doc"
          grep -q 'STAFF_CONTEXT_REQUIRED' "$doc"
          grep -q 'baseline violations = 0' "$doc"
