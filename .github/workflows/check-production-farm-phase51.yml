name: Check Production Farm Phase 51

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'database/migrations/20260919_production_farm_risk_cockpit.sql'
      - 'admin/production-farm-risk.html'
      - 'admin/production-farm-risk.js'
      - 'admin/navigation.js'
      - 'docs/PRODUCTION_FARM_PHASE51.md'
      - '.github/workflows/check-production-farm-phase51.yml'

jobs:
  phase51-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check admin/production-farm-risk.js
          node --check admin/navigation.js

      - name: Verify Phase 51 migration
        shell: bash
        run: |
          set -euo pipefail
          sql='database/migrations/20260919_production_farm_risk_cockpit.sql'
          test -s "$sql"

          grep -q 'add column contract_id uuid' "$sql"
          grep -q 'add column organization_id uuid' "$sql"
          grep -q 'PARTNER_RESPONSE_CONTRACT_CONTEXT_MISSING' "$sql"
          grep -q 'equipment_partner_responses_read' "$sql"
          grep -q 'organization_id=public.current_user_organization_id()' "$sql"

          grep -q 'submit_equipment_partner_response' "$sql"
          grep -q 'Доплата по выкупу по договору' "$sql"
          grep -q 'ou.organization_id=v_org' "$sql"

          grep -q 'list_equipment_partner_disputes' "$sql"
          grep -q 'production_farm_risk_rows' "$sql"
          grep -q "'PARTNER_DISPUTE'" "$sql"
          grep -q 'get_production_farm_risk_cockpit' "$sql"
          grep -qi "set search_path TO ''" "$sql"
          grep -q 'assert_production_farm_security_baseline' "$sql"

      - name: Verify cockpit UI
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'get_production_farm_risk_cockpit' admin/production-farm-risk.js
          grep -q 'PARTNER_DISPUTE' admin/production-farm-risk.js
          grep -q 'PARTNER_DISPUTE' admin/production-farm-risk.html
          grep -q 'production-farm-risk.html' admin/navigation.js

      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/PRODUCTION_FARM_PHASE51.md'
          test -s "$doc"
          grep -q 'phase51_production_farm_risk_cockpit_ok' "$doc"
          grep -q 'BEGIN ... ROLLBACK' "$doc"
          grep -q 'BUYOUT_EXTRA' "$doc"
          grep -q 'ENTITY_NOT_AVAILABLE' "$doc"
          grep -q '3D-ARTPRINT' "$doc"
          grep -q 'PH51 responses = 0' "$doc"
