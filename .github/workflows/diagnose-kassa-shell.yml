name: Diagnose Kassa Shell

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find failing Kassa shell assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('.github/workflows/check-kassa2.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = None
          for i, line in enumerate(lines):
              if line.strip() == '- name: Check Kassa shell':
                  start = i
                  break
          if start is None:
              raise SystemExit('Check Kassa shell step not found')

          run = None
          for i in range(start + 1, len(lines)):
              if lines[i].strip() == 'run: |':
                  run = i + 1
                  break
          if run is None:
              raise SystemExit('run block not found')

          commands = []
          for line in lines[run:]:
              if line.startswith('      - name:'):
                  break
              if not line.strip():
                  continue
              if not line.startswith('          '):
                  continue
              commands.append(line[10:])

          failed = []
          for n, command in enumerate(commands, 1):
              result = subprocess.run(['bash', '-lc', command], text=True, capture_output=True)
              state = 'PASS' if result.returncode == 0 else 'FAIL'
              print(f'[{state}] {n:03d}: {command}', flush=True)
              if result.stdout:
                  print(result.stdout, end='')
              if result.stderr:
                  print(result.stderr, end='')
              if result.returncode != 0:
                  failed.append(command)

          if failed:
              print('\nFailing assertions:')
              for command in failed:
                  print(f'  {command}')
              raise SystemExit(1)
          print(f'All {len(commands)} Kassa shell assertions passed.')
          PY
