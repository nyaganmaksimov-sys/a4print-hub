name: Vendor Supabase JS

on:
  push:
    paths:
      - '.github/workflows/vendor-supabase.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Supabase JS package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/a4-supabase
          mkdir -p /tmp/a4-supabase admin/vendor
          cd /tmp/a4-supabase
          npm pack @supabase/supabase-js@2
          tar -xzf supabase-supabase-js-*.tgz
          cp package/dist/umd/supabase.js "$GITHUB_WORKSPACE/admin/vendor/supabase.js"
      - name: Commit vendored browser library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/vendor/supabase.js
          if git diff --cached --quiet; then
            echo 'Supabase JS already up to date'
            exit 0
          fi
          git commit -m 'Vendor Supabase JS browser build'
          git push
