name: Check Production Farm Phase 39

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'database/migrations/20260918_production_farm_production_settings_tenancy.sql'
      - 'docs/PRODUCTION_FARM_PHASE39.md'
      - '.github/workflows/check-production-farm-phase39.yml'

jobs:
  phase39-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production settings tenancy migration
        shell: bash
        run: |
          set -euo pipefail
          sql='database/migrations/20260918_production_farm_production_settings_tenancy.sql'
          test -s "$sql"

          grep -q 'production_dispatch_settings' "$sql"
          grep -q 'production_monitor_settings' "$sql"
          grep -q 'organization_id uuid references public.organizations' "$sql"
          grep -q 'primary key(organization_id)' "$sql"
          grep -q 'organization_id=public.current_user_organization_id()' "$sql"

          grep -q 'save_production_dispatch_settings' "$sql"
          grep -q 'save_production_monitor_settings' "$sql"
          grep -q 'ORGANIZATION_CONTEXT_REQUIRED' "$sql"
          grep -q 'on conflict(organization_id)' "$sql"
          grep -q "set search_path=''" "$sql"

          grep -q 'production_find_dispatch_slot_internal' "$sql"
          grep -q 's.organization_id=v_job.organization_id' "$sql"

      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/PRODUCTION_FARM_PHASE39.md'
          test -s "$doc"

          grep -q 'phase39_production_settings_tenancy_ok' "$doc"
          grep -q 'BEGIN ... ROLLBACK' "$doc"
          grep -q 'А4-Принт' "$doc"
          grep -q '3D-ARTPRINT' "$doc"
          grep -q 'Europe/Berlin' "$doc"
          grep -q 'security_invoker=true' "$doc"
          grep -q 'v_job.organization_id' "$doc"
