name: A4PRINT HUB Windows Setup
on:
  workflow_dispatch:
  push:
    paths:
      - 'hub-desktop/**'
      - '.github/workflows/a4print-hub-desktop.yml'
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hub-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: A4PRINT-HUB-Setup-Windows
          path: hub-desktop/dist/*.exe
          if-no-files-found: error
