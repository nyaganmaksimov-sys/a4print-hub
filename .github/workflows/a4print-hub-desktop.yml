name: A4PRINT HUB Windows Setup
on:
  workflow_dispatch:
    inputs:
      publish_update:
        description: 'Force publish HUB Desktop stable update'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'hub-desktop/**'
      - '.github/workflows/a4print-hub-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: hub-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify JavaScript
        run: npm run check
      - name: Build Windows NSIS installer and update metadata
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: A4PRINT-HUB-Setup-Windows
          path: |
            hub-desktop/dist/*.exe
            hub-desktop/dist/*.blockmap
            hub-desktop/dist/latest.yml
            hub-desktop/update-notes.json
          if-no-files-found: error
      - name: Publish stable update after successful installer build
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_update)) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/a4print-hub-windows-desktop')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $repo = "$env:GITHUB_REPOSITORY"
          gh release view hub-desktop --repo $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create hub-desktop --repo $repo --target $env:GITHUB_SHA --title "A4PRINT HUB Desktop — Stable update channel" --notes "Stable Windows update channel for A4PRINT HUB Desktop." --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          }
          if (!(Test-Path "dist/latest.yml")) { throw "Missing latest.yml update manifest" }
          $assets = @(Get-ChildItem "dist" -File | Where-Object { $_.Extension -in @(".exe", ".blockmap") } | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No installer assets found" }
          gh release upload hub-desktop $assets --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Installer release upload failed" }
          gh release upload hub-desktop (Resolve-Path "update-notes.json").Path --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Notes release upload failed" }
          # Publish manifest LAST so users never see an update before the EXE is available.
          gh release upload hub-desktop (Resolve-Path "dist/latest.yml").Path --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Manifest release upload failed" }
