<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111;display:grid;place-items:center;height:100vh;border:1px solid #d9e6e8}

</style></head><body><div class="wrap"><div class="mark"><span>A4<i>▮</i></span></div><div class="brand">A4-КАССА</div><div class="line"></div><div class="status">Система продаж, расчётов и управления</div></div></body></html>
