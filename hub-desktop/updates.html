<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>Обновления HUB</title><style>*{box-sizing:border-box}body{font:14px 'Segoe UI',Arial,sans-serif;background:#f3f7fc;color:#172541;margin:0;padding:30px}.panel{background:white;border:1px solid #dbe5f2;border-radius:18px;padding:26px;box-shadow:0 12px 25px #152b450a}h1{font-size:25px;margin:0 0 10px}.muted{color:#6c809c;line-height:1.6}.version{font-size:15px;margin:18px 0}.state{padding:14px;background:#eaf2ff;border-radius:10px;min-height:50px;color:#204b92}button{border:0;border-radius:10px;padding:13px 16px;font-weight:bold;cursor:pointer;background:#266af0;color:white}button:disabled{opacity:.5;cursor:not-allowed}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}#install{background:#087f52}progress{width:100%;height:15px;margin-top:17px}#notes{white-space:pre-line;color:#526581;line-height:1.6;max-height:100px;overflow:auto}</style></head><body><section class="panel"><h1>Обновления A4PRINT HUB</h1><p class="muted">Проверка и установка обновлений приложения без повторного скачивания с GitHub.</p><div class="version" id="version">Загрузка информации…</div><div class="state" id="message" role="status"></div><progress id="progress" max="100" value="0" hidden></progress><p id="notes"></p><div class="buttons"><button id="check">Проверить обновления</button><button id="download" hidden>Скачать обновление</button><button id="install" hidden>Перезапустить и установить</button></div><p class="muted">Перед установкой сохраните незавершённую работу в HUB. Касса A4PRINT KASSA обновляется отдельно.</p></section><script>const by=id=>document.getElementById(id);function render(s){by('version').textContent='Установлена: '+s.currentVersion+(s.version?' · Доступна: '+s.version:'');by('message').textContent=s.message||'';by('download').hidden=s.status!=='available';by('install').hidden=s.status!=='ready';by('check').disabled=['checking','downloading'].includes(s.status);by('progress').hidden=s.status!=='downloading'&&s.status!=='ready';by('progress').value=s.progress||0;const n=s.notes;by('notes').textContent=Array.isArray(n)?n.map(x=>x.note||x).join('\n'):String(n||'')}by('check').onclick=()=>window.updates.check().then(render);by('download').onclick=()=>window.updates.download().then(render);by('install').onclick=()=>window.updates.install();window.updates.listen(render);window.updates.get().then(render);</script></body></html>
