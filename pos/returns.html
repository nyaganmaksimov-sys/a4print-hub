<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Возвраты — Касса A4-Принт</title><script src="../admin/config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f8fb;color:#111827}.app{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}.side{background:#fff;border-right:1px solid #e5e7eb;padding:18px;display:flex;flex-direction:column;gap:18px}.logo{width:160px;margin:0 auto}.logo img{width:100%;height:auto;display:block}.nav{display:grid;gap:7px}.nav a{color:#334155;text-decoration:none;padding:11px 12px;border-radius:10px;font-weight:750}.nav a.active{background:#fff1f2;color:#be123c}.hint{margin-top:auto;font-size:12px;color:#64748b;line-height:1.45}.main{padding:22px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.top h1{margin:0;font-size:27px}.top p{margin:4px 0 0;color:#64748b}.operator{border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:9px 12px;font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}.panel-head{padding:15px 16px;border-bottom:1px solid #eef2f7;display:flex;justify-content:space-between;align-items:center;gap:10px}.search{width:100%;padding:12px 13px;border:1px solid #dbe2ea;border-radius:10px;font:inherit}.sales{max-height:calc(100vh - 170px);overflow:auto}.sale{padding:14px 16px;border-bottom:1px solid #eef2f7;cursor:pointer}.sale:hover{background:#f8fafc}.sale.active{background:#eff6ff}.sale-top{display:flex;justify-content:space-between;gap:12px}.sale-name{font-weight:850}.sale-sum{font-weight:900}.meta{font-size:12px;color:#64748b;margin-top:4px;line-height:1.4}.detail{padding:16px;display:grid;gap:14px}.empty{padding:42px 18px;text-align:center;color:#94a3b8}.pos{border:1px solid #e5e7eb;border-radius:12px;padding:11px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.pos-name{font-weight:800;font-size:13px}.qty{display:flex;align-items:center;gap:7px}.qty input{width:78px;padding:8px;border:1px solid #dbe2ea;border-radius:9px;font:inherit;text-align:center}.field{display:grid;gap:6px;font-size:12px;font-weight:750;color:#475569}.field select,.field textarea{width:100%;padding:11px;border:1px solid #dbe2ea;border-radius:10px;font:inherit;background:#fff}.field textarea{min-height:84px;resize:vertical}.sumrow{display:flex;justify-content:space-between;align-items:end;border-top:1px solid #eef2f7;padding-top:12px}.sumrow strong{font-size:28px}.actions{display:flex;gap:8px}.btn{border:1px solid #dbe2ea;background:#fff;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}.btn.primary{background:#be123c;color:#fff;border-color:#be123c;flex:1}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{display:none;margin-bottom:14px;padding:11px 13px;border-radius:11px}.notice.ok{display:block;background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}.notice.err{display:block;background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}@media(max-width:980px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}.sales{max-height:420px}}</style></head><body><div class="app"><aside class="side"><div class="logo"><img src="https://raw.githubusercontent.com/nyaganmaksimov-sys/a4-print/7730a865e3487306eb63cc81857470b75844d35e/images/logo_soc_new.png" alt="А4-Принт"></div><nav class="nav"><a href="./index.html">🛒 Касса</a><a class="active" href="./returns.html">↩ Возврат</a><a href="../admin/customers.html">👥 Клиенты</a></nav><div class="hint">Возврат создаётся в МойСклад и одновременно записывается расходной операцией в общей базе A4PRINT HUB.</div></aside><main class="main"><div class="top"><div><h1>Возврат</h1><p>Выберите исходную продажу и позиции для возврата</p></div><div id="operator" class="operator">Оператор</div></div><div id="notice" class="notice"></div><div class="grid"><section class="panel"><div class="panel-head"><b>Последние продажи</b><button id="refresh" class="btn">Обновить</button></div><div style="padding:12px 14px"><input id="search" class="search" placeholder="Номер продажи, сумма, комментарий…"></div><div id="sales" class="sales"><div class="empty">Загрузка…</div></div></section><section class="panel"><div class="panel-head"><b>Позиции возврата</b><span id="saleLabel" class="meta">Продажа не выбрана</span></div><div id="detail" class="detail"><div class="empty">Выберите продажу слева</div></div></section></div></main></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.A4PRINT_CONFIG||{},supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id),rub=v=>Number(v||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let session,profile,sales=[],selected=null,accounts=[];function note(text,type='ok'){const e=$('notice');e.textContent=text;e.className='notice '+(type==='err'?'err':'ok')}async function api(path,opt={}){const r=await fetch(cfg.apiBaseUrl+path,{...opt,headers:{Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||'Ошибка API');return d}async function init(){const s=await supabase.auth.getSession();session=s.data.session;if(!session)return location.replace('./login.html');const [{data:a},{data:o}]=await Promise.all([supabase.rpc('has_role',{required_role:'ADMIN'}),supabase.rpc('has_role',{required_role:'POS_OPERATOR'})]);if(!a&&!o)return location.replace('./login.html');const p=await supabase.from('users').select('id,full_name,email').eq('auth_user_id',session.user.id).maybeSingle();profile=p.data;$('operator').textContent=profile?.full_name||session.user.email;const org=await supabase.from('organizations').select('id').eq('code','A4PRINT').single();const ac=await supabase.from('cash_accounts').select('id,name').eq('organization_id',org.data.id).eq('is_active',true).order('name');accounts=ac.data||[];await loadSales()}async function loadSales(){try{$('sales').innerHTML='<div class="empty">Загрузка…</div>';const d=await api('/api/v1/pos/returns/sales');sales=d.sales||[];renderSales()}catch(e){$('sales').innerHTML=`<div class="empty">${esc(e.message)}</div>`;note('Не удалось загрузить продажи: '+e.message,'err')}}function renderSales(){const q=$('search').value.trim().toLowerCase();const rows=sales.filter(x=>`${x.name||''} ${x.description||''} ${x.sum||''} ${x.moment||''}`.toLowerCase().includes(q));$('sales').innerHTML=rows.map(x=>`<div class="sale ${selected?.id===x.id?'active':''}" data-sale="${x.id}"><div class="sale-top"><span class="sale-name">${esc(x.name||x.id)}</span><span class="sale-sum">${rub(x.sum)}</span></div><div class="meta">${x.moment?new Date(x.moment).toLocaleString('ru-RU'):''}${x.description?` · ${esc(x.description)}`:''}</div></div>`).join('')||'<div class="empty">Продажи не найдены</div>';document.querySelectorAll('[data-sale]').forEach(el=>el.onclick=()=>loadSale(el.dataset.sale))}async function loadSale(id){try{$('detail').innerHTML='<div class="empty">Загрузка позиций…</div>';const d=await api('/api/v1/pos/returns/sales/'+encodeURIComponent(id));selected=d.sale;renderSales();renderDetail()}catch(e){note('Не удалось открыть продажу: '+e.message,'err')}}function renderDetail(){if(!selected)return;$('saleLabel').textContent=selected.name||selected.id;const rows=selected.positions||[];$('detail').innerHTML=`<div>${rows.map(p=>`<div class="pos"><div><div class="pos-name">${esc(p.name)}</div><div class="meta">Продано: ${p.quantity} × ${rub(p.price)}</div></div><div class="qty"><span>Вернуть</span><input data-return-qty="${p.id}" type="number" min="0" max="${p.quantity}" step="1" value="0"></div></div>`).join('')}</div><label class="field">Счёт возврата<select id="returnAccount">${accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label><label class="field">Способ возврата<select id="returnMethod"><option>Наличные</option><option>Карта</option><option>СБП</option><option>Банк</option></select></label><label class="field">Причина возврата<textarea id="returnReason" placeholder="Например: брак, ошибка в заказе, отказ клиента…"></textarea></label><div class="sumrow"><span>К возврату</span><strong id="returnTotal">0,00 ₽</strong></div><div class="actions"><button id="returnAll" class="btn">Вернуть всё</button><button id="submitReturn" class="btn primary">Провести возврат</button></div>`;document.querySelectorAll('[data-return-qty]').forEach(i=>i.oninput=calcTotal);$('returnAll').onclick=()=>{document.querySelectorAll('[data-return-qty]').forEach(i=>i.value=i.max);calcTotal()};$('submitReturn').onclick=submitReturn;calcTotal()}function selectedPositions(){return [...document.querySelectorAll('[data-return-qty]')].map(i=>({id:i.dataset.returnQty,quantity:Number(i.value||0)})).filter(x=>x.quantity>0)}function calcTotal(){if(!selected)return;const map=new Map((selected.positions||[]).map(x=>[x.id,x]));const total=selectedPositions().reduce((s,x)=>{const p=map.get(x.id);return s+(p?x.quantity*p.price*(1-(p.discount||0)/100):0)},0);$('returnTotal').textContent=rub(total)}async function submitReturn(){const positions=selectedPositions(),reason=$('returnReason').value.trim();if(!positions.length)return note('Укажите количество возвращаемых позиций','err');if(!reason)return note('Укажите причину возврата','err');if(!confirm(`Провести возврат по продаже ${selected.name||selected.id}?`))return;const btn=$('submitReturn');try{btn.disabled=true;btn.textContent='Провожу…';const d=await api('/api/v1/pos/returns',{method:'POST',body:JSON.stringify({sale_id:selected.id,positions,account_id:$('returnAccount').value,payment_method:$('returnMethod').value,reason})});note(`Возврат ${d.return?.name||''} проведён · ${rub(d.amount)}`);selected=null;$('saleLabel').textContent='Продажа не выбрана';$('detail').innerHTML='<div class="empty">Возврат проведён. Выберите следующую продажу.</div>';await loadSales()}catch(e){note('Возврат не проведён: '+e.message,'err')}finally{btn.disabled=false;btn.textContent='Провести возврат'}}$('search').oninput=renderSales;$('refresh').onclick=loadSales;init();</script></body></html>
