<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Касса A4-Принт</title><script src="../admin/config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f8fb;color:#111827}.wrap{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr) 390px}.side{background:#fff;border-right:1px solid #e5e7eb;padding:18px;display:flex;flex-direction:column;gap:18px}.logo{width:150px;height:150px;border-radius:50%;margin:0 auto;background:#fff;display:grid;place-items:center;border:10px solid transparent;background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#0ea5e9,#7c3aed,#ec4899,#facc15);background-origin:border-box;background-clip:padding-box,border-box}.logo b{font-size:44px;line-height:.8}.logo small{display:block;font-size:12px;text-align:center}.nav{display:grid;gap:7px}.nav a,.nav button{border:0;background:transparent;text-decoration:none;color:#334155;text-align:left;padding:11px 12px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}.nav .active{background:#eaf2ff;color:#2563eb}.shiftcard{margin-top:auto;border:1px solid #e5e7eb;border-radius:14px;padding:13px;background:#fff}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-right:6px}.dot.open{background:#22c55e}.main{padding:18px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top h1{margin:0;font-size:26px}.operator{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:9px 12px;font-size:13px}.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1;padding:13px 14px;border:1px solid #dbe2ea;border-radius:12px;background:#fff;font:inherit}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters button{border:1px solid #dbe2ea;background:#fff;padding:9px 12px;border-radius:10px;cursor:pointer}.filters button.on{background:#2563eb;color:#fff;border-color:#2563eb}.goods{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.card b{font-size:14px}.price{font-size:20px;font-weight:900}.meta{font-size:11px;color:#64748b}.right{background:#fff;border-left:1px solid #e5e7eb;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}.rhead{padding:18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between}.cart{padding:8px 18px;overflow:auto;flex:1}.item{padding:12px 0;border-bottom:1px solid #eef2f7}.row{display:flex;justify-content:space-between;gap:10px}.qty{display:flex;gap:7px;align-items:center;margin-top:8px}.qty button{width:28px;height:28px;border:1px solid #dbe2ea;background:#fff;border-radius:8px}.foot{padding:16px;border-top:1px solid #e5e7eb;display:grid;gap:10px}.field{display:grid;gap:5px;font-size:12px;font-weight:700;color:#475569}.field input,.field select{padding:10px;border:1px solid #dbe2ea;border-radius:10px;font:inherit}.client{border:1px solid #e5e7eb;border-radius:12px;padding:10px;background:#f8fafc;display:grid;gap:7px}.client input,.client textarea{width:100%;padding:9px;border:1px solid #dbe2ea;border-radius:9px;font:inherit}.client textarea{min-height:58px}.total{display:flex;justify-content:space-between;align-items:end}.total strong{font-size:30px}.change{font-weight:850;color:#16a34a}.pay{padding:14px;border:0;border-radius:12px;background:#16a34a;color:#fff;font:inherit;font-weight:900;cursor:pointer}.pay:disabled{opacity:.5}.notice{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;padding:10px 14px;border-radius:10px;background:#111827;color:#fff;display:none}.empty{padding:30px;text-align:center;color:#94a3b8}@media(max-width:1100px){.wrap{grid-template-columns:1fr}.side{display:none}.right{position:relative;height:auto;border-left:0;border-top:1px solid #e5e7eb}.goods{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}}</style></head><body><div id="notice" class="notice"></div><div class="wrap"><aside class="side"><div class="logo"><div><small>ФОТО-КОПИРОВАЛЬНЫЙ</small><b>A4</b><small>ПРИНТ</small></div></div><nav class="nav"><a class="active">🛒 Касса</a><a href="../admin/customers.html">👥 Клиенты</a><button id="logoutSide">↪ Выйти</button></nav><div class="shiftcard"><div><span id="shiftDot" class="dot"></span><b id="shiftText">Смена закрыта</b></div><div id="shiftMeta" class="meta" style="margin:6px 0 10px">МойСклад</div><button id="shiftBtn" style="width:100%;padding:10px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:800">Открыть смену</button></div></aside><main class="main"><div class="top"><h1>Касса A4-Принт</h1><div class="operator" id="operator">Оператор</div></div><div class="search"><input id="search" placeholder="Поиск товара, услуги, артикула или штрихкода"></div><div class="filters"><button class="on" data-t="ALL">Все</button><button data-t="PRODUCT">Товары</button><button data-t="SERVICE">Услуги</button></div><div id="goods" class="goods"></div></main><aside class="right"><div class="rhead"><div><b>Текущий чек</b><div id="count" class="meta">0 позиций</div></div><button id="clear" style="border:0;background:transparent;color:#ef4444">Очистить</button></div><div id="cart" class="cart"></div><div class="foot"><div class="client"><b>Клиент</b><input id="clientSearch" placeholder="Поиск по имени, телефону или email"><div id="clientResults"></div><input id="clientName" placeholder="Имя клиента"><input id="clientPhone" placeholder="Телефон"><textarea id="clientComment" placeholder="Комментарий для менеджеров"></textarea><button id="saveClient" style="padding:9px;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:9px;font-weight:800">Сохранить клиента</button></div><label class="field">Счёт<select id="account"></select></label><label class="field">Способ оплаты<select id="method"><option>Наличные</option><option>Карта</option><option>СБП</option><option>Банк</option></select></label><label class="field">Получено<input id="received" type="number" min="0" step="0.01" placeholder="0"></label><div class="total"><span>Итого</span><strong id="total">0 ₽</strong></div><div class="total"><span>Сдача</span><span id="change" class="change">0 ₽</span></div><button id="pay" class="pay">Оплатить чек</button></div></aside></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.A4PRINT_CONFIG||{},supabase=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id),rub=v=>Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';let session,profile,org,goods=[],cart=[],accounts=[],incomeCategory,shift=null,type='ALL',customer=null,searchTimer;const note=m=>{const n=$('notice');n.textContent=m;n.style.display='block';setTimeout(()=>n.style.display='none',2200)},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){const r=await fetch(cfg.apiBaseUrl+path,{...opt,headers:{Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||'Ошибка API');return d}async function init(){const s=await supabase.auth.getSession();session=s.data.session;if(!session)return location.replace('./login.html');const [{data:a},{data:o}]=await Promise.all([supabase.rpc('has_role',{required_role:'ADMIN'}),supabase.rpc('has_role',{required_role:'POS_OPERATOR'})]);if(!a&&!o)return location.replace('./login.html');const p=await supabase.from('users').select('id,full_name,email,is_active').eq('auth_user_id',session.user.id).maybeSingle();profile=p.data;if(profile&&profile.is_active===false)return logout();$('operator').textContent=profile?.full_name||session.user.email;const oo=await supabase.from('organizations').select('id').eq('code','A4PRINT').single();org=oo.data;const [g,ac,cat]=await Promise.all([supabase.from('catalog_items').select('*').eq('organization_id',org.id).eq('is_active',true).order('name'),supabase.from('cash_accounts').select('*').eq('organization_id',org.id).eq('is_active',true).order('name'),supabase.from('cash_categories').select('*').eq('organization_id',org.id).eq('direction','INCOME').eq('name','Оплата заказа').maybeSingle()]);goods=g.data||[];accounts=ac.data||[];incomeCategory=cat.data;$('account').innerHTML=accounts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');renderGoods();await loadShift();renderCart()}async function loadShift(){try{const d=await api('/api/v1/pos/shift');shift=d.shift||null;$('shiftDot').classList.toggle('open',!!shift);$('shiftText').textContent=shift?'Смена открыта':'Смена закрыта';$('shiftMeta').textContent=shift?`${d.store?.name||'Точка'} · ${new Date(shift.openDate).toLocaleString('ru-RU')}`:'МойСклад';$('shiftBtn').textContent=shift?'Закрыть смену':'Открыть смену';renderCart()}catch(e){note(e.message)}}function renderGoods(){const q=$('search').value.trim().toLowerCase();const rows=goods.filter(g=>(type==='ALL'||g.item_type===type)&&`${g.name} ${g.sku||''} ${g.article||''} ${g.barcode||''}`.toLowerCase().includes(q));$('goods').innerHTML=rows.map(g=>`<div class="card" data-id="${g.id}"><div><b>${esc(g.name)}</b><div class="meta">${esc(g.article||g.sku||'')}</div></div><div class="price">${rub(g.sale_price)}</div></div>`).join('')||'<div class="empty">Ничего не найдено</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>add(x.dataset.id))}function add(id){const g=goods.find(x=>x.id===id),x=cart.find(x=>x.id===id);if(!g)return;x?x.qty++:cart.push({id:g.id,name:g.name,price:Number(g.sale_price||0),qty:1});renderCart()}function renderCart(){const sum=cart.reduce((s,x)=>s+x.price*x.qty,0),n=cart.reduce((s,x)=>s+x.qty,0);$('count').textContent=n+' позиций';$('total').textContent=rub(sum);const received=Number($('received').value||0);$('change').textContent=rub(Math.max(0,received-sum));$('pay').disabled=!cart.length||!shift;$('pay').textContent=shift?`Оплатить чек (${rub(sum)})`:'Сначала откройте смену';$('cart').innerHTML=cart.map((x,i)=>`<div class="item"><div class="row"><b>${esc(x.name)}</b><strong>${rub(x.price*x.qty)}</strong></div><div class="qty"><button data-m="${i}">−</button><span>${x.qty}</span><button data-p="${i}">+</button><button data-r="${i}" style="margin-left:auto;border:0;background:transparent;color:#ef4444">Удалить</button></div></div>`).join('')||'<div class="empty">Добавьте товары или услуги</div>';document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;if(--cart[i].qty<1)cart.splice(i,1);renderCart()});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{cart[+b.dataset.p].qty++;renderCart()});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.r,1);renderCart()})}async function searchClient(q){if(q.trim().length<2)return $('clientResults').innerHTML='';try{const d=await api('/api/v1/pos/customers?q='+encodeURIComponent(q));$('clientResults').innerHTML=(d.customers||[]).slice(0,5).map(c=>`<button data-cid="${c.id}" style="width:100%;text-align:left;padding:7px;border:0;background:#fff;border-radius:7px">${esc(c.full_name)} <span class="meta">${esc(c.phone||'')}</span></button>`).join('');document.querySelectorAll('[data-cid]').forEach(b=>b.onclick=()=>{customer=(d.customers||[]).find(c=>c.id===b.dataset.cid);$('clientName').value=customer?.full_name||'';$('clientPhone').value=customer?.phone||'';$('clientResults').innerHTML=''})}catch(e){note(e.message)}}async function saveClient(){const name=$('clientName').value.trim();if(!name)return note('Укажите имя клиента');try{const d=await api('/api/v1/pos/customers',{method:'POST',body:JSON.stringify({id:customer?.id||null,full_name:name,phone:$('clientPhone').value.trim(),manager_comment:$('clientComment').value.trim()})});customer=d.customer;note('Клиент сохранён')}catch(e){note(e.message)}}async function pay(){if(!cart.length||!shift)return;const total=cart.reduce((s,x)=>s+x.price*x.qty,0);try{$('pay').disabled=true;const ms=await api('/api/v1/pos/sale',{method:'POST',body:JSON.stringify({items:cart,payment_method:$('method').value,customer_id:customer?.id||null})});const desc=`МойСклад ${ms.moysklad?.name||ms.moysklad?.id||''} · Оператор: ${profile?.full_name||session.user.email}`;const r=await supabase.from('cash_transactions').insert({organization_id:org.id,cash_account_id:$('account').value,category_id:incomeCategory?.id||null,customer_id:customer?.id||null,direction:'INCOME',amount:total,payment_method:$('method').value,description:desc,transaction_date:new Date().toISOString().slice(0,10),created_by:profile?.id||null});if(r.error)throw r.error;cart=[];customer=null;$('clientName').value='';$('clientPhone').value='';$('clientComment').value='';$('received').value='';renderCart();note('Продажа проведена')}catch(e){note('Ошибка продажи: '+e.message)}finally{renderCart()}}async function toggleShift(){try{await api(shift?'/api/v1/pos/shift/close':'/api/v1/pos/shift/open',{method:'POST'});await loadShift()}catch(e){note(e.message)}}async function logout(){await supabase.auth.signOut();location.replace('./login.html')}$('search').oninput=renderGoods;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');type=b.dataset.t;renderGoods()});$('clear').onclick=()=>{cart=[];renderCart()};$('received').oninput=renderCart;$('clientSearch').oninput=e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>searchClient(e.target.value),250)};$('saveClient').onclick=saveClient;$('pay').onclick=pay;$('shiftBtn').onclick=toggleShift;$('logoutSide').onclick=logout;init();</script></body></html>
