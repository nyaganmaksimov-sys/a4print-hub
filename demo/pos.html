<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS — DEMO</title><link rel="stylesheet" href="./demo.css"></head><body><div class="demo-banner"><b>ДЕМО-РЕЖИМ</b> · касса №1 · оператор Анна DEMO</div><main class="main"><div class="topline"><div><h1>Касса / POS</h1><div class="muted">Учебная смена · реальные чеки и платежи не создаются</div></div><div class="actions"><button class="btn light" onclick="location.reload()">Новая продажа</button><a class="btn" href="./">Выбор демо</a></div></div><div class="pos-wrap"><section><h2>Каталог</h2><div class="catalog"><button class="pos-item" data-name="Печать A4 цветная" data-price="35"><b>Печать A4 цветная</b><p class="muted">35 ₽</p></button><button class="pos-item" data-name="Печать A4 ч/б" data-price="15"><b>Печать A4 ч/б</b><p class="muted">15 ₽</p></button><button class="pos-item" data-name="Ламинирование A4" data-price="120"><b>Ламинирование A4</b><p class="muted">120 ₽</p></button><button class="pos-item" data-name="Фото 10×15" data-price="25"><b>Фото 10×15</b><p class="muted">25 ₽</p></button><button class="pos-item" data-name="Переплёт" data-price="250"><b>Переплёт</b><p class="muted">250 ₽</p></button><button class="pos-item" data-name="Сканирование" data-price="30"><b>Сканирование</b><p class="muted">30 ₽</p></button></div></section><aside class="card"><h2>Корзина</h2><div id="cart"><div class="muted">Нажмите на услугу слева</div></div><div class="total" id="total">0 ₽</div><button class="btn" id="pay" style="width:100%">Оплатить DEMO</button><button class="btn light" id="clear" style="width:100%;margin-top:8px">Очистить</button><div id="msg" class="muted" style="margin-top:12px"></div></aside></div><section class="section"><h2>Последние продажи</h2><table class="table"><tbody><tr><td>14:18</td><td>Печать + ламинация</td><td>470 ₽</td><td><span class="badge green">Оплачено</span></td></tr><tr><td>13:42</td><td>Фото 10×15, 12 шт.</td><td>300 ₽</td><td><span class="badge green">Оплачено</span></td></tr><tr><td>12:55</td><td>Переплёт</td><td>250 ₽</td><td><span class="badge gray">Наличные</span></td></tr></tbody></table></section></main><script>let items=[];const cart=document.getElementById('cart'),total=document.getElementById('total'),msg=document.getElementById('msg');function draw(){cart.innerHTML=items.length?items.map(x=>`<div class="cart-line"><span>${x.name}</span><b>${x.price} ₽</b></div>`).join(''):'<div class="muted">Корзина пуста</div>';total.textContent=items.reduce((s,x)=>s+x.price,0).toLocaleString('ru-RU')+' ₽'}document.querySelectorAll('.pos-item').forEach(b=>b.onclick=()=>{items.push({name:b.dataset.name,price:+b.dataset.price});msg.textContent='';draw()});document.getElementById('clear').onclick=()=>{items=[];draw()};document.getElementById('pay').onclick=()=>{if(!items.length){msg.textContent='Добавьте позиции';return}msg.innerHTML='<span class="badge green">DEMO-чек создан ✓</span>';items=[];draw()};</script></body></html>
